/* ── Persona identity: one hue per lane, drawn from the token set ──── */
const LANE = {
  D2: { hue: 'var(--s-blue)',    label: 'Page 10',    short: 'Shpr' },
  D3: { hue: 'var(--s-violet)',  label: 'Page 11',    short: 'Disp' },
  D4: { hue: 'var(--s-orange)',  label: 'Page 12',    short: 'Drv'  },
  D5: { hue: 'var(--s-amber)',   label: 'Page 13-14', short: 'Ops'  },
};
const WHO_HUE = [
  [/Shpr|Shipper/i, 'var(--s-blue)'],
  [/Disp|Carrier/i, 'var(--s-violet)'],
  [/Drv|Driver/i,   'var(--s-orange)'],
  [/Ops|System|Admin/i, 'var(--s-amber)'],
  [/Cnsg|Consignee/i, 'var(--s-magenta)'],
];

const ID_RE = /\b(SCR-\d+|ERR-\d+|BR-\d+|FR-\d+|FRD|F\d{1,2}|EVT-\d+|ENT-\d+|PERM-\d+|EC-\d+|ROLE-\d+|API-\d+|DEC-[A-Z0-9/-]+|OS&D|TONU|HOS)\b/g;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
/** markdown-lite → html: `code`, **bold**, plus ID auto-coding */
function rich(s) {
  let t = esc(s);
  t = t.replace(/`([^`]+)`/g, (_, m) => `<code>${m}</code>`);
  t = t.replace(/\*\*([^*]+)\*\*/g, (_, m) => `<strong>${m}</strong>`);
  t = t.replace(/(<code>.*?<\/code>)|([^<]+)/g, (m, code, txt) => code || txt.replace(ID_RE, (id) => `<code>${id}</code>`));
  return t;
}
function plain(s) {
  return String(s == null ? '' : s).replace(/[`*]/g, '');
}
const nonTrivial = (s) => { const t = plain(s).trim(); return t && !/^(—|-|n\/a|na|none)\.?$/i.test(t); };

/* ── Node model ────────────────────────────────────────────────────── */
let NODES = [];      // every clickable node with layout box
let LANES = [];      // lane boxes
let CLUSTERS = [];   // cluster boxes
let EDGES = [];      // {from,to,kind}
let W = 0, H = 0;

const CARD_W = 244, CARD_H = 138, GAP_X = 20, GAP_Y = 18, ROWS = 3;
const CL_PAD = 16, CL_GAP = 56, LANE_PAD = 22, LANE_GAP = 64, LANE_HD_W = 240;

function stepTags(st) {
  const blob = `${st.frame} ${st.sees} ${st.does} ${st.system} ${st.next} ${st.fails}`;
  const tags = [];
  if (/\[BUILT\]|\(built\)/i.test(st.frame) || /\[BUILT\]/i.test(blob)) tags.push('built');
  if (/\[NEW/i.test(st.frame)) tags.push('new');
  if (/NEEDS INPUT/i.test(blob)) tags.push('input');
  if (nonTrivial(st.fails)) tags.push('fail');
  if (st.prose) tags.push('prose');
  return tags;
}

function layout() {
  NODES = []; LANES = []; CLUSTERS = []; EDGES = [];
  let y = 0;

  /* Baton rail — D6 §1 lifecycle, the shared spine every lane hangs off */
  const batonRow = DATA.lifecycle.map((lc, i) => ({ ...lc, i }));
  const batonW = batonRow.length * (232 + 8);
  LANES.push({ kind: 'baton', x: 0, y: 0, w: Math.max(batonW, 1200), h: 132, rows: batonRow });
  y = 132 + LANE_GAP;

  /* One lane per persona page */
  DATA.flows.forEach((flow) => {
    const laneY = y;
    let x = LANE_HD_W + LANE_PAD;
    let maxH = 0;
    const laneClusters = [];

    flow.sections.forEach((sec, si) => {
      const items = [];
      sec.steps.forEach((st) => items.push({ type: 'step', st }));
      sec.branches.forEach((br, bi) => items.push({ type: 'fork', br, bi }));
      sec.notes.slice(0, 2).forEach((nt, ni) => items.push({ type: 'note', nt, ni }));
      if (!items.length) return;

      const cols = Math.ceil(items.length / ROWS);
      const clW = cols * CARD_W + (cols - 1) * GAP_X + CL_PAD * 2;
      const rowsUsed = Math.min(items.length, ROWS);
      const clH = rowsUsed * CARD_H + (rowsUsed - 1) * GAP_Y + CL_PAD * 2 + 30;
      const cl = {
        x, y: laneY + 74, w: clW, h: clH,
        title: plain(sec.title), ix: `${flow.code} §${si + 1}`, flow: flow.code, key: sec.key,
      };
      CLUSTERS.push(cl);
      laneClusters.push(cl);

      let prevUid = null;
      items.forEach((it, k) => {
        const col = Math.floor(k / ROWS), row = k % ROWS;
        const nx = cl.x + CL_PAD + col * (CARD_W + GAP_X);
        const ny = cl.y + CL_PAD + 30 + row * (CARD_H + GAP_Y);
        const base = { x: nx, y: ny, w: CARD_W, h: CARD_H, flow: flow.code, cluster: cl.key, section: sec.title };
        if (it.type === 'step') {
          const uid = it.st.uid;
          NODES.push({ ...base, kind: 'step', uid, st: it.st, tags: stepTags(it.st), persona: flow.persona });
          if (prevUid) EDGES.push({ from: prevUid, to: uid, kind: 'seq' });
          prevUid = uid;
        } else if (it.type === 'fork') {
          const uid = `${flow.code}:${sec.key}:fork${it.bi}`;
          NODES.push({ ...base, kind: 'fork', uid, br: it.br, tags: ['fork'], persona: flow.persona });
          if (prevUid) EDGES.push({ from: prevUid, to: uid, kind: 'fork' });
          prevUid = uid;
        } else {
          const uid = `${flow.code}:${sec.key}:note${it.ni}`;
          NODES.push({ ...base, h: 96, kind: 'note', uid, nt: it.nt, tags: [], persona: flow.persona });
        }
      });
      x += clW + CL_GAP;
      maxH = Math.max(maxH, clH);
    });

    /* cluster → cluster handoff */
    for (let i = 0; i < laneClusters.length - 1; i++) {
      const a = laneClusters[i], b = laneClusters[i + 1];
      const lastA = [...NODES].reverse().find((n) => n.cluster === a.key && n.kind !== 'note');
      const firstB = NODES.find((n) => n.cluster === b.key && n.kind !== 'note');
      if (lastA && firstB) EDGES.push({ from: lastA.uid, to: firstB.uid, kind: 'hand' });
    }

    const laneH = maxH + 96;
    LANES.push({
      kind: 'flow', x: 0, y: laneY, w: x - CL_GAP + LANE_PAD, h: laneH,
      code: flow.code, persona: flow.persona, page: flow.page,
      steps: flow.sections.reduce((n, s) => n + s.steps.length, 0), file: flow.file,
    });
    y = laneY + laneH + LANE_GAP;
  });

  /* Index blocks */
  const frameBlock = { kind: 'frames', x: 0, y, w: 4 * 250 + 3 * 10, h: 140 + Math.ceil(DATA.frames.length / 4) * 82 };
  LANES.push(frameBlock);
  y += frameBlock.h + LANE_GAP;
  const gapBlock = { kind: 'gaps', x: 0, y, w: 3 * 340 + 2 * 12, h: 140 + Math.ceil(DATA.gaps.length / 3) * 176 };
  LANES.push(gapBlock);
  y += gapBlock.h + LANE_GAP;
  const decBlock = { kind: 'decisions', x: 0, y, w: 3 * 340 + 2 * 12, h: 150 + DATA.decisions.length * 150 };
  LANES.push(decBlock);
  y += decBlock.h + 80;

  W = Math.max(...LANES.map((l) => l.x + l.w)) + 80;
  H = y;
}

/* ── Render ────────────────────────────────────────────────────────── */
const world = document.getElementById('world');
const svg = document.getElementById('edges');

function render() {
  [...world.children].forEach((c) => { if (c !== svg) c.remove(); });
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const frag = document.createDocumentFragment();

  LANES.forEach((l) => {
    if (l.kind === 'baton') {
      const d = document.createElement('div');
      d.className = 'baton';
      d.style.cssText = `left:0;top:${l.y}px`;
      d.innerHTML = `<div class="hd">Load lifecycle — one baton, ${DATA.lifecycle.length} handovers <span style="color:var(--text-tertiary);text-transform:none;letter-spacing:0;font-weight:400">· D6 §1 · click a state to spotlight the screens that own it</span></div>
        <div class="row">${l.rows.map((r) => {
          const who = plain(r.who);
          const hue = (WHO_HUE.find(([re]) => re.test(who)) || [null, 'var(--border-strong)'])[1];
          return `<button class="bchip" style="--who:${hue}" data-baton="${esc(r.states)}">
            <span class="st">${rich(r.states)}</span>
            <span class="wh">${esc(who.split('(')[0].trim() || '—')}</span>
            <span class="se">${rich(r.sees)}</span></button>`;
        }).join('')}</div>`;
      frag.appendChild(d);
      return;
    }
    if (l.kind === 'flow') {
      const lane = document.createElement('div');
      lane.className = 'lane';
      lane.style.cssText = `left:${l.x}px;top:${l.y}px;width:${l.w}px;height:${l.h}px`;
      frag.appendChild(lane);
      const hd = document.createElement('div');
      hd.className = 'lane-hd';
      hd.style.cssText = `left:${l.x + LANE_PAD}px;top:${l.y + LANE_PAD}px;width:${LANE_HD_W - 30}px`;
      hd.innerHTML = `<span class="pill" style="background:${LANE[l.code].hue}">${esc(LANE[l.code].label)}</span>
        <span class="ttl">${esc(l.persona)}</span>
        <span class="sub">${l.steps} steps · ${esc(l.file)}</span>`;
      frag.appendChild(hd);
      return;
    }
    /* index blocks */
    const blk = document.createElement('div');
    blk.className = 'blk';
    blk.style.cssText = `left:${l.x}px;top:${l.y}px;width:${l.w}px`;
    if (l.kind === 'frames') {
      blk.innerHTML = `<div class="blk-hd">Frame index</div>
        <div class="blk-sub">${DATA.frames.length} frames — 31 canonical + 10 <code>[NEW]</code> · ${DATA.frames.filter((f) => /^\**built/i.test(f.status.trim()) && !/up to/i.test(f.status)).length} built and verified, 1 built only up to a blocked fork · every frame is one state (spine §3) · DESIGN-STRUCTURE.md §2</div>
        <div class="fgrid">${DATA.frames.map((f, i) => {
          // "Spec only — unreachable in built shell" contains the word built but is
          // NOT built: only a status that STARTS with Built counts.
          const built = /^\**built/i.test(f.status.trim()) && !/up to/i.test(f.status);
          const partial = /^\**built/i.test(f.status.trim()) && /up to/i.test(f.status);
          const blocked = /blocked|unfulfillable|no design coverage/i.test(f.status);
          const isNew = /NEW/.test(f.scr) || /NEW/.test(f.source);
          const hue = built ? 'var(--s-blue)' : (blocked || partial) ? 'var(--s-amber)' : 'var(--s-violet)';
          return `<button class="fcard" style="--st:${hue}" data-frame="${i}">
            <span class="id">SCR-${esc(plain(f.scr).replace(/\[NEW\]\s*/, ''))}${isNew ? ' · NEW' : ''}</span>
            <span class="nm">${esc(f.screen)}</span>
            <span class="st">${rich(f.status)}</span></button>`;
        }).join('')}</div>`;
    } else if (l.kind === 'gaps') {
      blk.innerHTML = `<div class="blk-hd">Gap register</div>
        <div class="blk-sub">${DATA.gaps.length} findings, ranked by consequence if shipped as-is · DESIGN-GAPS.md</div>
        <div class="ggrid">${DATA.gaps.map((g, i) => {
          const cls = /CLOSED|RECONCILED/i.test(g.gap) ? 'closed' : /SOURCE CONFLICT/i.test(g.gap) ? 'conflict' : '';
          return `<button class="gcard ${cls}" data-gap="${i}">
            <span class="rank">#${esc(g.n)}</span>
            <span class="ttl">${rich(g.gap)}</span>
            <span class="cons">${rich(g.consequence)}</span></button>`;
        }).join('')}</div>`;
    } else {
      blk.innerHTML = `<div class="blk-hd">Build-blocking decisions</div>
        <div class="blk-sub">${DATA.decisions.length} open — stated with options and consequences only, never decided here · DESIGN-STRUCTURE.md §4</div>
        <div class="ggrid" style="grid-template-columns:repeat(3,340px)">${DATA.decisions.map((d, i) =>
          `<button class="gcard conflict" data-dec="${i}"><span class="rank">Open decision</span>
            <span class="ttl">${rich(d.title)}</span>
            <span class="cons">${rich(d.body.slice(0, 220))}…</span></button>`).join('')}</div>`;
    }
    frag.appendChild(blk);
  });

  CLUSTERS.forEach((cl) => {
    const d = document.createElement('div');
    d.className = 'cl';
    d.style.cssText = `left:${cl.x}px;top:${cl.y}px;width:${cl.w}px;height:${cl.h}px`;
    frag.appendChild(d);
    const t = document.createElement('div');
    t.className = 'cl-ttl';
    t.style.cssText = `left:${cl.x + CL_PAD}px;top:${cl.y + CL_PAD - 2}px;max-width:${cl.w - CL_PAD * 2}px`;
    t.innerHTML = `<span class="ix">${esc(cl.ix)}</span> ${esc(cl.title)}`;
    frag.appendChild(t);
  });

  NODES.forEach((n) => {
    const b = document.createElement('button');
    b.className = `card ${n.kind === 'fork' ? 'fork' : ''} ${n.kind === 'note' ? 'note' : ''}`;
    b.style.cssText = `left:${n.x}px;top:${n.y}px;height:${n.h}px`;
    b.dataset.uid = n.uid;
    if (n.kind === 'step') {
      const st = n.st;
      b.innerHTML = `<span class="top"><span class="sid" style="background:${LANE[n.flow].hue}">${esc(st.id)}</span>
          <span class="frame">${esc(plain(st.frame).replace(/\[(BUILT|NEW[^\]]*)\]/g, '').trim())}</span></span>
        <span class="does">${rich(st.does || st.sees)}</span>
        <span class="sys">${rich(st.system)}</span>
        <span class="tags">${n.tags.map((t) => `<span class="tag ${t}">${t === 'fail' ? '✕ fail path' : t === 'built' ? '● built' : t === 'new' ? '◆ new' : t === 'input' ? '▲ needs input' : '¶ prose'}</span>`).join('')}</span>`;
      b.setAttribute('aria-label', `Step ${plain(st.id)} — ${plain(st.frame)}`);
    } else if (n.kind === 'fork') {
      const hdr = n.br.header.map(plain);
      b.innerHTML = `<span class="top"><span class="sid">fork</span><span class="frame">${esc(hdr.slice(0, 2).join(' → '))}</span></span>
        <span class="rows">${n.br.rows.slice(0, 4).map((r) => `<span>${rich(`${plain(r[0])} → ${plain(r[1] || '')}`)}</span>`).join('')}</span>
        <span class="tags"><span class="tag fork">⑃ ${n.br.rows.length} branches</span></span>`;
      b.setAttribute('aria-label', `Branch table with ${n.br.rows.length} outcomes`);
    } else {
      b.innerHTML = `<span class="does">${rich(n.nt.slice(0, 220))}</span>`;
      b.setAttribute('aria-label', 'Design note');
    }
    frag.appendChild(b);
  });

  world.appendChild(frag);
  drawEdges();
}

function nodeByUid(uid) { return NODES.find((n) => n.uid === uid); }

function drawEdges() {
  const showFail = FILTERS.has('fail');
  const parts = [];
  parts.push(`<defs>
    <marker id="ar" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--accent)"/></marker>
    <marker id="arf" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--s-orange)"/></marker>
  </defs>`);
  EDGES.forEach((e) => {
    const a = nodeByUid(e.from), b = nodeByUid(e.to);
    if (!a || !b) return;
    const col = e.kind === 'fork' ? 'var(--s-orange)' : 'var(--accent)';
    const marker = e.kind === 'fork' ? 'arf' : 'ar';
    let d;
    if (Math.abs(a.x - b.x) < 4) {                    // same column, stacked
      d = `M${a.x + a.w / 2} ${a.y + a.h} L${b.x + b.w / 2} ${b.y - 4}`;
    } else if (b.x > a.x) {                            // next column / cluster
      const ax = a.x + a.w, ay = a.y + a.h / 2, bx = b.x - 4, by = b.y + b.h / 2;
      const mid = ax + Math.max(18, (bx - ax) / 2);
      d = `M${ax} ${ay} H${mid} V${by} H${bx}`;
    } else {
      const ax = a.x + a.w / 2, ay = a.y + a.h, bx = b.x + b.w / 2, by = b.y - 4;
      const mid = Math.max(ay, by) + 26;
      d = `M${ax} ${ay} V${mid} H${bx} V${by}`;
    }
    parts.push(`<path d="${d}" fill="none" stroke="${col}" stroke-width="${e.kind === 'hand' ? 2 : 1.4}"
      opacity="${e.kind === 'hand' ? .95 : .5}" marker-end="url(#${marker})"
      ${e.kind === 'hand' ? '' : ''} />`);
  });
  if (showFail) {
    NODES.forEach((n) => {
      if (n.kind !== 'step' || !n.tags.includes('fail')) return;
      const x = n.x + n.w - 26, y = n.y + n.h;
      parts.push(`<path d="M${x} ${y} l0 14 l16 0" fill="none" stroke="var(--s-magenta)" stroke-width="1.6"
        stroke-dasharray="4 3" opacity=".85"/><circle cx="${x + 18}" cy="${y + 14}" r="3" fill="var(--s-magenta)"/>`);
    });
  }
  svg.innerHTML = parts.join('');
}

/* ── Rail ──────────────────────────────────────────────────────────── */
function buildRail() {
  const rail = document.getElementById('rail');
  const flowItems = DATA.flows.map((f) => {
    const lane = LANES.find((l) => l.code === f.code);
    return `<button class="rail-item" data-goto="${f.code}"><span class="pg">${esc(f.page)}</span>
      <span>Flow — ${esc(f.persona.replace(' (mobile)', ''))}</span><span class="n">${lane ? lane.steps : 0}</span></button>`;
  }).join('');
  rail.innerHTML = `
    <h2>Pages</h2>
    <button class="rail-item" data-goto="baton"><span class="pg">20</span><span>Cross-flow · lifecycle</span><span class="n">${DATA.lifecycle.length}</span></button>
    ${flowItems}
    <button class="rail-item" data-goto="frames"><span class="pg">02</span><span>Frame index</span><span class="n">${DATA.frames.length}</span></button>
    <button class="rail-item" data-goto="gaps"><span class="pg">90</span><span>Gap register</span><span class="n">${DATA.gaps.length}</span></button>
    <button class="rail-item" data-goto="decisions"><span class="pg">—</span><span>Open decisions</span><span class="n">${DATA.decisions.length}</span></button>
    <h2>Sections</h2>
    ${CLUSTERS.map((c) => `<button class="rail-item" data-cluster="${esc(c.key)}"><span class="pg">${esc(c.ix)}</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.title.replace(/^\d+\.\s*/, ''))}</span></button>`).join('')}
    <p class="rail-note">Every card is sourced — no step, branch or frame here was invented for the picture. Steps come from
      <code>design/D2-D5</code>, the lifecycle from <code>D6 §1</code>, frames from <code>DESIGN-STRUCTURE.md §2</code>,
      findings from <code>DESIGN-GAPS.md</code>. <code>SCR-924</code>'s seven POD sub-steps are transcribed from D4 §7 prose
      and tagged <code>¶ prose</code>.</p>`;
}

/* ── Pan / zoom ────────────────────────────────────────────────────── */
const stage = document.getElementById('stage');
let scale = 1, tx = 0, ty = 0;

function apply() {
  world.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  document.getElementById('lvl').textContent = Math.round(scale * 100) + '%';
}
function clampScale(s) { return Math.min(2.2, Math.max(0.08, s)); }
function zoomAt(cx, cy, factor) {
  const ns = clampScale(scale * factor);
  const k = ns / scale;
  tx = cx - (cx - tx) * k;
  ty = cy - (cy - ty) * k;
  scale = ns;
  apply();
}
function fit(box) {
  const r = stage.getBoundingClientRect();
  const b = box || { x: 0, y: 0, w: W, h: H };
  const pad = 40;
  scale = clampScale(Math.min((r.width - pad * 2) / b.w, (r.height - pad * 2) / b.h));
  tx = pad - b.x * scale + Math.max(0, (r.width - pad * 2 - b.w * scale) / 2);
  ty = pad - b.y * scale;
  apply();
}
function goTo(box, targetScale) {
  const r = stage.getBoundingClientRect();
  scale = clampScale(targetScale || Math.min(0.85, (r.width - 120) / box.w));
  tx = 60 - box.x * scale;
  ty = 80 - box.y * scale;
  apply();
}

let dragging = false, sx = 0, sy = 0;
stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.card, .bchip, .fcard, .gcard')) return;
  dragging = true; sx = e.clientX - tx; sy = e.clientY - ty;
  stage.classList.add('drag'); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  tx = e.clientX - sx; ty = e.clientY - sy; apply();
});
stage.addEventListener('pointerup', (e) => { dragging = false; stage.classList.remove('drag'); try { stage.releasePointerCapture(e.pointerId); } catch (_) {} });
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.89);
  else { tx -= e.deltaX; ty -= e.deltaY; apply(); }
}, { passive: false });

document.getElementById('zin').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.2); };
document.getElementById('zout').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 0.83); };
document.getElementById('zfit').onclick = () => fit();
document.getElementById('theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
};

/* ── Inspector ─────────────────────────────────────────────────────── */
const app = document.getElementById('app');
const insp = document.getElementById('insp');
let selected = null;

function fld(k, v, cls) {
  if (!nonTrivial(v)) return '';
  return `<div class="fld ${cls || ''}"><div class="k">${esc(k)}</div><div class="v">${rich(v)}</div></div>`;
}
function closeInsp() {
  app.classList.remove('has-insp');
  document.querySelectorAll('.card.sel').forEach((c) => c.classList.remove('sel'));
  selected = null;
}
function openStep(n) {
  selected = n.uid;
  document.querySelectorAll('.card.sel').forEach((c) => c.classList.remove('sel'));
  const el = world.querySelector(`[data-uid="${CSS.escape(n.uid)}"]`);
  if (el) el.classList.add('sel');
  app.classList.add('has-insp');

  if (n.kind === 'step') {
    const st = n.st;
    insp.innerHTML = `
      <div class="insp-hd">
        <div class="row1"><span class="sid" style="background:${LANE[n.flow].hue}">${esc(st.id)}</span>
          <span style="font-size:11px;color:var(--text-tertiary)">${esc(n.persona)}</span>
          <button class="close" id="x" aria-label="Close inspector">×</button></div>
        <div class="frame">${rich(st.frame)}</div>
        <div class="where">${esc(plain(n.section))} · <code>${esc(st.src)}</code></div>
        <div class="tags" style="display:flex;gap:4px;margin-top:8px">${n.tags.map((t) => `<span class="tag ${t}">${t}</span>`).join('')}</div>
      </div>
      <div class="fields">
        ${fld('User sees', st.sees)}
        ${fld('User does', st.does)}
        ${fld('System does', st.system)}
        ${fld('Goes to', st.next)}
        ${fld('If it fails', st.fails, 'is-fail')}
      </div>`;
  } else if (n.kind === 'fork') {
    const h = n.br.header;
    insp.innerHTML = `
      <div class="insp-hd"><div class="row1"><span class="sid" style="background:var(--s-orange)">fork</span>
        <span style="font-size:11px;color:var(--text-tertiary)">${esc(n.persona)}</span>
        <button class="close" id="x" aria-label="Close inspector">×</button></div>
        <div class="frame">${n.br.rows.length} branches</div>
        <div class="where">${esc(plain(n.section))}</div></div>
      <div class="fields"><div class="fld"><div class="itbl-wrap"><table class="itbl">
        <thead><tr>${h.map((c) => `<th>${esc(plain(c))}</th>`).join('')}</tr></thead>
        <tbody>${n.br.rows.map((r) => `<tr>${r.map((c) => `<td>${rich(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div></div></div>`;
  } else {
    insp.innerHTML = `<div class="insp-hd"><div class="row1"><span class="sid" style="background:var(--border-strong)">note</span>
      <button class="close" id="x" aria-label="Close inspector">×</button></div>
      <div class="where">${esc(plain(n.section))}</div></div>
      <div class="fields">${fld('Design note', n.nt)}</div>`;
  }
  insp.querySelector('#x').onclick = closeInsp;
  insp.scrollTop = 0;
}
function openRecord(kind, i) {
  app.classList.add('has-insp');
  if (kind === 'frame') {
    const f = DATA.frames[i];
    insp.innerHTML = `<div class="insp-hd"><div class="row1"><span class="sid">SCR-${esc(plain(f.scr).replace(/\[NEW\]\s*/, ''))}</span>
      <button class="close" id="x" aria-label="Close inspector">×</button></div>
      <div class="frame">${esc(f.screen)}</div><div class="where">${rich(f.persona)}</div></div>
      <div class="fields">${fld('Status', f.status)}${fld('Source', f.source)}
      ${fld('Reminder', 'Every frame is one state — a screen with six states is six frames (spine §3). Core state set: `Default` · `Loading` · `Empty` · `Partial data` · `Stale data` · `Permission denied` · `Error` · `Offline`.')}</div>`;
  } else if (kind === 'gap') {
    const g = DATA.gaps[i];
    insp.innerHTML = `<div class="insp-hd"><div class="row1"><span class="sid" style="background:var(--s-magenta);color:#fff">gap #${esc(g.n)}</span>
      <button class="close" id="x" aria-label="Close inspector">×</button></div>
      <div class="frame">${rich(g.gap)}</div><div class="where">DESIGN-GAPS.md</div></div>
      <div class="fields">${fld('What is missing', g.missing)}${fld('Found by', g.found)}
      ${fld('Consequence if shipped as-is', g.consequence, 'is-fail')}${fld('What closing it requires', g.closing)}</div>`;
  } else {
    const d = DATA.decisions[i];
    insp.innerHTML = `<div class="insp-hd"><div class="row1"><span class="sid" style="background:var(--s-amber);color:#12151b">open</span>
      <button class="close" id="x" aria-label="Close inspector">×</button></div>
      <div class="frame">${rich(d.title)}</div><div class="where">DESIGN-STRUCTURE.md §4 — options only, not decided</div></div>
      <div class="fields">${fld('Detail', d.body)}</div>`;
  }
  insp.querySelector('#x').onclick = closeInsp;
  insp.scrollTop = 0;
}

world.addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (card) { const n = nodeByUid(card.dataset.uid); if (n) openStep(n); return; }
  const f = e.target.closest('.fcard'); if (f) return openRecord('frame', +f.dataset.frame);
  const g = e.target.closest('.gcard');
  if (g) {
    if (g.dataset.gap !== undefined) return openRecord('gap', +g.dataset.gap);
    if (g.dataset.dec !== undefined) return openRecord('dec', +g.dataset.dec);
  }
  const b = e.target.closest('.bchip');
  if (b) { document.getElementById('q').value = plain(b.dataset.baton).split('→')[0].replace(/[`]/g, ''); runSearch(); }
});

/* ── Search + filters ──────────────────────────────────────────────── */
const FILTERS = new Set(['fail']);
function haystack(n) {
  if (n.kind === 'step') {
    const s = n.st;
    return plain(`${s.id} ${s.frame} ${s.sees} ${s.does} ${s.system} ${s.next} ${s.fails} ${n.section} ${n.persona}`).toLowerCase();
  }
  if (n.kind === 'fork') return plain(`${n.br.header.join(' ')} ${n.br.rows.flat().join(' ')} ${n.section}`).toLowerCase();
  return plain(`${n.nt} ${n.section}`).toLowerCase();
}
function runSearch() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const wantBuilt = FILTERS.has('built'), wantNew = FILTERS.has('new'),
        wantFork = FILTERS.has('fork'), wantInput = FILTERS.has('input');
  let hits = 0, first = null;
  NODES.forEach((n) => {
    const el = world.querySelector(`[data-uid="${CSS.escape(n.uid)}"]`);
    if (!el) return;
    let ok = true;
    if (q) ok = haystack(n).includes(q);
    if (ok && wantBuilt) ok = n.tags.includes('built');
    if (ok && wantNew) ok = n.tags.includes('new');
    if (ok && wantFork) ok = n.kind === 'fork';
    if (ok && wantInput) ok = n.tags.includes('input');
    const filtering = q || wantBuilt || wantNew || wantFork || wantInput;
    el.classList.toggle('dim', filtering && !ok);
    el.classList.toggle('hit', !!q && ok);
    if (ok && filtering) { hits++; if (!first) first = n; }
  });
  const total = NODES.filter((n) => n.kind === 'step').length;
  document.getElementById('counts').innerHTML = (q || wantBuilt || wantNew || wantFork || wantInput)
    ? `<b>${hits}</b> match`
    : `<b>${total}</b> steps · <b>${NODES.filter((n) => n.kind === 'fork').length}</b> branch tables · <b>${DATA.frames.length}</b> frames · <b>${DATA.gaps.length}</b> gaps`;
  if (first && q) goTo({ x: first.x - 80, y: first.y - 120, w: 900, h: 600 }, Math.max(scale, 0.7));
}
document.getElementById('q').addEventListener('input', runSearch);
document.getElementById('filters').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  const f = b.dataset.f;
  if (FILTERS.has(f)) FILTERS.delete(f); else FILTERS.add(f);
  b.setAttribute('aria-pressed', FILTERS.has(f) ? 'true' : 'false');
  if (f === 'fail') drawEdges(); else runSearch();
});

document.getElementById('rail').addEventListener('click', (e) => {
  const b = e.target.closest('.rail-item'); if (!b) return;
  document.querySelectorAll('.rail-item.on').forEach((x) => x.classList.remove('on'));
  b.classList.add('on');
  if (b.dataset.cluster) {
    const cl = CLUSTERS.find((c) => c.key === b.dataset.cluster);
    if (cl) goTo({ x: cl.x - 30, y: cl.y - 60, w: cl.w + 60, h: cl.h + 90 }, 0.9);
    return;
  }
  const key = b.dataset.goto;
  const lane = LANES.find((l) => l.code === key || l.kind === key);
  if (lane) goTo({ x: lane.x, y: lane.y - 10, w: Math.min(lane.w, 2400), h: lane.h });
});

addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.id !== 'q') { e.preventDefault(); document.getElementById('q').focus(); }
  else if (e.key === 'Escape') { closeInsp(); if (document.activeElement.id === 'q') { document.getElementById('q').value = ''; runSearch(); } }
  else if (e.key === '0') fit();
  else if ((e.key === '+' || e.key === '=') && !e.ctrlKey) { const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.2); }
  else if (e.key === '-' && !e.ctrlKey) { const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 0.83); }
});
addEventListener('resize', () => apply());

/* ── Boot ──────────────────────────────────────────────────────────── */
layout();
render();
buildRail();
runSearch();
const firstLane = LANES.find((l) => l.kind === 'flow');
goTo({ x: 0, y: 0, w: 2200, h: (firstLane ? firstLane.y + firstLane.h : 900) }, 0.6);
window.__map = { NODES, LANES, CLUSTERS, EDGES, DATA };
</script>
