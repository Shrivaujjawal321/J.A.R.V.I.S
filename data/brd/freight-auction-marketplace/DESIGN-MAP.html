<meta charset="utf-8">
<title>Freight Marketplace — Design Map</title>
<style>
/* ───────────────────────────────────────────────────────────────────────
   Tokens — lifted verbatim from prototype.html so this map and the built
   prototype are the same product. Dark is primary (design-spine §7.3).
   Status hues are the IBM colour-blind-safe set; status is always
   colour + icon + text, never colour alone.
   ─────────────────────────────────────────────────────────────────────── */
:root {
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;

  --bg-canvas: #0a0c10;
  --bg-surface: #12151b;
  --bg-surface-2: #181c24;
  --bg-surface-3: #1f242e;
  --grid-dot: #1b2029;
  --border-subtle: #232833;
  --border-default: #323a48;
  --border-strong: #4a5264;
  --text-primary: #f2f4f7;
  --text-secondary: #aab2c0;
  --text-tertiary: #7c8494;
  --accent: #8fb2ff;
  --accent-strong: #b3ccff;
  --accent-ink: #0a0c10;
  --focus-ring: #8fb2ff;
  --s-blue: #648fff;
  --s-violet: #785ef0;
  --s-magenta: #dc267f;
  --s-orange: #fe6100;
  --s-amber: #ffb000;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4);
  --shadow-2: 0 10px 30px rgba(0,0,0,.55);

  --rail: 250px;
  --insp: 400px;
  --card-w: 244px;
  --card-h: 138px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    --bg-canvas: #f6f7f9;
    --bg-surface: #ffffff;
    --bg-surface-2: #eef0f4;
    --bg-surface-3: #e3e6ec;
    --grid-dot: #dfe3ea;
    --border-subtle: #e3e6ec;
    --border-default: #cdd2dc;
    --border-strong: #a7aebb;
    --text-primary: #12151b;
    --text-secondary: #454c59;
    --text-tertiary: #5b6270;
    --accent: #2c4fc4;
    --accent-strong: #1f3ea3;
    --accent-ink: #ffffff;
    --focus-ring: #2c4fc4;
    --s-blue: #2c4fc4;
    --s-violet: #6338c2;
    --s-magenta: #a3105f;
    --s-orange: #a34500;
    --s-amber: #7a5600;
    --shadow-1: 0 1px 2px rgba(20,22,30,.08);
    --shadow-2: 0 10px 30px rgba(20,22,30,.16);
  }
}
:root[data-theme="light"] {
  --bg-canvas: #f6f7f9; --bg-surface: #ffffff; --bg-surface-2: #eef0f4; --bg-surface-3: #e3e6ec;
  --grid-dot: #dfe3ea; --border-subtle: #e3e6ec; --border-default: #cdd2dc; --border-strong: #a7aebb;
  --text-primary: #12151b; --text-secondary: #454c59; --text-tertiary: #5b6270;
  --accent: #2c4fc4; --accent-strong: #1f3ea3; --accent-ink: #ffffff; --focus-ring: #2c4fc4;
  --s-blue: #2c4fc4; --s-violet: #6338c2; --s-magenta: #a3105f; --s-orange: #a34500; --s-amber: #7a5600;
  --shadow-1: 0 1px 2px rgba(20,22,30,.08); --shadow-2: 0 10px 30px rgba(20,22,30,.16);
}
:root[data-theme="dark"] {
  --bg-canvas: #0a0c10; --bg-surface: #12151b; --bg-surface-2: #181c24; --bg-surface-3: #1f242e;
  --grid-dot: #1b2029; --border-subtle: #232833; --border-default: #323a48; --border-strong: #4a5264;
  --text-primary: #f2f4f7; --text-secondary: #aab2c0; --text-tertiary: #7c8494;
  --accent: #8fb2ff; --accent-strong: #b3ccff; --accent-ink: #0a0c10; --focus-ring: #8fb2ff;
  --s-blue: #648fff; --s-violet: #785ef0; --s-magenta: #dc267f; --s-orange: #fe6100; --s-amber: #ffb000;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 10px 30px rgba(0,0,0,.55);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg-canvas);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
code, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

/* ── App shell ─────────────────────────────────────────────────────── */
.app { display: grid; grid-template-columns: var(--rail) 1fr; grid-template-rows: 52px 1fr; height: 100dvh; }
.app.has-insp { grid-template-columns: var(--rail) 1fr var(--insp); }

.bar {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 14px;
  padding: 0 14px; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle);
  z-index: 5; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
}
.bar > * { flex: none; }
.bar h1 {
  font-size: 13px; font-weight: 700; letter-spacing: .02em; margin: 0;
  display: flex; align-items: baseline; gap: 8px; white-space: nowrap;
}
.bar h1 span { font-weight: 500; color: var(--text-tertiary); letter-spacing: .06em; text-transform: uppercase; font-size: 10px; }
.spacer { flex: 1; }
.count { font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); white-space: nowrap; }
.count b { color: var(--text-secondary); font-weight: 600; }

.srch { position: relative; }
.srch input {
  width: 230px; padding: 6px 10px 6px 28px; font: inherit; font-size: 12px;
  background: var(--bg-surface-2); color: var(--text-primary);
  border: 1px solid var(--border-default); border-radius: 6px;
}
.srch input::placeholder { color: var(--text-tertiary); }
.srch svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); }

.chips { display: flex; gap: 4px; }
.chip {
  font-size: 11px; padding: 4px 9px; border-radius: 999px;
  border: 1px solid var(--border-default); color: var(--text-secondary);
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--bg-surface-3); color: var(--text-primary); border-color: var(--border-strong); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.f-built .dot { background: var(--s-blue); }
.chip.f-new .dot { background: var(--s-violet); }
.chip.f-fork .dot { background: var(--s-orange); }
.chip.f-fail .dot { background: var(--s-magenta); }
.chip.f-input .dot { background: var(--s-amber); }

.zoom { display: flex; align-items: center; gap: 2px; }
.zoom button {
  width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border-default);
  display: grid; place-items: center; font-size: 13px; color: var(--text-secondary);
}
.zoom button:hover { background: var(--bg-surface-3); color: var(--text-primary); }
.zoom .lvl { font-size: 11px; font-family: var(--font-mono); color: var(--text-tertiary); width: 42px; text-align: center; }

/* ── Left rail ─────────────────────────────────────────────────────── */
.rail { background: var(--bg-surface); border-right: 1px solid var(--border-subtle); overflow-y: auto; padding: 10px 0 28px; }
.rail h2 {
  font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-tertiary);
  margin: 14px 14px 6px; font-weight: 600;
}
.rail-item {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  padding: 7px 14px; font-size: 12.5px; color: var(--text-secondary); border-left: 2px solid transparent;
}
.rail-item:hover { background: var(--bg-surface-2); color: var(--text-primary); }
.rail-item.on { color: var(--text-primary); background: var(--bg-surface-2); border-left-color: var(--accent); }
.rail-item .pg { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-tertiary); width: 30px; flex: none; }
.rail-item .n { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-tertiary); }
.rail-note { margin: 10px 14px 0; font-size: 11px; color: var(--text-tertiary); line-height: 1.5; }
.rail-note code { font-size: 10.5px; }

/* ── Canvas ────────────────────────────────────────────────────────── */
.stage {
  position: relative; overflow: hidden; cursor: grab;
  background-color: var(--bg-canvas);
  background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
  background-size: 26px 26px;
}
.stage.drag { cursor: grabbing; }
.world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.edges { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }

/* lane */
.lane { position: absolute; border-radius: 16px; border: 1px solid var(--border-subtle); background: color-mix(in srgb, var(--bg-surface) 55%, transparent); }
.lane-hd { position: absolute; display: flex; flex-direction: column; gap: 4px; }
.lane-hd .pill {
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700;
  padding: 3px 9px; border-radius: 999px; align-self: flex-start;
  color: var(--accent-ink);
}
.lane-hd .ttl { font-size: 19px; font-weight: 750; letter-spacing: -.015em; text-wrap: balance; }
.lane-hd .sub { font-size: 11.5px; color: var(--text-tertiary); font-family: var(--font-mono); }

/* cluster */
.cl { position: absolute; border-radius: 12px; border: 1px dashed var(--border-default); }
.cl-ttl {
  position: absolute; font-size: 12px; font-weight: 650; color: var(--text-secondary);
  display: flex; align-items: center; gap: 8px; white-space: nowrap;
}
.cl-ttl .ix { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-tertiary); }

/* card */
.card {
  position: absolute; width: var(--card-w); height: var(--card-h);
  background: var(--bg-surface); border: 1px solid var(--border-default);
  border-radius: 10px; padding: 9px 10px; text-align: left; overflow: hidden;
  box-shadow: var(--shadow-1); display: flex; flex-direction: column; gap: 5px;
  transition: border-color .12s, transform .12s, box-shadow .12s;
}
.card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow-2); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent), var(--shadow-2); }
.card.dim { opacity: .18; }
.card.hit { border-color: var(--s-amber); box-shadow: 0 0 0 2px color-mix(in srgb, var(--s-amber) 40%, transparent); }
.card .top { display: flex; align-items: center; gap: 6px; }
.card .sid {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--accent-ink);
  background: var(--accent); padding: 1px 6px; border-radius: 4px; flex: none;
}
.card .frame { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .does { font-size: 12px; color: var(--text-primary); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .sys { font-size: 11px; color: var(--text-tertiary); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .tags { margin-top: auto; display: flex; gap: 4px; flex-wrap: wrap; }
.tag {
  font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  padding: 1.5px 5px; border-radius: 3px; display: inline-flex; align-items: center; gap: 3px;
  border: 1px solid currentColor;
}
.tag.built { color: var(--s-blue); }
.tag.new { color: var(--s-violet); }
.tag.fail { color: var(--s-magenta); }
.tag.input { color: var(--s-amber); }
.tag.prose { color: var(--text-tertiary); }

/* fork card */
.card.fork { border-color: color-mix(in srgb, var(--s-orange) 55%, var(--border-default)); background: color-mix(in srgb, var(--s-orange) 7%, var(--bg-surface)); }
.card.fork .sid { background: var(--s-orange); color: #fff; }
.card.fork .rows { font-size: 11px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.card.fork .rows span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* note card */
.card.note { height: auto; min-height: 62px; background: var(--bg-surface-2); border-style: dotted; }
.card.note .does { -webkit-line-clamp: 4; font-size: 11.5px; color: var(--text-secondary); }

/* baton rail */
.baton { position: absolute; display: flex; flex-direction: column; gap: 6px; }
.baton .hd { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-tertiary); font-weight: 700; }
.baton .row { display: flex; gap: 8px; align-items: stretch; }
.bchip {
  width: 232px; text-align: left; padding: 8px 10px; border-radius: 8px;
  background: var(--bg-surface); border: 1px solid var(--border-default);
  border-top: 3px solid var(--who, var(--border-strong));
  display: flex; flex-direction: column; gap: 3px;
}
.bchip:hover { border-color: var(--border-strong); }
.bchip .st { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-primary); }
.bchip .wh { font-size: 10.5px; color: var(--who, var(--text-secondary)); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.bchip .se { font-size: 10.5px; color: var(--text-tertiary); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* index blocks (frames / gaps / decisions) */
.blk { position: absolute; }
.blk-hd { font-size: 19px; font-weight: 750; letter-spacing: -.015em; margin-bottom: 4px; }
.blk-sub { font-size: 12px; color: var(--text-tertiary); margin-bottom: 14px; }
.fgrid { display: grid; grid-template-columns: repeat(4, 250px); gap: 10px; }
.fcard {
  background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 9px;
  padding: 9px 10px; text-align: left; display: flex; flex-direction: column; gap: 3px;
  border-left: 3px solid var(--st, var(--border-strong));
}
.fcard:hover { border-color: var(--border-strong); }
.fcard .id { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); }
.fcard .nm { font-size: 12.5px; font-weight: 650; }
.fcard .st { font-size: 10.5px; color: var(--text-secondary); }
.ggrid { display: grid; grid-template-columns: repeat(3, 340px); gap: 12px; }
.gcard {
  background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 10px;
  padding: 11px 12px; text-align: left; display: flex; flex-direction: column; gap: 6px;
  border-top: 3px solid var(--s-magenta);
}
.gcard.closed { border-top-color: var(--s-blue); }
.gcard.conflict { border-top-color: var(--s-amber); }
.gcard .rank { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-tertiary); }
.gcard .ttl { font-size: 12.5px; font-weight: 650; line-height: 1.35; }
.gcard .cons { font-size: 11px; color: var(--text-tertiary); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* ── Inspector ─────────────────────────────────────────────────────── */
.insp {
  background: var(--bg-surface); border-left: 1px solid var(--border-subtle);
  overflow-y: auto; display: none; flex-direction: column;
}
.app.has-insp .insp { display: flex; }
.insp-hd { padding: 14px 16px 12px; border-bottom: 1px solid var(--border-subtle); position: sticky; top: 0; background: var(--bg-surface); z-index: 2; }
.insp-hd .row1 { display: flex; align-items: center; gap: 8px; }
.insp-hd .sid { font-family: var(--font-mono); font-size: 12px; font-weight: 700; background: var(--accent); color: var(--accent-ink); padding: 2px 7px; border-radius: 4px; }
.insp-hd .close { margin-left: auto; color: var(--text-tertiary); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.insp-hd .close:hover { background: var(--bg-surface-3); color: var(--text-primary); }
.insp-hd .frame { margin-top: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--text-primary); word-break: break-word; }
.insp-hd .where { margin-top: 6px; font-size: 11px; color: var(--text-tertiary); }
.fields { padding: 4px 16px 40px; display: flex; flex-direction: column; }
.fld { padding: 12px 0; border-bottom: 1px solid var(--border-subtle); }
.fld:last-child { border-bottom: none; }
.fld .k {
  font-size: 10px; text-transform: uppercase; letter-spacing: .09em; font-weight: 700;
  color: var(--text-tertiary); display: flex; align-items: center; gap: 6px; margin-bottom: 5px;
}
.fld .v { font-size: 12.5px; color: var(--text-primary); line-height: 1.5; word-break: break-word; }
.fld.is-fail .k { color: var(--s-magenta); }
.fld .v code { background: var(--bg-surface-3); padding: .5px 4px; border-radius: 3px; font-size: 11.5px; }
.itbl { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.itbl th, .itbl td { text-align: left; padding: 6px 7px; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
.itbl th { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-tertiary); }
.itbl-wrap { overflow-x: auto; }

.hint {
  position: absolute; left: 14px; bottom: 12px; display: flex; gap: 12px; align-items: center;
  font-size: 11px; color: var(--text-tertiary); background: color-mix(in srgb, var(--bg-surface) 88%, transparent);
  border: 1px solid var(--border-subtle); border-radius: 8px; padding: 6px 10px; pointer-events: none;
}
.hint kbd {
  font-family: var(--font-mono); font-size: 10px; border: 1px solid var(--border-default);
  border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--text-secondary);
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 900px) {
  .app, .app.has-insp { grid-template-columns: 1fr; grid-template-rows: 52px 1fr; }
  .rail { display: none; }
  .app.has-insp .insp { position: fixed; inset: 52px 0 0 auto; width: min(94vw, 400px); z-index: 20; }
  .srch input { width: 130px; }
  .count { display: none; }
  .bar h1 span { display: none; }
}
</style>

<div class="app" id="app">
  <div class="bar">
    <h1>Freight Reverse-Auction Marketplace <span>design map</span></h1>
    <div class="srch">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search steps, screens, IDs…" aria-label="Search steps, screens and IDs">
    </div>
    <div class="chips" id="filters">
      <button class="chip f-built" data-f="built" aria-pressed="false"><i class="dot"></i>Built</button>
      <button class="chip f-new" data-f="new" aria-pressed="false"><i class="dot"></i>New frame</button>
      <button class="chip f-fork" data-f="fork" aria-pressed="false"><i class="dot"></i>Branch</button>
      <button class="chip f-input" data-f="input" aria-pressed="false"><i class="dot"></i>Needs input</button>
      <button class="chip f-fail" data-f="fail" aria-pressed="true"><i class="dot"></i>Failure paths</button>
    </div>
    <div class="spacer"></div>
    <div class="count" id="counts"></div>
    <div class="zoom">
      <button id="zout" aria-label="Zoom out">−</button>
      <span class="lvl" id="lvl">100%</span>
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zfit" aria-label="Fit to screen" title="Fit">⤢</button>
      <button id="theme" aria-label="Toggle light and dark theme" title="Theme">◑</button>
    </div>
  </div>

  <nav class="rail" id="rail" aria-label="Figma page tree"></nav>

  <div class="stage" id="stage" tabindex="0" aria-label="Design map canvas — drag to pan, ctrl or cmd plus scroll to zoom">
    <div class="world" id="world">
      <svg class="edges" id="edges" aria-hidden="true"></svg>
    </div>
    <div class="hint">
      <span><kbd>drag</kbd> pan</span><span><kbd>⌘</kbd>+<kbd>scroll</kbd> zoom</span>
      <span><kbd>/</kbd> search</span><span><kbd>0</kbd> fit</span><span><kbd>esc</kbd> close</span>
    </div>
  </div>

  <aside class="insp" id="insp" aria-live="polite"></aside>

1), ETA, milestones","does":"Messages driver","system":"\u2014","next":"delivery flow","fails":"Stale >2h \u2192 flagged banner, never hidden (BR-401)","uid":"D3:D3-S8:S37","src":"D3-flow-carrier.md"}],"branches":[],"notes":[],"key":"D3-S8"},{"title":"8. Getting paid","steps":[{"id":"S38","frame":"`\u00b7 Default`","sees":"Rate confirmation + accessorials + FSC, reconciled total (BR-601)","does":"Reviews","system":"Invoice composed against rate confirmation","next":"S39","fails":"Bid *is* the rate-confirmation base by construction (BR-307) \u2014 no mismatch state possible","uid":"D3:D3-S9:S38","src":"D3-flow-carrier.md"},{"id":"S39","frame":"`\u00b7 Partial data`","sees":"Some lines `HELD` (OS&D/dispute), rest paying standard cycle (BR-603)","does":"Contacts ops on held line","system":"Clean lines settle independently","next":"S40","fails":"\u2014","uid":"D3:D3-S9:S39","src":"D3-flow-carrier.md"},{"id":"S40","frame":"`\u00b7 factored`","sees":"Remit-to shows factor's instructions, never carrier's own bank details, once NOA on file (BR-606/608)","does":"Reviews, cannot override without sign-off","system":"100% payable routes to factor of record","next":"S41","fails":"Forged/expired NOA \u2192 `ERR-557`, flagged to fraud, held not misrouted","uid":"D3:D3-S9:S40","src":"D3-flow-carrier.md"},{"id":"S41","frame":"`\u00b7 quick-pay offer`","sees":"Elective, disabled while any line `HELD` (BR-609/610)","does":"Elects or declines","system":"Funded from platform capital/financing partner","next":"S42","fails":"\u2014","uid":"D3:D3-S9:S41","src":"D3-flow-carrier.md"},{"id":"S42","frame":"`\u00b7 Settled`","sees":"Payout confirmed, 1099-NEC accrual updated","does":"\u2014","system":"Load \u2192 `COMPLETED`","next":"exits","fails":"Undisclosed factoring found mid-dispute \u2192 `ERR-560`, held, never double-paid","uid":"D3:D3-S9:S42","src":"D3-flow-carrier.md"}],"branches":[],"notes":["**Counts.** 42 numbered steps (S1-S42, S26/S26d owner-operator/dispatcher split) across 9 sub-flows \u00b7 frames: 3 built (`SCR-910`, `SCR-911`, `SCR-930` referenced) + 13 spec-only F9 screens (`SCR-912`-`916` + states) + 9 `[NEW]` (sign-up \u00d73, vetting status \u00d73, award accept/decline/lapse \u00d73) \u00b7 5 branch tables (\u00a71.1, \u00a73.1, \u00a75.1, \u00a76.1, plus the eligibility-reasons pattern repeated inline at S17/S26d/S30/S31 rather than tabled twice)."],"key":"D3-S9"}]},{"code":"D4","file":"D4-flow-driver.md","page":"12","persona":"Driver (mobile)","short":"Drv","sections":[{"title":"Preamble","steps":[],"branches":[],"notes":["**New screens, justified:** - `[NEW] SCR-927` Driver \u00b7 Invite Accept & Device Bind \u2014 F1 \u00a75.3/\u00a79 requires this handshake; F9 has no screen for it. - `[NEW] SCR-928` Driver \u00b7 Sync Held for Review \u2014 FR-901/`ERR-550`\u2013`553` route offline conflicts to a human queue; needs its own honest frame, distinct from ordinary pending-sync. - `[NEW] SCR-929` Driver \u00b7 Session Ended \u2014 FR-128/FR-150/FR-152 revoke a device or session; driver needs to see *why*, not a blank login screen."],"key":"D4-S1"},{"title":"1. Device onboarding","steps":[{"id":"S1","frame":"`[NEW SCR-927] Invite Accept \u00b7 Default`","sees":"Carrier org name, dispatcher name, role, one \"Accept\" button","does":"Taps accept","system":"Validates single-use, expiring, phone-bound invite token (FR-106)","next":"S2","fails":"Token expired/used \u2192 `Error`: \"This invite has expired \u2014 ask your dispatcher to resend\"","uid":"D4:D4-S2:S1","src":"D4-flow-driver.md"},{"id":"S2","frame":"`[NEW SCR-927] \u00b7 OTP verify`","sees":"SMS code field, large numeric keypad","does":"Enters 6-digit code","system":"Verifies phone (FR-108); rate-limits retries","next":"S3","fails":"Mismatch \u2192 inline retry; exhausted \u2192 \"Ask your dispatcher to resend the invite\"","uid":"D4:D4-S2:S2","src":"D4-flow-driver.md"},{"id":"S3","frame":"`[NEW SCR-927] \u00b7 PIN/biometric setup`","sees":"Set local unlock","does":"Sets PIN or enrolls biometric","system":"Local-unlock layer atop server session (FR-112), never a substitute for it","next":"S4","fails":"Biometric unavailable \u2192 PIN-only fallback, no dead end","uid":"D4:D4-S2:S3","src":"D4-flow-driver.md"},{"id":"S4","frame":"`[NEW SCR-927] \u00b7 Device bind`","sees":"\"This phone is now your Jarvis Freight device\"","does":"Confirms","system":"Refresh token bound to device/install id (FR-123); old device (if any) unaffected unless explicitly deregistered","next":"S5","fails":"\u2014","uid":"D4:D4-S2:S4","src":"D4-flow-driver.md"},{"id":"S5","frame":"`[NEW SCR-927] \u00b7 Language`","sees":"EN/ES toggle, persists","does":"Picks language","system":"Stored on driver record (BR-914)","next":"S6","fails":"\u2014","uid":"D4:D4-S2:S5","src":"D4-flow-driver.md"},{"id":"S6","frame":"`[SCR-920] Today \u00b7 Empty` or `Default`","sees":"No assignment yet, or today's load","does":"Waits, or acts on S7+","system":"\u2014","next":"\u00a72","fails":"\u2014","uid":"D4:D4-S2:S6","src":"D4-flow-driver.md"}],"branches":[],"notes":["**Lost phone mid-trip:** admin deregisters the device (FR-128) \u2192 refresh token invalidated server-side \u2192 next app open shows `[NEW SCR-929] Session Ended` (\"Your access was ended by Ironhide Trucking \u2014 call dispatch\"), never a bare login screen implying the driver did something wrong. Admin re-invites on a replacement device \u2192 S1\u2013S6 again; FR-153 requires the admin to bind the replacement session to the **in-flight load** before any further driver-scoped action \u2014 the trip/custody record itself persisted untouched (FR-152).","**Driver leaves carrier mid-trip:** identical `SESSION_REVOKED` \u2192 `SCR-929`. **The FRD names an honest gap here (EC-107): revoking the session does nothing to the loaded truck still parked somewhere.** Flagged in the closing questions.","**Not invented:** EC-103 (shared family device, no \"switch driver\" flow) is explicitly unspecified in F1 \u2014 surfaced here, not -S5"},{"title":"5. Branch tables","steps":[],"branches":[{"title":"","header":["Condition","Destination","Consequence"],"rows":[["Driver session + entered tractor/trailer match bound Assignment tuple","`SCR-922 \u00b7 Arrival confirmed`","FR-140 timestamp+geofence logged; \u2192 `SCR-923`"],["Disclosed, pre-approved relay/drop-and-hook substitution","`SCR-922 \u00b7 Arrival confirmed`","Re-verified tuple, no case opened (FR-713)"],["Mismatch \u2014 wrong driver, wrong tractor, wrong trailer, undisclosed swap","`SCR-922 \u00b7 Held pending verification`","FR-139 suspends further session-scoped actions on this load; `ExceptionCase(FRAUD_REVIEW)` opens (BR-806); driver sees \"Dispatch is verifying this pickup \u2014 call them\" and a Call button, **never** a raw `ARRIVAL_MISMATCH` code"]]},{"title":"","header":["Condition","Destination","Consequence"],"rows":[["Ready, count/condition matches, correct equipment","`SCR-923` proceeds \u2192 `PICKED_UP`","Milestone `loaded` claimed"],["Freight not ready","`SCR-922 \u00b7 Not ready` (reason: not-ready / dock closed)","`SHIPPER_NOT_READY`; TONU flag \u2192 \u00a78.6 accessorial"],["Freight differs from declaration","`SCR-923 \u00b7 Discrepancy hold`","BR-406 hold; resolution outcome (substitution confirmed vs. held) recorded before loading continues"],["Wrong equipment (trailer type mismatch)","`SCR-922 \u00b7 Refused`","`PICKUP_REFUSED`, `EQUIPMENT_TYPE_MISMATCH`"],["Unsafe load","`SCR-922 \u00b7 Refused` (reason: unsafe)","`PICKUP_REFUSED`, reason `UNSAFE_LOAD`, same-shift ops review"],["Seal missing where required","`SCR-923 \u00b7 Condition note`","Logged, not blocking, re-verified at drop (BR-408) unless hazmat mandates it (BR-719)"],["Detention accruing","`SCR-920` banner + `SCR-923` timer","`detention_candidate_minutes` computed (FR-821); informational only, never blocks the driver"],["Lumper fee at pickup","`SCR-923 \u00b7 Lumper flag` (receipt photo)","**`CHALLENGE`:** BR-516 scopes lumper capture to *delivery* only S16","frame":"`[SCR-925] Report a Problem \u00b7 Category`","sees":"Breakdown / weather-closure / reefer-alarm / accident / theft / OOS-order / other","does":"Picks category, attaches photo or voice note","system":"`TRANSIT_EXCEPTION` sub-type opens (BR-405); high-priority sync queue if offline","next":"`[SCR-920]` w/ open-exception card","fails":"Offline \u2192 queues, `Pending sync` badge, never silently dropped","uid":"D4:D4-S7:S16","src":"D4-flow-driver.md"},{"id":"S17","frame":"`[SCR-920] \u00b7 Interrupt` (system-pushed)","sees":"Full-screen, non-dismissible \u2014 e.g. telematics-detected reefer alarm","does":"Acknowledges / calls dispatch","system":"Full-screen interrupt per F9 \u00a74 rule \u2014 never a toast for anything blocking","next":"Back to Today or `SCR-925` for detail","fails":"\u2014","uid":"D4:D4-S7:S17","src":"D4-flow-driver.md"},{"id":"S18","frame":"Driver truly dark (no signal, no update)","sees":"Last-known cached state stays visible, age-labelled","does":"Nothing \u2014 by design","system":"`NO_UPDATE_RECEIVED` flag visible to ops/shipper only","next":"resumes at reconnect","fails":"\u2014","uid":"D4:D4-S7:S18","src":"D4-flow-driver.md"}],"branches":[],"notes":[],"key":"D4-S7"},{"title":"7. Delivery and POD \u2014 `[SCR-924]` (built)","steps":[{"id":"P1","frame":"[SCR-924] POD \u00b7 Arrival","sees":"Arrival at drop confirmed","does":"Confirms arrival","system":"Count/condition folded into this screen","next":"P2","fails":"Offline \u2192 captured locally, Pending sync","uid":"D4:D4-S8:P1","src":"D4-flow-driver.md \u00a77 (prose \u2192 transcribed)","prose":true},{"id":"P2","frame":"[SCR-924] POD \u00b7 Forced choice","sees":"\"Delivered clean\" vs \"Report exception\" \u2014 no pre-selection, role=\"group\"","does":"Must pick one \u2014 Continue stays disabled until then","system":"BR-501/502/505/512 satisfied by construction \u2014 no combined \"confirm delivery\" button","next":"P3 clean \u00b7 P3b exception","fails":"No default means no accidental clean-close","uid":"D4:D4-S8:P2","src":"D4-flow-driver.md \u00a77 (prose \u2192 transcribed)","prose":true},{"id":"P3b","frame":"[SCR-924] POD \u00b7 Exception detail","sees":"Type / qty / whose-count \u2014 structured, notes supplement only","does":"Records the exception","system":"OS&D notation (BR-503); invoice line held","next":"P4","fails":"Same tap-count to signature as the clean path \u2014 exception is not punished with friction","uid":"D4:D4-S8:P3b","src":"D4-flow-driver.md \u00a77 (prose \u2192 transcribed)","prose":true},{"id":"P4","frame":"[SCR-924] POD \u00b7 Photo","sees":"Camera \u2014 optional on clean, mandatory on exception","does":"Captures photo","system":"Unreadable image flagged before accept (ERR-506)","next":"P5","fails":"No camera permission \u2192 text-only notation fallback (EC-910)","uid":"D4:D4-S8:P4","src":"D4-flow-driver.md \u00a77 (prose \u2192 transcribed)","prose":true},{"id":"P5","frame":"[SCR-924] POD \u00b7 Signature","sees":"Consignee signs on the DRIVER's device \u2014 printed name + role, no account","does":"Consignee signs","system":"Canvas aria-label'd; signature never blocked by connectivity (EC-901, FR-124)","next":"P6","fails":"Consignee absent \u2192 DELIVERY_ATTEMPTED_NO_RECEIVER","uid":"D4:D4-S8:P5","src":"D4-flow-driver.md \u00a77 (prose \u2192 transcribed)","prose":true},{"id":"P6","frame":"[SCR-924] POD \u00b7 Read-only confirm","sees":"Everything captured, read-only","does":"Reviews, submits","system":"DELIVERED \u2192 POD_CAPTURED; record fixed once captured (BR-512)","next":"P7","fails":"Later addition must be a separately timestamped addendum","uid":"D4:D4-S8:P6","src":"D4-flow-driver.md \u00a77 (prose \u2192 transcribed)","prose":true},{"id":"P7","frame":"[SCR-924] POD \u00b7 Pending sync","sees":"sync-pill--pending \u2014 \"captured locally, will upload the moment you're back online\"","does":"Nothing","system":"Invoice opens clean, or line held pending claim","next":"Carrier \u00a78 / Shipper \u00a79","fails":"Sync conflict \u2192 [NEW SCR-928] human reconciliation queue","uid":"D4:D4-S8:P7","src":"D4-flow-driver.md \u00a77 (prose \u2192 transcribed)","prose":true}],"branches":[],"notes":["**not punished with extra friction**, matching the brief.","**Concealed-damage addendum (BR-504):** reachable later from load history, always linked to the original POD, never overwriting it \u2014 **[specified, not yet built]**, its own frame, same signature component, one field: \"What was found, when.\""],"key":"D4-S8"},{"title":"Summary","steps":[],"branches":[],"notes":["**6-line summary.** Mapped the driver's full journey from SMS invite through device bind, arrival identity match, pickup's dual-signature handover, in-transit passivity-by-design, to the built forced-choice POD and its pending-sync/conflict handling. `SCR-920` and `SCR-924` confirmed built and correct against BR-501/502/505/512. Added three new screens (`SCR-927`\u2013`929`) F9 never specified for invite/device-bind, sync-conflict, and session-ended. Deliberately did **not** design a live HOS countdown \u2014 `DEC-700` is unresolved and a countdown would itself be the rejected Option C. Named one BRD gap (lumper capture scoped delivery-only) and one operational gap (revocation doesn't move a loaded truck).","**Counts:** ~28 steps (S1\u2013S18 plus onboarding S1\u2013S6 and pickup S11\u2013S14) \u00b7 10 frames referenced (7 existing `SCR-` IDs, 3 new) \u00b7 4 branch tables (\u00a75.1\u20135.4, 20 rows total).","**Built vs. specified:** `SCR-920` (Today) and `SCR-924` (POD capture, full 7-step sequence) are built and verified in `prototype.html`. `SCR-921/922/923/925/926` and all three `[NEW]` screens are specified only.","**Three sharpest questions only Boss can answer:** 1. `DEC-700` \u2014 HOS Option A (nothing shown) or Option B (bounded feasibility badge)? Assumed B's shape here but builds nothing live without the lock. 2. Session revocation when a driver leaves mid-trip kills the *app*, not the *truck* \u2014 freight is still physically on a road. Is there an operational handoff process, or does this stay a gap? 3. Lumper-fee capture is written into the BRD as delivery-side only (BR-516) \u2014 should pickup-side fees get the identical affordance, or is that intentionally out of scope?","**`CHALLENGE`:** see \u00a75.2 \u2014 BR-516 scopes lumper-fee capture to the delivery side only; recommend the identical flag+receipt affordance at pickup too, not left uncaptured there.","**The single moment where a bad UI decision costs the most real money:** the forced-choice screen in `SCR-924`. A clear-signed POD materially weakens a later cargo claim (BR-505) \u2014 any UI that makes \"clean\" the path of least resistance (a default, a faster tap-count, a friendlier colour) quietly biases drivers toward under-reporting real damage, and every under-reported load is a claim someone cannot win later. The built version already gets this right \u2014 no default, equal visual weight, equal tap-count \u2014 and that correctness must survive any future redesign untouched."],"key":"D4-S9"}]},{"code":"D5","file":"D5-flow-ops-admin.md","page":"13-14","persona":"Platform Ops / Admin","short":"Ops","sections":[{"title":"Preamble","steps":[],"branches":[{"title":"","header":["SCR","Screen","Status"],"rows":[["SCR-930","Exception Work Queue","**Built** \u2014 Default(open)/Empty/Contested, `prototype.html`"],["SCR-931","Exception Detail & Resolution","Spec only"],["[NEW] SCR-934","Configuration Console","Not in F9 \u2014 FR-1142/1145 need a governed-settings surface"],["[NEW] SCR-935","Impersonation Console","Not in F9 \u2014 F9 only names a banner (\u00a711.5), no screen"],["SCR-940","Carrier Vetting Queue","Spec only"],["SCR-941","Fraud Case Review","Spec only"],["SCR-942","Selection Record / Audit Viewer","Spec only"],["SCR-943","Enforcement Action","Spec only"]]}],"notes":["**Queue composition, once.** SCR-930 unions two sources, never conflated visually: **Load-state exceptions** (`CARRIER_NO_SHOW`, `TRANSIT_EXCEPTION`, `DELIVERY_REFUSED`, `PICKUP_REFUSED`, `SHIPPER_NOT_READY` \u2014 single-valued, \u00a73.3) and **`ExceptionCase` records** (`FRAUD_REVIEW`, `CARGO_INTEGRITY`, `CARGO_CLAIM`, `DISPUTE_FREIGHT`/`MONEY`, `CARRIER_ENFORCEMENT_COLLISION` \u2014 many-per-load, `ENT-324`). A row's case-type badge is absent for the former, present for the latter."],"key":"D5-S1"},{"title":"1. Exception Work Queue (SCR-930)","steps":[{"id":"S1","frame":"`[SCR-930]\u00b7Default`","sees":"Swimlanes by domain (FR-1102); money-at-risk / freight-in-motion / time-criticality as three separate signals, never one score (FR-1103); action attached per row","does":"Scans, opens \"Urgent\" cross-domain view (FR-1104)","system":"Queries `ExceptionCase.status=OPEN\\|IN_REVIEW` \u222a open Load-state exceptions","next":"S2 or SCR-931","fails":"No `PERM-236` \u2192 `Permission denied`; no rows \u2192 `Empty` (built)","uid":"D5:D5-S2:S1","src":"D5-flow-ops-admin.md"},{"id":"S2","frame":"same","sees":"Unclaimed row, Claim button","does":"Clicks Claim","system":"`PERM-236`, `granted_case` binds this case only","next":"Row \u2192 \"Claimed by you\"","fails":"Race with another claimant \u2192 S3 (EC-1100)","uid":"D5:D5-S2:S2","src":"D5-flow-ops-admin.md"},{"id":"S3","frame":"`[SCR-930]\u00b7Contested` (built)","sees":"\"Claimed by X,\" action disabled","does":"Reads only \u2014 platform-wide read stays (FR-1108)","system":"No write path for this actor","next":"stays S1","fails":"Contest state is itself terminal for the loser","uid":"D5:D5-S2:S3","src":"D5-flow-ops-admin.md"},{"id":"S4","frame":"`[SCR-931]\u00b7Default`","sees":"Full context, prior actions, handoff note","does":"Escalates (reason required, FR-1107) or works case","system":"`case.status\u2192IN_REVIEW`; escalation \u2192 `PLATFORM_SENIOR_REVIEWER`","next":"S5","fails":"Missing reason \u2192 inline error","uid":"D5:D5-S2:S4","src":"D5-flow-ops-admin.md"},{"id":"S5","frame":"`[SCR-931]\u00b7Resolved`","sees":"Resolution type/actor/reason, linked downstream action (FR-1110)","does":"Confirms","system":"`status\u2192RESOLVED\\|CLOSED_UNRESOLVED`, addendum-only","next":"S1, row removed","fails":"Already resolved by another actor \u2192 `ERR-529`/`567`","uid":"D5:D5-S2:S5","src":"D5-flow-ops-admin.md"}],"branches":[{"title":"","header":["Condition","Destination","Consequence"],"rows":[["Unclaimed, claim succeeds","S4, `IN_REVIEW`","Off others' unclaimed filter, still platform-visible"],["Claimed near-simultaneously by two","Contested","First commit wins; loser sees who, can't duplicate"],["Fraud case = double-brokering/identity-theft, freight-in-motion","Auto-escalate, senior tier","No human gate \u2014 FR-1107"],["Claim nears 30/120/60-day mark","Auto-escalate","`[NEEDS INPUT]` window; statutory floor never configurable down"],["Manual escalation","Reason required","Logged, senior tier notified"]]}],"notes":["**Shift handoff:** no staffing model exists (`DEP-900`) \u2014 FR-1108 keeps every open case, claimed or not, platform-wide visible; the handoff note is the only mechanism, not a roster. `FR-1106` auto- return threshold `[NEEDS INPUT]` \u2014 an abandoned claim ages visibly (EC-1101), never silently reassigns.","**Branch \u2014 claim/contest/escalate**"],"key":"D5-S2"},{"title":"2. Working three case kinds (SCR-931)","steps":[],"branches":[{"title":"","header":["Kind","State","Actions available","Never available","Traces"],"rows":[["Carrier no-show at dock","`\u00b7No-show`","Contact carrier, reassign via cascade/re-auction (FR-1124 \u2014 ops picks *path*, never hand-picks a winner outside ranked pool), log ground","Force-award off-pool","BR-301/304, `DEC-309`"],["Insurance lapse mid-trip","`\u00b7Vetting-lapse-in-flight`","Flag tuple, pin freight-in-motion (FR-1103/1115), require ID/doc re-check at drop, monitor","**Auto-abort the physical trip** \u2014 settled, BR-218/219, FR-1310","FR-1115"],["Delivery refused, freight on truck","`\u00b7Delivery-refused`","Log reason, route `RETURN_TO_ORIGIN`, open `DISPUTE_FREIGHT` if contested, coordinate RTO","Mark `DELIVERED` by ops fiat","\u00a73.3, BR-813"]]}],"notes":["**CHALLENGE:** `ENT-324.case_type`'s six values have no slot for two items F11's own prose opens: FR-1115's `vetting-lapse-in-flight` tag, and \u00a77.8/EC-1205/1211's offline-sync reconciliation item (\u00a73 below). Both \"open a case, route to \u00a713\" in text but can't persist as typed `ExceptionCase` today. Recommend adding `VETTING_LAPSE`/`DATA_RECONCILIATION` before build proceeds past mock data."],"key":"D5-S3"},{"title":"3. Offline-POD sync conflict (SCR-931, new state)","steps":[{"id":"S1","frame":"`[SCR-931]\u00b7Sync conflict`","sees":"Competing captures side by side: device-local time, server-received time, each event's assumed precondition state vs. current canonical state","does":"Opens item (auto-routed, never a generic exception)","system":"`ERR-550`/`553` surfaces raw events, neither applied","next":"S2","fails":"\u2014","uid":"D5:D5-S4:S1","src":"D5-flow-ops-admin.md"},{"id":"S2","frame":"same","sees":"Evidence per candidate (photo/signature/exception note), clock-skew flag if `ERR-552` present","does":"Compares, picks authoritative capture **or** requests both preserved sequentially (addendum, never overwrite \u2014 FR-1129/BR-512)","system":"Nothing auto-resolves","next":"S3","fails":"Evidence gap (e.g. missing photo) \u2192 flagged, choice not forced","uid":"D5:D5-S4:S2","src":"D5-flow-ops-admin.md"},{"id":"S3","frame":"`\u00b7Sync conflict\u00b7Resolved`","sees":"Chosen event applied; superseded event retained, linked","does":"Confirms with named reason (mirrors FR-1123)","system":"Canonical write proceeds; addendum shows both attempts","next":"Load resumes lifecycle","fails":"State advanced again meanwhile \u2192 re-enters S1, not auto-retried","uid":"D5:D5-S4:S3","src":"D5-flow-ops-admin.md"}],"branches":[],"notes":[],"key":"D5-S4"},{"title":"4. Support impersonation ([NEW] SCR-935)","step itor (maker-checker)","next":"Resolved","fails":"Self-approve \u2192 denied","uid":"D5:D5-S7:S3a","src":"D5-flow-ops-admin.md"},{"id":"S3b","frame":"`\u00b7Override(FAIL\u2192approve)`","sees":"Automated-FAIL banner, mandatory per-element justification, \"needs second approver\"","does":"Submits","system":"`PERM-260` writes addendum type `OVERRIDDEN`, every failed element cited individually (FR-1351) \u2014 never blanket","next":"S4","fails":"Missing per-element justification \u2192 blocked (FR-1352)","uid":"D5:D5-S7:S3b","src":"D5-flow-ops-admin.md"},{"id":"S4","frame":"`\u00b7Second approve`","sees":"Full override context, first reviewer named","does":"Distinct `PLATFORM_SENIOR_REVIEWER` approves/rejects","system":"Bid-eligibility flips only on second approve","next":"Resolved","fails":"No second approver on shift \u2192 **stalls, no safe default** (EC-1106)","uid":"D5:D5-S7:S4","src":"D5-flow-ops-admin.md"}],"branches":[{"title":"","header":["Outcome","Destination","Consequence"],"rows":[["APPROVE (gate passed)","Bid-eligible immediately","Single approver, maker\u2260checker"],["REJECT (even if all checks passed)","Non-bidding","Reviewer discretion permitted, BR-908"],["Override FAIL\u2192APPROVE","Held pending second approver","Never single-actor; addendum evidence trail"],["HOLD-FOR-INFO","Re-queued","No bidding meanwhile"]]}],"notes":["**Branch \u2014 vetting decision**"],"key":"D5-S7"},{"title":"7. Fraud review (SCR-941)","steps":[{"id":"S1","frame":"`[SCR-941]\u00b7Default`","sees":"Case from arrival mismatch (driver/tractor/MC\u2260awarded tuple, BR-221/224 \u2014 flagship signal) or anomaly/contact/remit-change (FR-1117), triggering signal typed","does":"Opens case","system":"Scoped `PLATFORM_FRAUD_REVIEWER`","next":"S2","fails":"\u2014","uid":"D5:D5-S8:S1","src":"D5-flow-ops-admin.md"},{"id":"S2","frame":"`\u00b7Evidence`","sees":"Signal+evidence, award/selection record, vetting history, **cross-load pattern view**, comms log (FR-1118)","does":"Investigates","system":"Read-only aggregation","next":"S3","fails":"Cross-case pattern can't auto-classify \u2014 flagged for human (EC-1115)","uid":"D5:D5-S8:S2","src":"D5-flow-ops-admin.md"},{"id":"S3","frame":"`\u00b7Classify`","sees":"Four outcomes: double-brokering / identity-theft / disclosed-and-revetted (closes, no case) / indeterminate-escalate","does":"Selects","system":"`fraud.classified`; disclosed-and-revetted closes but review stays on record (EC-1107)","next":"S4 or resolved","fails":"\u2014","uid":"D5:D5-S8:S3","src":"D5-flow-ops-admin.md"},{"id":"S4","frame":"`\u00b7Containment (freight in motion)`","sees":"**No cancel affordance \u2014 absent.** Available: withhold payment/settlement, flag `custody-under-investigation`, require ID re-check at drop, generate LE/insurer referral (FR-1120)","does":"Applies containment","system":"Suspension halts new bids/awards, doesn't strand the load (BR-818/FR-1121)","next":"Monitors to resolution","fails":"Plainly stated: **cannot recall a truck in transit** \u2014 a real ceiling","uid":"D5:D5-S8:S4","src":"D5-flow-ops-admin.md"}],"branches":[{"title":"","header":["Path","Protects","Costs"],"rows":[["Disclose pre-resolution","Fair notice, due process, may surface a legitimate explanation early","Tips off real fraud mid-investigation, risks evidence/asset flight"],["Withhold pending resolution","Containment integrity, referral packet's evidentiary value","Flagged carrier can't respond; due-process exposure if wrong"]]},{"title":"","header":["Outcome","Destination","Consequence"],"rows":[["Cleared (disclosed-and-revetted)","Closes","Review stays on record"],["Contained, freight in motion","Stays open, monitored","No cancel path exists structurally"],["Escalated","Senior tier","Litigation hold if theft/injury/fatality/open claim (BR-819) \u2014 never deletable after"]]}],"notes":["**Disclosure question \u2014 mapped both ways, not picked (`[NEEDS INPUT]`, FR-1120):**","**Branch \u2014 fraud outcome**"],"key":"D5-S8"},{"title":"8. Overrides","steps":[],"branches":[{"title":"","header":["Override","Where","Gate"],"rows":[["Force stuck transition","SCR-931","Named actor, reason, before/after, audited (FR-1123); blocked/warned if an open fraud case exists (EC-1114)"],["Re-award after decline/lapse/void","SCR-931","Same gate + ranked pool; ops picks cascade-vs-re-auction, never a specific carrier (FR-1124)"],["Waive charge / claim payout","SCR-931 / collections","Requester\u2260approver, second approver above `[NEEDS INPUT]` threshold"],["Reinstate suspended carrier","SCR-943","Second approver\u2260suspender (FR-1127); blocked while a fraud case is open (EC-1102)"],["**Force-award to gate-failed carrier**","**Nowhere \u2014 no affordance exists, any tier**","FR-1128: refused outright \u2014 the action is absent, not disabled"]]},{"title":"","header":["Type","Destination","Consequence"],"rows":[["Overridable","Executes, named actor+reason, audited","Reversible only by a new logged event, never edited history"],["Never overridable","No control renders","Gate bypass, POD/selection-record edits, re-ordering a closed auction, self-approval \u2014 structurally absent"]]}],"notes":["**Branch \u2014 permitted/refused**"],"key":"D5-S9"},{"title":"9. Audit review (SCR-942)","steps":[{"id":"S1","frame":"`[SCR-942]\u00b7Search`","sees":"Search by load/carrier/date; entitled-party framing (49 CFR 371)","does":"Searches","system":"`PLATFORM_AUDITOR` (`platform_wide`, read-only, PERM-250/251) or ops via `granted_case`","next":"S2","fails":"No match \u2192 `Empty`","uid":"D5:D5-S10:S1","src":"D5-flow-ops-admin.md"},{"id":"S2","frame":"`\u00b7Record`","sees":"Full 371.3 six-element package + selection record + custody events, from stored snapshot alone (FR-1200, no live re-query)","does":"Views, exports","system":"Read path independent of transactional write path (NFR-1229)","next":"S3","fails":"Export target unreachable \u2192 retry, never a partial silent file","uid":"D5:D5-S10:S2","src":"D5-flow-ops-admin.md"},{"id":"S3","frame":"`\u00b7Exported`","sees":"Confirmation, `trace_id`","does":"\u2014","system":"Cross-org audit access itself audited, bounded to ops (NFR-1230)","next":"\u2014","fails":"\u2014","uid":"D5:D5-S10:S3","src":"D5-flow-ops-admin.md"}],"branches":[],"notes":["**Counts:** 9 flows (30 steps across 9 tables) \u00b7 8 frames (6 F9 + 2 `[NEW]`) \u00b7 8 branch tables \u00b7 1 `CHALLENGE`. All screens are permission-aware (\u00a74); ops access is bound to `granted_case` \u2014 the case being worked, not the whole platform \u2014 everywhere except `PLATFORM_AUDITOR`/`PLATFORM_ADMIN` (`platform_wide` by design, both structurally read-only or identity-only).","**Built vs. spec:** SCR-930 alone is built (Default-open, Empty, static Contested). SCR-931, SCR-934[NEW], SCR-935[NEW], SCR-940, SCR-941, SCR-942, SCR-943 are specified, not built.","**Three questions only Boss can answer:** 1. Fraud disclosure (\u00a77, FR-1120) \u2014 does the suspect carrier see the flag before resolution? Containment and fair notice pull opposite ways; no default exists. 2. `EC-1106` \u2014 second approver required but none on shift: spec says \"stalls, no safe default.\" Is that acceptable at launch, or does Boss want a named fallback escalation despite the weaker segregation-of-duty? 3. This doc's `CHALLENGE` \u2014 extend `ENT-324.case_type` now, or leave `VETTING_LAPSE`/sync-conflict items un-typed and queue-unioned without a formal case record?","**Screen whose absence hurts day one most:** SCR-931. SCR-930 lists work, but claim/escalate/resolve and the \u00a73 sync adjudication have nowhere to execute \u2014 a queue showing what's broken with no tool to fix it, on freight moving 24/7 with no staffing model defined yet."],"key":"D5-S10"}]}],"frames":[{"scr":"900","screen":"Load Dashboard","persona":"Shipper / 10","status":"**Built**","source":"F9, `D2`"},{"scr":"901","screen":"Post a Load","persona":"Shipper / 10","status":"**Built**","source":"F9, `D2`"},{"scr":"902","scree d` row 2"},{"scr":"934","screen":"Configuration Console","persona":"Ops / 13","status":"Spec only","source":"`[NEW]`, `D5`"},{"scr":"935","screen":"Impersonation Console","persona":"Ops / 13","status":"Spec only","source":"`[NEW]`, `D5`"},{"scr":"940","screen":"Carrier Vetting Queue","persona":"Admin/Fraud / 14","status":"Spec only \u2014 unreachable in built shell","source":"F9, `D5`"},{"scr":"941","screen":"Fraud Case Review","persona":"Admin/Fraud / 14","status":"Spec only \u2014 unreachable in built shell","source":"F9, `D5`"},{"scr":"942","screen":"Selection Record / Audit Viewer","persona":"Admin/Fraud / 14","status":"Spec only \u2014 unreachable in built shell","source":"F9, `D5`"},{"scr":"943","screen":"Enforcement Action","persona":"Admin/Fraud / 14","status":"Spec only \u2014 unreachable in built shell","source":"F9, `D5`"},{"scr":"**[NEW] 950**","screen":"Consignee Delivery Link","persona":"**No page owns this**","status":"Recommended, not yet specified as frames","source":"`D6` \u00a73"}],"gaps":[{"n":"1","gap":"`AWARD_LAPSED` / `AWARD_VOIDED_INELIGIBLE` has no ops resolution home","missing":"These two award outcomes are not among `ENT-324.case_type`'s six values, so `SCR-930`'s Exception Work Queue never ingests them (H2/H6 in the cross-flow map). Ops is paged (`EVT-1008`/`1009`) but has no screen, queue row, or case record to work against.","found":"`D6` (H2, H6, \u00a76 item 3); cross-referenced against `D5`'s independent `CHALLENGE` that `ENT-324` structurally excludes it","consequence":"**F10 names a missed `award.confirmed` the single most expensive failure mode in the whole system \u2014 an uncollected load.** The operational recovery for that exact failure currently has no tool. This is not a missing nice-to-have; it is the costliest gap in the product with the least coverage.","closing":"Extend `ENT-324.case_type` (ties directly to row 6) **and** add a resolution frame/state \u2014 either a new `SCR-931` case kind alongside no-show / vetting-lapse / delivery-refused, or a dedicated queue lane on `SCR-930`. Needs a product decision on which."},{"n":"2","gap":"`SCR-932` (Claims Desk) and `SCR-933` (Silence/No-Response Monitor) have zero design coverage","missing":"Both are F9-specified Ops screens (\u00a71.4) that `D6`'s own frame index (\u00a75) attributes to \"13 / D5\" \u2014 but `D5`'s delivered file never mentions either `SCR-` ID once. No anatomy, no states, no step table, no branch table exists for either screen anywhere in D1-D6.","found":"**Assembler** (cross-check between D6's frame index and D5's actual content \u2014 neither D5 nor D6 flagged the omission itself)","consequence":"Claims Desk governs the Carmack **30/120/60-day statutory clock** (`BR-807`/`808`) \u2014 a real legal deadline with financial consequence if missed. Silence/No-Response Monitor is the operational catch for `BR-401`/`409`'s missed-status-interval detection \u2014 the mechanism `D2`'s own shipper flow (`SCR-904` Stale state) depends on ops actually working. Two screens carrying legal-clock and detection responsibility are going to engineering with **no design review at all** \u2014 exactly the class of miss this whole audit exists to catch.","closing":"A follow-up design pass \u2014 re-scope `D5` or dispatch a focused agent \u2014 specifically for `SCR-932` and `SCR-933` before either reaches build."},{"n":"3","gap":"The Consignee has no `SCR-` ID anywhere in F9's 31-screen inventory","missing":"The party whose signature triggers `POD_CAPTURED \u2192 INVOICE_ISSUED` and effectively closes the shipment has no reviewed screen. Their entire surface is defined only at the API/entity layer: physical signature captured on the *driver's* device (`SCR-924`), a tokenised read link (`API-112`), and a tokenised action link (`API-113`) \u2014 none of it has been through a UX pass for expiry, wrong-load, already-used, or forwarded-to-the-wrong-person states.","found":"`D6` (\u00a73, \u00a76 item 1)","consequence":"The highest-stakes actor outside the four core personas is being built straight from an API contract. Failure modes are real and already named in the FRD (opened after expiry \u2192 generic 401, no consignee-specific error code; forwarded to the wrong person \u2192 accepted risk, not a bug; used twice \u2192 rejected correctly) but none has been through a screen-state design pass \u2014 they will be built ad hoc by whoever implements the API contract literally.","closing":"`D6`'s recommended `[NEW] SCR-950` (Default/Expired/Used/Wrong-load) \u2014 **but see the structural note below: no page in the spine's page tree currently owns a Consignee flow at all.** That is a level-up gap from the screen gap itself."},{"n":"4","gap":"`PARTIAL_DELIVERY` has no line-level split-POD UI","missing":"`BR-507` requires line-level split capture when some freight delivers and the remainder is routed elsewhere. `SCR-924`'s actual F9 spec (\u00a73) describes only the binary \"Delivered CLEAR\" vs. \"Delivered WITH EXCEPTION\" forced choice \u2014 no split-line frame exists. `D2`'s shipper-side flow (S37) describes the *outcome* of a partial delivery after the fact but that is not a capture UI.","found":"`D6` (\u00a76, lifecycle-state audit), cross-referenced against `BR-507` directly","consequence":"`SCR-924` is the screen that legally fixes the delivery record (`BR-512` \u2014 fixed once captured, any later addition is a separately timestamped addendum). A genuine, common custody outcome has no matching capture path on that screen as specified \u2014 a driver facing a real partial delivery has no honest way to record it in the current design, only a binary choice that doesn't fit the situation.","closing":"A new `SCR-924` sub-state/frame for line-level split capture (per-line clear/exception/quantity), matched to `BR-507`, preserving the existing \"no default, equal tap-count\" discipline `D4` calls the product's single most consequential correctness property."},{"n":"5","gap":"**SOURCE CONFLICT** \u2014 `BR-144` contradicts the FRD's own state model on post-pickup cancellation","missing":"`BR-144` (BRD) says cancellation is unavailable once `PICKED_UP`. The FRD's own \u00a73.3 state adjacency permits `IN_TRANSIT \u2192 CANCELLED_BY_SHIPPER(charged)`, and `EC-509` explicitly reads *\"shipper cancels post-pickup, pre-delivery: allowed, with a financial consequence\"* \u2014 contrasted against `ERR-516`, which only fires at/after `POD_CAPTURED`. Two source documents disagree on where the cutoff actually is.","found":"`D2` (\u00a76, filed as `CHALLENGE`, explicitly **not** decided by the design agent)","consequence":"Whichever reading ships, the other governing document is directly contradicted. A shipper could be told cancellation is categorically impossible mid-transit by one spec path, and be charged a mid-transit cancellation fee for the identical action under another. If this reaches production un-reconciled, it is a real billing/legal exposure, not a UI inconsistency. **This is a business decision, not a design call** \u2014 `D2` correctly followed the FRD reading for its own flow (S29) and flagged rather than resolved it.","closing":"Boss (or whoever owns BRD/FRD reconciliation) picks the actual cutoff and the losing document gets corrected. Design cannot resolve a contradiction between its two source-of-truth documents."},{"n":"6","gap":"`ENT-324.case_type` has no slot for `VETTING_LAPSE` or `DATA_RECONCILIATION`","missing":"`FR-1115`'s vetting-lapse-in-flight tag and \u00a77.8/`EC-1205`/`1211`'s offline-POD-sync-reconciliation item both instruct \"open a case, route to ops\" in FRD prose, but `ENT-324`'s six case-type values (`FRAUD_REVIEW`, `CARGO_INTEGRITY`, `CARGO_CLAIM`, `DISPUTE_FREIGHT`, `DISPUTE_MONEY`, `CARRIER_ENFORCEMENT_COLLISION` \u2014 verified directly against `FRD-v1.md` line 234) do not include either.","found":"`D5` (`CHALLENGE`, \u00a72) \u2014 **accepted by the manager**","consequence":"`SCR-931`'s own \"Vetting-lapse-in-flight\" state (\u00a72) and \"Sync conflict\" state (\u00a73) are designed against a data-model enum value that does not exist. Two real ops workflows \u2014 an insurance lapse discovered while freight is physically in motion, and a POD sync conflict that decides who gets paid \u2014 have UI designed for them but no way to persist as a typed case today.","closing":"Add `VETTING_LAPSE` and `DATA_RECONCILIATION` to `ENT-324.case_type` before `SCR-931` leaves spec. Small schema change, blocking dependency for a screen already designed around it."},{"n":"7","gap":"Carrier award accept/decline (`PERM-217`) had no screen claiming it \u2014 **RECONCILED**","missing":"`D6` filed a `CHALLENGE` against `D3`/F9: `SCR-911`'s \"outcome\" state is documented as read-only narrative, but the accept/decline action has to live somewhere and no F9 screen claims it. Independently, in the same design pass, `D3` had already added three `[NEW]` frames for exactly this (\u00a75 \u2014 Award Notification & Accept, assembled as `SCR-919`).","found":"`D6` (challenge) + `D3` (independent fix, same round)","consequence":"If left unreconciled, this would have shipped as a real screen gap on the single action F10 names as gating the system's costliest failure mode (row 1). **It does not ship unreconciled** \u2014 D3's answer satisfies D6's own second recommended option (\"or specify a `[NEW]` screen\"). The only residual risk is implementation duplicating the control across `SCR-911`'s outcome state *and* `SCR-919`.","closing":"Confirm with `frontend-engineer-agent`: `SCR-911`'s outcome state stays read-only narrative; the accept/decline control lives solely on `SCR-919`. No further design work needed \u2014 this is now a wiring instruction, not an open gap."},{"n":"8","gap":"Admin/Fraud (`SCR-940`-`943`) has no entry point in the built persona switcher","missing":"`prototype.html`'s shell implements four persona buttons \u2014 Shipper, Carrier, Ops, Driver. Admin/Fraud is a fifth flow page (spine page 14) with zero of its four screens reachable from the running build, regardless of how complete their specs are.","found":"`D6` (\u00a74, \u00a76 item 6)","consequence":"The entire vetting/fraud/audit/enforcement surface \u2014 the layer carrying maker-checker overrides and the `Montgomery`-driven immutable selection record that `DEC-LOCK-001` made load-bearing for the whole product \u2014 is unreachable today. This is a wiring gap, not a spec gap, but it fully blocks verification of anything D5 designs for pages 14.","closing":"A fifth persona-switch entry (or a role-gated sub-nav under an existing persona). `frontend-engineer-agent` task, not a design task \u2014 flagged here so it isn't lost between design and build."},{"n":"9","gap":"No Cancel Load confirmation frame exists at any stage","missing":"`PERM-203`/`204` define who may cancel and when; no `SCR-` renders the cancel action or its confirmation state. `D2` \u00a76 wrote step-level cancel-modal *copy* for four distinct stages (pre-award / post-award pre-dispatch / post-dispatch pre-pickup / mid-transit) but none of it is a reviewed frame with its own states.","found":"`D6` (\u00a76 item 4)","consequence":"Cancellation is one of the highest-liability action families in the product \u2014 it produces TONU claims, RTO charges, and (per row 5) sits directly on top of an unresolved source conflict. It currently exists only as prose inside a flow table, not as a component-level frame anyone can implement consistently across the four stages.","closing":"Promote `D2` \u00a76's four cancel-modal variants to a named frame set (attach to `SCR-904`/`900`), each carrying its own state per spine \u00a73. Cannot fully close until row 5 (the BR-144/FRD conflict) is also resolved, since the mid-transit variant's copy depends on the answer."},{"n":"10","gap":"`RETURN_TO_ORIGIN` has no tracking screen for any persona","missing":"RTO exists as a `Custody Event` type (`ENT-315`) but no `SCR-` shows RTO progress. Three separate flows route freight there \u2014 `D2` S29/S38 (shipper cancellation, delivery refusal), `D4` \u00a75.3 (driver, full refusal), `D5` \u00a72 (ops, delivery-refused case kind) \u2014 and all three reference \"RTO tracking\" as a destination that does not structurally exist as a frame.","found":"`D6` (\u00a76 item, lifecycle-state audit)","consequence":"Freight physically moving back to origin, accruing real detention/RTO charges, has no dedicated view for shipper, carrier, or ops to watch it happen \u2014 three independently-designed flows all point at the same missing screen.","closing":"A shared RTO progress frame, most naturally a `SCR-904`/`913` sub-state, that all three personas' existing flow references can point to consistently instead of a named-but-nonexistent destination."},{"n":"11","gap":"`CANCELLED_BY_SHIPPER` has no confirmation frame as its own named state","missing":"Overlaps row 9's remedy but named specifically by `D6`'s lifecycle-state audit as a state with no screen rendering it distinctly.","found":"`D6` (\u00a76, lifecycle-state audit)","consequence":"Same consequence family as row 9 \u2014 a permitted, BR-cited action with no reviewed confirmation UI. Listed separately because it is one of the six explicitly-audited lifecycle states, not because the remedy differs.","closing":"Same remedy as row 9 \u2014 the mid-transit cancel-modal variant *is* this state's confirmation frame once built."},{"n":"12","gap":"`CARRIER_NO_SHOW` has no dedicated named state at the ops/shipper-facing layer","missing":"Folds into a generic exception banner rather than a distinct, colour+icon+text-labelled state per `D1`'s status discipline. `D5`'s Exception Detail (`SCR-931`) does give it a named \"No-show\" case kind (\u00a72), but that is the ops working-surface, not a shipper- or dashboard-facing named state.","found":"`D6` (\u00a76, lifecycle-state audit)","consequence":"Weakens the \"status is always colour + icon + text, never one generic look\" rule `D1` sets as non-negotiable \u2014 three named, BR-cited failure states (this row + 13 + 14) currently share one undifferentiated banner treatment on `SCR-900`/`904`/`930`.","closing":"Confirm `SCR-931`'s \"No-show\" state (already designed) is sufficient at the ops layer; add an equivalent named state to shipper- and queue-facing screens rather than a shared generic banner."},{"n":"13","gap":"`SHIPPER_NOT_READY` has no dedicated named state at the ops/carrier-facing layer","missing":"Same pattern as row 12 \u2014 `D4` \u00a75.2 gives it a driver-side branch (\"Not ready,\" `SHIPPER_NOT_READY` \u2192 TONU flag) but no distinct named state exists on the screens ops or the carrier actually work from.","found":"`D6` (\u00a76, lifecycle-state audit)","consequence":"Same consequence family as row 12 \u2014 this state carries a real financial consequence (TONU/detention against the shipper, `BR-143`) and currently reads as generic on the screens where a dispatcher or ops reviewer would need to distinguish it at a glance.","closing":"Same remedy pattern as row 12."},{"n":"14","gap":"`PICKUP_REFUSED` has no dedicated named state at the ops/shipper-facing layer","missing":"Same pattern again \u2014 `D4` \u00a75.2 names it clearly at the driver layer (`SCR-922 \u00b7 Refused`, reason `EQUIPMENT_TYPE_MISMATCH`/`UNSAFE_LOAD`) but it has no equivalent named state upstream.","found":"`D6` (\u00a76, lifecycle-state audit)","consequence":"Same consequence family as rows 12-13.","closing":"Same remedy pattern as row 12."},{"n":"15","gap":"Lumper-fee capture is delivery-side only; no pickup-side capture affordance","missing":"`BR-516` scopes the lumper-fee flag+receipt-photo affordance to delivery (`SCR-924`) only. The identical accessorial event happens at pickup docks, and `SCR-923` (pickup Document Capture) has no equivalent field.","found":"`D4` (`CHALLENGE`, \u00a75.2) \u2014 **accepted**","consequence":"Legitimate pickup-side lumper fees go uncaptured at the point of occurrence, creating an under-collection or after-the-fact dispute risk at settlement (`SCR-916`) with no photo evidence trail to support the claim.","closing":"Add the identical flag+receipt-photo affordance to `SCR-923` that already exists on `SCR-924`, scoped by `BR-516`'s pattern."},{"n":"16","gap":"`SCR-908` (Standing & Cancellation History) is structurally unfulfillable","missing":"Depends on an upstream feed (`BR-106`) that is an orphan requirement \u2014 it doesn't exist elsewhere in the BRD/FRD. Already correctly identified and handled: the screen renders \"not yet available,\" never fabricates a value (`EC-907`, resolved as a rendering rule).","found":"F9 itself (`EC-907`) \u2014 reconfirmed by `D2` and `D6`","consequence":"Low near-term risk precisely because the honest-rendering rule is already locked. The screen simply ships permanently empty (a correct, labelled empty state) until `BR-106` is ever built upstream.","closing":"No design action needed. A product/data decision on whether `BR-106`'s upstream feed is ever built \u2014 outside this register's scope."},{"n":"17","gap":"`ExceptionCase.RESOLVED` confirmation trigger for `CARGO_INTEGRITY`/`FRAUD_REVIEW`/`CARRIER_ENFORCEMENT_COLLISION` is unconfirmed against F9's original text","missing":"`EVT-1049` is new at the assembly layer; `SCR-931`'s generic \"Resolve\" action (S5) is the *presumed* trigger for closing these three case kinds, but this was never checked against F9's original prose. `D5` \u00a72 already shows three genuinely different action sets per case kind (no-show / vetting-lapse / delivery-refused) \u2014 the same rigor has not yet been applied to the resolve/close action specifically.","found":"`D6` (\u00a76, coverage audit)","consequence":"Low probability but real: if fraud-case resolution needs senior-tier sign-off (as `D5` \u00a77's own containment/classify flow implies) while a single generic \"Resolve\" button exists on `SCR-931`, a fraud closure could be under-gated relative to what `D5`'s own fraud-review flow requires.","closing":"Confirm `SCR-931`'s Resolve action forks by `case_type` with the same distinctness `D5` \u00a72 already applies to the three other case kinds, specifically checking the fraud-closure gate against `D5` \u00a77's classify/contain flow."},{"n":"18","gap":"`banner--attention` CSS modifier was used in markup but never defined \u2014 **CLOSED**","missing":"The auction-extended banner (`awExtendedBanner`) stacked `.banner--attention` with `.banner--stale`; because `--attention` had no CSS definition, it silently fell through to `--stale`'s styling. Separately, the thin-market banner had no styling at all.","found":"`D1` (`CHALLENGE`)","consequence":"**Fixed by the manager in `prototype.html`.** Recorded here so it is not rediscovered \u2014 the auction-extended banner had been silently inheriting stale styling, and the thin-market banner had no styling at all, before the fix.","closing":"Closed. No further action."},{"n":"19","gap":"`[hidden]` attribute was losing to component `display` rules \u2014 **CLOSED**","missing":"Component rules that set an explicit `display` value beat the UA stylesheet's `[hidden]{display:none}`, so stale banners and empty states stayed visibly rendered across every preview state in `prototype.html`.","found":"Manager (assembler), during this assembly pass","consequence":"**Fixed** \u2014 a global `[hidden]{display:none !important}` rule corrected 14 affected elements. Recorded here so it is not rediscovered.","closing":"Closed. No further action."}],"decisions":[{"title":"DEC-302/303 \u2014 Rival-bid visibility on `SCR-911`","body":"Three agents converged independently on this being unresolved and consequential: F6 found \"sealed +\nstanding-best-flag\" a false middle ground; **F2 proved it leaks rival prices by construction** \u2014\nrepeated decrements binary-search the true price even with amounts hidden; F9 shipped `SCR-911` on the\nconservative default specifically to avoid a `BR-717` violation in production.\n| Option | Adds | Consequence |\n|---|---|---|\n| (a) None \u2014 **built default** | Own bid + countdown + eligible-count only | Cleanest, least informative; weak re-bid signal |\n| (b) Rank-only | \"#2 of 5 eligible\" badge, no amount | At small decrements, rank alone leaks approximate price (`EC-908`) |\n| (c) Leading-price band | Rounded range, never exact | Named leak vector as decrements shrink (F2's finding) |\n**Consequence of not deciding:** `SCR-911` is feature-complete as a swappable component on all three\nshapes but cannot ship past (a) until `DEC-302`/`303` locks \u2014 shipping past it without a decision risks\na `BR-717` violation in production, not a UI bug."},{"title":"DEC-307 / `BR-155` / `EC-325` \u2014 May the shipper decline the lowest qualified bidder?","body":"Asked independently in three separate documents and answered in none of them.\n| Branch | `SCR-903` shape | Consequence |\n|---|---|---|\n| A \u2014 No decline right (`BR-304`, mechanical) | Pure accept/monitor screen | Simpler; matches \"price decides, no human discretion\" (`DEC-LOCK-001`) |\n| B \u2014 Decline right, structured reason required | Adds a reason-code picker tied to on-file carrier data, feeding the immutable selection record (`ENT-312`) | Materially different screen \u2014 not a variant of A, cannot be \"built either way later\" without rework |\n**Consequence of not deciding:** `D2` flags this as the flow's single most-abandonment-prone failure\nstate has no bearing here, but `SCR-903` itself cannot leave spec \u2014 the two branches are structurally\ndifferent screens, and D2's own `CHALLENGE` says so explicitly."},{"title":"DEC-700 \u2014 HOS: planning signal vs. system of record","body":"| Option | Shape | Consequence |\n|---|---|---|\n| A | No hours UI anywhere | Simplest; no feasibility signal to driver or dispatcher |\n| B \u2014 assumed by `D4`/`D3` for spec purposes only | Bounded `FEASIBLE`/`INFEASIBLE` badge, never a ticking clock (`EC-912`'s \"not evaluated\" honest default) | `SCR-920`/`SCR-915`/`SCR-912` designed against this shape; **not wired**, nothing renders without the lock |\n| C | Full RODS dashboard | **Reverses an already-locked data-minimisation constraint** (\u00a714/F12) \u2014 F7 and the assembler both recommend against this |\n**Consequence of not deciding:** `SCR-920` and `SCR-915` cannot finalize; if Boss locks Option A, the\nbadge design in `D4`/`D3` is deleted, not hidden \u2014 it was never meant to survive that outcome.\n---"}],"lifecycle":[{"states":"`DRAFT`\u2192`PUBLISHED`","who":"Shpr (`SHIPPER_LOAD_POSTER`)","sees":"`[SCR-901]` multi-step form, autosaved draft","notified":"\u2014 (`EVT-1000`, T3, Shpr IA only)"},{"states":"`AUCTION_OPEN`\u2192`EXTENDED`\u2192`CLOSED`","who":"Shpr watches; eligible Disp bid","sees":"`[SCR-902]` live bids (Shpr) / `[SCR-911]` bid loop (Disp)","notified":"Ineligible carriers: nothing \u2014 `PERM-230` denies to not-found"},{"states":"`AUCTION_FAILED_*`","who":"Shpr","sees":"`[SCR-902]` failed, named reason","notified":"Disp: `EVT-1004` DG only"},{"states":"`AWARD_PENDING`\u2192`AWARDED`","who":"System re-verifies; Disp accepts/declines (`PERM-217`)","sees":"Shpr: `[SCR-903]` \"verifying\" (`EC-902`) \u2192 outcome. Disp: no dedicated screen \u2014 see \u00a76","notified":"Ops: `EVT-1005` DG"},{"states":"`AWARD_ACCEPTED`","who":"Disp (`+ACCEPT_AWARD`)","sees":"Fleet binding at `[SCR-912]`","notified":"Shpr `EVT-1010` IA,EM"},{"states":"`AWARD_DECLINED`/`LAPSED`/`VOIDED_INELIGIBLE`","who":"Nobody \u2014 this is where the baton drops","sees":"Shpr `[SCR-903]` sees decline/lapse","notified":"Ops `EVT-1008`/`1009` \u2014 **no queue owns it, \u00a76**"},{"states":"`PICKUP_SCHEDULED`\u2192`AT_PICKUP`","who":"Drv","sees":"`[SCR-922]` arrival/departure","notified":"Shpr `[SCR-904]`, Disp `[SCR-913]`"},{"states":"`CARRIER_NO_SHOW`/`SHIPPER_NOT_READY`/`PICKUP_REFUSED`","who":"Ops if unresolved","sees":"No dedicated SCR-, folds into exception banners","notified":"Both sides `EVT-
