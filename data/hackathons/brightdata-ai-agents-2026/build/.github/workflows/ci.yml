name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: pytest
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          # Stub keys — tests must mock external calls (no live API hits in CI)
          ANTHROPIC_API_KEY: sk-ant-test-placeholder
          BRIGHTDATA_API_TOKEN: bd-test-placeholder
          EDGAR_IDENTITY: AltBrief ci@altbrief.com
          # No Langfuse in CI
          LANGFUSE_PUBLIC_KEY: ""
          LANGFUSE_SECRET_KEY: ""
        run: |
          python -m pytest tests/ -v --tb=short --no-header

  # ---------------------------------------------------------------------------
  # Frontend: TypeScript type-check + ESLint
  # ---------------------------------------------------------------------------
  frontend-check:
    name: Frontend TypeScript + Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        env:
          # Stub env vars so Next.js build doesn't choke on missing NEXT_PUBLIC_
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run typecheck

      - name: Lint
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run lint
