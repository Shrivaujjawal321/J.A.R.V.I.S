[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "altbrief-backend"
version = "1.0.0"
description = "AltBrief — Alt-data investment brief agent backend (FastAPI + asyncio)"
readme = "../../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "AltBrief Team" },
]
keywords = ["altdata", "finance", "fastapi", "sse", "brightdata", "claude"]

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "sse-starlette>=2.1.0,<3.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "structlog>=24.1.0,<25.0.0",
    "httpx>=0.27.0,<1.0.0",
    "yfinance>=0.2.40,<1.0.0",
    "edgartools>=5.31.0,<6.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=5.2.0,<6.0.0",
    "gdeltdoc>=1.0.0",
    "anthropic>=0.28.0,<1.0.0",
    "langfuse>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",  # TestClient
    "pytest-mock>=3.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["ANN101", "ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
