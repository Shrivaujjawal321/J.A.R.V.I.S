version: "3.9"

# =============================================================================
# AltBrief — Local dev compose
# Starts backend API only (frontend runs via `npm run dev` for hot-reload).
# BrightData MCP is spawned as a subprocess inside the backend container;
# no separate service needed.
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: altbrief-api:local
    container_name: altbrief-backend

    ports:
      - "8000:8000"

    environment:
      # Load from .env file (copy from .env.example and fill real keys)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - BRIGHTDATA_API_TOKEN=${BRIGHTDATA_API_TOKEN:-}
      - EDGAR_IDENTITY=${EDGAR_IDENTITY:-AltBrief dev@altbrief.com}
      - NASA_FIRMS_MAP_KEY=${NASA_FIRMS_MAP_KEY:-}
      - TIINGO_API_TOKEN=${TIINGO_API_TOKEN:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - DAILY_COST_CAP_USD=${DAILY_COST_CAP_USD:-5.0}
      # CORS: allow local frontend
      - CORS_ORIGINS=http://localhost:3000
      - LOG_LEVEL=DEBUG
      - LOG_JSON=0

    volumes:
      # Mount .cache and data for persistence across container restarts.
      # Pre-warmed cache survives: docker compose restart backend
      - altbrief_cache:/app/.cache
      - altbrief_data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

    restart: unless-stopped

    # Resource limits — mirror Fly.io VM (shared-cpu-2x, 1GB)
    # Keeps local dev representative of production behavior
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

volumes:
  altbrief_cache:
    driver: local
  altbrief_data:
    driver: local
