dominant_narrative:
  summary: "Indian business and tech press portrays Tata Steel as the global benchmark for digital steelmaking — 550-800+ AI models in production, $1.4B in audited savings, 775% ROI, Google Cloud agentic-AI partnership, and a credible 2045 net-zero pathway anchored by Project Aalingana. Coverage of the Port Talbot transition and Netherlands emissions controversies is largely siloed in regional/European outlets; the Indian-language AI/Industry-4.0 narrative rarely intersects with the labor, safety, environmental, or regulatory liability stories happening in parallel."
  sources:
    - "https://www.tata.com/newsroom/business/tata-steel-plants-redefining-future-steelmaking"
    - "https://www.googlecloudpresscorner.com/2026-04-22-Tata-Steel-Partners-with-Google-Cloud-To-Deploy-a-Unified-Agentic-AI-Across-its-Global-Value-Chain"
