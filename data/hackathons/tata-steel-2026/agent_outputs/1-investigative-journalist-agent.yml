    - "https://www.tatasteel.com/sustainability/"

blind_spots:
  - angle: "Two-tier workforce invisible in the AI narrative"
    description: "Tata Steel India operates with ~32,000 permanent employees and ~70,000 contract workers; the recognised Tata Workers Union represents only the regular roll. Every AI/Industry-4.0 case study profiles 'upskilled' permanent staff and the TDA HR assistant; near-zero reporting on whether the 70k contract workers benefit from, are displaced by, or are simply absent from the AI rollout. The April 2024 Jamshedpur LD#1 fatality (Bablu Gope, 27) was a contract worker."
    sources:
      - "https://www.tatasteel.com/investors/integrated-report-2023-24/human-capital.html"
      - "https://www.thefreelibrary.com/Trade+unionism+&+contract+workers+in+selected+industries+in+Jamshedpur-a0463513102"
      - "https://www.dailypioneer.com/2024/state-editions/rising-safety-challenges-in-tata-steel--accident-claims-employee-s-life.html"
    feasibility: medium
    public_interest: high
    confidence: 0.78
    tags: ["labor", "AI-impact", "contract-workforce", "safety"]

  - angle: "Independent verification of the $1.4B AI ROI claim"
    description: "The $1.4B / 775% ROI figure originates from Tata Steel management and is repeated by trade press and vendor case studies. No published independent audit, no segment-level disclosure in annual reports tying specific AI/digital-twin programs to the saving figure, no big-four or third-party assurance referenced. Steel commodity cycles, BSL/NINL integration synergies, and coke-rate gains attributable to non-AI process work could be confounders."
    sources:
      - "https://ifactory.jrsinnovation.com/blog/tata-steel-digital-twin-savings-case-study"
      - "https://aiexpert.network/case-study-tata-steels-ai-transformation/"
      - "https://www.tatasteel.com/investors/integrated-report-2023-24/climate-change-report.html"
    feasibility: medium
    public_interest: high
    confidence: 0.7
    tags: ["AI-ROI", "disclosure-gap", "verification"]

  - angle: "Decarbonisation geography arbitrage — EU pays, India lags"
    description: "Tata Steel Netherlands gets up to €2B of Dutch state support for a €6.5B green-steel project; Port Talbot got £500M UK government money for the EAF transition. Indian operations, which dominate group emissions, have a 2045 net-zero target and explicitly cite 'sparse availability of competitively priced low-carbon fuel' as the reason for slower decarbonisation in India. Critics flag the absence of a Scope-3 SBTi target."
