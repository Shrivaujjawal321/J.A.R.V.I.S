  - angle: "Bhushan Steel / Tata Steel BSL acquisition tail — IBC §32A immunity vs. legacy liabilities"
    description: "Delhi HC held Tata Steel BSL is discharged under IBC §32A from prosecution for offences of the erstwhile promoters, but the order preserves prosecution of pre-resolution officers. Operational creditors (e.g. L&T) took a deep haircut (37% on financial-creditor claims; operational creditors worse). The IBC §32A immunity / shielding-acquirers debate is a continuing public-interest accountability angle and recurs across other distressed-asset purchases by Tata Steel (NINL, etc)."
