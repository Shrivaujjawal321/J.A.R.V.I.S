researcher_notes: |
  Investigative surface — adheres strictly to public-figure / public-role / institution scope; private individuals
  (contract workers, fatality victims, leak sources, executive family members) are out of scope and refused as
  noted above.

  Key methodological points for the war-room downstream:

  1. India defamation context: Strict (IPC §§499/500 civil + criminal). Right-of-reply mandatory; truth-in-public-interest
     defence requires documentary backing. Every contested claim in the top-3 angles must carry document-trail anchors.

  2. The strongest top-pick (Angle 1 — contract-worker invisibility in the AI rollout) is feasible because the
     primary evidence is in already-public Integrated Reports, CLRA filings, court records, and named public
     spokespeople (TWU, academic critics). No need for confidential sources, which keeps legal exposure manageable.

  3. The Tata Steel Nederland criminal-prosecution and €1.4B class-action angle (#8 in underreported list) is the
     most explosive standalone story in the dossier but is being well-covered by Dutch outlets (DutchNews, NRC,
     Bloomberg). Indian-language amplification + India-Group-accountability framing is the under-served angle.

  4. Several angles tagged [unverified] / [low-confidence] (related-party AI vendor concentration; CBAM exposure
     numbers; specific government-contract details) require primary-document retrieval before any draft language.
     Flagged explicitly in confidence scores 0.55.

  5. Hackathon-product-design implications (for the war-room's downstream PM/strategy agents): the contract-worker
     angle, the AI-liability-at-the-blast-furnace angle, and the disclosure-discipline angle each suggest
     potential product surfaces — worker-safety accountability dashboards, AI-decision audit trails for
     industrial settings, ESG-disclosure-verification tooling. These are surfacing-only notes; product selection
     is for the PM agent, not this one.

  6. Cross-checks performed via WebSearch: IJmuiden criminal probe + €1.4B claim + €2.4M penalty (verified to
     Dec 2025 coverage in DutchNews, NL Times, Bloomberg, Business Standard); Port Talbot 2,800 jobs + £500M
     UK subsidy + BF4 30-Sept-2024 closure (verified to Senedd Wales, The Engineer, Unite); 800-AI-models claim
     anchored to 550+ and 300+ agents counts (variance itself flagged); $1.4B savings + 775% ROI (sourced to
     management statements via AIX / iFactory / Oxmaint / YourStory — no independent assurance found); Bhushan
     IBC §32A ruling (verified to IBC Laws / sage journals / Business Today); Noamundi displacement (verified to
     Outlook, TwoCircles, environmentclearance.nic.in PFR); contract-worker / permanent-employee split (verified
     to Tata Steel Integrated Report 2023-24 and Free Library trade-union study).

  Story development support only. Verification, right-of-reply, ethics review, and editorial sign-off required
  before any publication.