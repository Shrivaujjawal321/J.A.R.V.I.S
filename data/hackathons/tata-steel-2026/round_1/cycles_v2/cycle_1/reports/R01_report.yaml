    title: "Force-block X11-grade z-scores"
    technique_class: feature_engineering
    description: |
      Compute grade-conditioned z-scores on X29-X33 (force-cluster, AUC 0.801-0.815)
      using X11 grade code (17 levels). For each coil: z = (X_i - mu_grade) /
      sigma_grade, mu/sigma computed on training fold only (CV-safe). Core insight:
      the same rolling force means different things for thick vs thin grades. V11
      tried X39 z-scores on all 49 features and regressed (-0.014 AUC). This uses
      X11 (17 levels, better-supported) on force-block only, reducing noise.
