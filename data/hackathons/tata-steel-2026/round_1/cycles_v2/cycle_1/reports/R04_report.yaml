primary_recommendation_reasoning: 'TabICLv2 is highest-confidence, lowest-friction option:

  - No row-count workaround needed (unlike TabPFN v1 1000-row limit)

  - BSD 3-Clause license (cleaner than Apache 2.0+attribution or non-commercial)

  - pip install tabicl, sklearn interface, CPU-capable, offline after first download

  - SOTA 2026 benchmark (ICML 2026, TabArena win rate ~80%)

  - Orthogonal inductive bias to GBDT stack

  - Expected OOF lift: +0.3 to +3.0 points (point estimate +1.2)

  - Always pair with R04_rec_3 (tau correction) for free calibration improvement'
build_sequence: '1. pip install tabicl (BSD-3, offline)

  2. Add TabICLClassifier inside existing 5-fold loop, collect OOF

  3. Apply tau=pi1 correction to TabICL OOF probas (R04_rec_3)

  4. Append as 4th column to X_meta for LR meta-learner

  5. Re-run threshold sweep; check hard7 recall still = 100%

  6. If OOF score improves >= 0.5 points: submit

  7. If TabICL disappoints: add TabPFN v1 (pip install ''tabpfn<2'') as 5th base'
