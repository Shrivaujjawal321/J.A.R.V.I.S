# BUILD ORDER RATIONALE
# Priority 1 - BorderlineSMOTE (R05_rec_3):
#   Strongest theory-problem alignment. Hard-7 coils with V4 OOF proba
#   0.0143-0.0269 are by definition borderline minority samples. Their sensor
#   readings sit close to the majority decision boundary. BorderlineSMOTE was
#   designed for exactly this structure. Drop-in <1h. Highest point estimate
#   (1.0) and confidence (4) of all synthesis variants. Build first.
#
# Priority 2 - SMOTEENN (R05_rec_2):
#   The FP attack path. Hard-FP-10 (CoilIDs 689, 642, 247 etc., proba 0.52-0.78)
#   are confusing boundary negatives. ENN cleaning removes them from training
#   exposure. Only resampling approach that DIRECTLY attacks the precision half
#   of the metric. Confidence 4. Under 1h.
#
# Priority 3 - KMeansSMOTE (R05_rec_4):
#   Manifold-safe. If hard-7 form a sub-cluster separate from easy-59 cluster,
#   KMeansSMOTE ensures they receive synthesis budget. Needs StandardScaler
#   integration. 1h.
#
# SKIP in Cycle 1:
#   ADASYN: Good theory but likely failure mode (hard-7 may have zero majority
#     neighbours if truly isolated) means it may be identical to SMOTE. Build
#     only if BorderlineSMOTE shows <+0.3 OOF lift.
#   TabDDPM: Highest ceiling (+3.5) but feasibility=2, effort=6h, and severe
#     overfitting risk on 53 per-fold positives. Reserve for Cycle 2.
#   CTGAN/TVAE: TabDDPM strictly dominates both per 2023 ICML benchmarks.
#     Not worth separate Cycle 1 iterations.
#   Mixup: Mild benefit ("4/6 UCI datasets improved") but requires custom
#     training loop. Likely +0.1-0.3 vs +1.0 for BorderlineSMOTE. Skip.
#   Random oversample + noise: Strictly dominated by any SMOTE variant.
