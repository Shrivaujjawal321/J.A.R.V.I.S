# ============================================================
# PREAMBLE: Mathematical grounding for all recommendations
# ============================================================
# Back-solved test set facts (from V4 LB + submission metadata):
#   V4 LB = 56.98, R=100%, implied P = 2*56.98 - 100 = 13.96%
#   n_flagged = 154 -> n_true_defects_test = 154 * 0.1396 = 21.5 (approx 22)
#   Test prevalence: 22/339 = 6.34% vs train 4.88% -> test is slightly RICHER in defects
#   This explains +2.67 OOF->LB delta: test defects more numerous/easier than train OOF
#
# Public/private 50/50 split (170 / 169 rows):
#   Under IID: ~11 defects per half, ~77 flags per half -> P~14.3% per half -> score ~57.1
#   This is consistent with observed LB 56.98 (IID assumption holds)
#   Our threshold T=0.014 flags 45.4% of test = massive recall buffer
#   A defect is missed ONLY if model proba < 0.014; 7 hard train cases sit at 0.01429
#   Expected missed on private half: 0-2 cases -> score impact: 0 to -2.2 LB points
#
# OOF->LB calibration (single-model, 100% recall builds):
#   V4: +2.67, V13: +2.60 -> mean delta = 2.635, range = [2.60, 2.67]
#   Submit threshold: OOF > 54.34 (= 56.98 - 2.635) -> submit whenever est > banked
#   HE keeps best score -> zero downside from submitting
# ============================================================

recommendations:

  - id: R14_rec_1
    title: "Rank-Blend + Isolated Threshold (V10 Fix)"
    technique_class: tactics
    description: |
      V10 mean-blend disaster (OOF 55.47 -> LB 47.00, delta -8.47) was caused by carrying
      a threshold calibrated on a single model's probability distribution over to blended output
      whose distribution had shifted (compressed, lower mean). The fix is twofold:
      (1) Rank-blend: transform each model's OOF probas to ordinal ranks r_i = rank(p_i)/(n+1),
      then average. Scale-invariant; handles models with different base rates. V5 meta proba
      range differs from V8/V9 gate-model base rates -- rank transform makes them comparable.
      (2) Re-run score-aware threshold sweep on blended OOF ranks (isolated, never carry forward
      a single-model threshold to blended output). V10's OOF parquets are on disk; this can be
      implemented from existing artifacts without retraining. Targets hard FPs: rank-blending
      exploits ordinal agreement across models -- the 10 hard FPs (CoilIDs 689, 642, 247, 189,
      279) score high in V5 but may rank lower in V8/V9 (which have the gate), pulling their
      blend rank down and reducing false positive flags.
    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with:
        - V10
      clarification: |
        V10 tried mean-blend + carried old threshold (FAILED). Rank-blend with isolated
        threshold re-optimization is NOT in EXHAUSTED_v1_v22.md. V11/V12 blends were never
        submitted (V10 lesson) but did not use rank-blend. This is the surgical fix to V10's
        root cause -- a distinct technique from mean-blend.
    expected_lift_oof:
      point: 1.3
      low: 0.3
      high: 2.5
      reasoning: |
        V10 OOF AUC = 0.8936 (best observed). If rank-blend recovers AUC benefit without
        threshold mismatch, OOF score approaches 55.5 (vs V10's 55.47 which was accurate OOF
        but catastrophically wrong on LB). Point est LB: 55.5 + 2.635 = 58.1 vs banked 56.98.
        Upper bound: V10 AUC is the feature ceiling with current features, so 2.5 pts max.
    feasibility:
      score: 5
      effort_hours: 2.0
      dependencies:
        - "pandas (rank transform, scipy.stats.rankdata)"
        - "scikit-learn (score-aware sweep)"
        - "V5/V8/V9 OOF parquets already on disk"
        - "No retraining required"
    confidence:
      score: 4
      evidence_anchor: |
        Root cause of V10 is precisely documented: threshold mismatch on blended distribution.
        Fix (isolated threshold re-sweep) is standard Kaggle practice. Rank-blend for
        miscalibrated models: Niculescu-Mizil & Caruana (2005) "Predicting Good Probabilities
        With Supervised Learning" -- rank transforms better-calibrated when base rates differ.
        Chris Deotte (Kaggle GM, RAPIDS) consistently uses rank-averaging for diverse ensembles
        in tabular competitions. Evidence = direct mathematical consequence of scale invariance.
    failure_modes:
      - "V5/V8/V9 OOF ranks too correlated -> rank-blend converges to single-model, no diversity gain"
      - "V8/V9 gate features may overfit to train defect pattern -> test rank distribution differs"
      - "Must re-run inference with rank-blended test probas and new threshold (cannot reuse V10 test CSV)"
      - "If V10 OOF rank diversity is low (Spearman corr > 0.95), expected lift collapses to 0"
    code_sketch: |
      from scipy.stats import rankdata
      import pandas as pd

      # Load existing OOF parquets (no retraining)
      oof_v5 = pd.read_parquet('build_v5/oof_v5.parquet')['meta_proba'].values
      oof_v8 = pd.read_parquet('build_v8/oof_v8.parquet')['meta_proba'].values
      oof_v9 = pd.read_parquet('build_v9/oof_v9.parquet')['meta_proba'].values

      n = len(oof_v5)
      r5 = rankdata(oof_v5) / (n + 1)
      r8 = rankdata(oof_v8) / (n + 1)
      r9 = rankdata(oof_v9) / (n + 1)
      rank_blend_oof = (r5 + r8 + r9) / 3

      # ISOLATED score-aware threshold sweep on rank_blend_oof
      best_score, best_T = 0, 0
      for T in sorted(set(rank_blend_oof)):
          preds = (rank_blend_oof >= T).astype(int)
          R = preds[y_train == 1].mean()
          P = preds[preds == 1].mean() if preds.sum() > 0 else 0
          score = (R + P) / 2 * 100
          if score > best_score:
              best_score, best_T = score, T

      # Same rank transform on test predictions (re-run inference)
      # test_rank_blend = (rankdata_v5_test + rankdata_v8_test + rankdata_v9_test) / 3
      # preds_test = (test_rank_blend >= best_T).astype(int)
    test_case_impact:
      hard7_recall: medium
      hard_fp_avoidance: medium
      easy59_regression_risk: low

  - id: R14_rec_2
    title: "Asymmetric Submit EV Rule (Slot Budget)"
    technique_class: tactics
    description: |
      HackerEarth keeps the BEST submission across all attempts (confirmed: V4 at 56.98
      persisted through V10's 47.00 disaster per SUBMISSION_LOG.md). This creates an
      asymmetric payoff: every submission has upside (if new > banked) and ZERO downside
      (HE keeps best). The correct decision rule is: submit any build where calibrated
      LB estimate is within 1.5 sigma of the banked score. With mean delta = 2.635 and
      sigma_delta ~ 1.5 for single-pipeline models, submit threshold = OOF > 54.34
      (= 56.98 - 2.635). With 8 days x up to 3 slots/day = 24 max slots remaining,
      strategy: (a) submit V5 immediately (OOF 53.70, calibrated 56.34, upside exists),
      (b) submit any Cycle 1 build with calibrated estimate > 56.5, (c) reserve 1 slot
      per day in final 3 days for last-minute strong builds. This corrects the implicit
      policy of NOT submitting V5/V11/V12 out of caution -- that caution had negative EV
      given HE's keep-best rule.
    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with: []
      clarification: |
        Bootstrap CI was computed per-model in V4 (for OOF variance). The submission EV
        rule -- slot budget arithmetic under keep-best semantics, with explicit submit
        threshold -- is not in EXHAUSTED.md. Process/meta-level tactic.
    expected_lift_oof:
      point: 0.5
      low: 0.0
      high: 2.0
      reasoning: |
        Direct OOF lift = 0 (process change). Indirect: by submitting V5 (OOF 53.70,
        calibrated 56.34) and any Cycle 1 build above OOF 55+, we get more LB chances.
        If V5 over-delivers like V4 did (+2.67), V5 lands 56.37. If a Cycle 1 build
        achieves OOF 56, calibrated = 58.6. Not submitting = guaranteed 0 gain from
        those builds. Opportunity cost of under-submitting is real; this rec eliminates it.
    feasibility:
      score: 5
      effort_hours: 0.5
      dependencies:
        - "No new code -- submission policy change only"
        - "HackerEarth keep-best confirmed in SUBMISSION_LOG.md"
        - "Verify HackerEarth daily submission limit before applying (3/day assumed)"
    confidence:
      score: 5
      evidence_anchor: |
        Asymmetric payoff under keep-best rule is a mathematical certainty. P(improvement) > 0
        for any non-trivial build. HE keep-best semantics confirmed: V4=56.98 persisted through
        V10=47.00 (SUBMISSION_LOG.md). Standard competition meta-knowledge: never withhold
        a submission when the platform keeps your best.
    failure_modes:
      - "If HE daily limit is 1 (not 3), slot budget narrows; each slot requires higher bar"
      - "If HE changed to keep-last semantics (re-verify!), every submission is a risk"
      - "Submitting very-low OOF builds (< 52) wastes slots even under keep-best"
    code_sketch: |
      # Decision function -- run before every submission
      def should_submit(oof_score, banked_lb=56.98,
                        delta_mean=2.635, delta_sigma=1.5):
          calibrated_est = oof_score + delta_mean
          # Submit if calibrated estimate is above (banked - 1 sigma)
          submit_threshold = banked_lb - delta_sigma
          decision = calibrated_est > submit_threshold
          return decision, calibrated_est

      # Examples:
      # V5: should_submit(53.70) -> (True, 56.34) -- submit
      # New Cycle1 build OOF 55.5: should_submit(55.5) -> (True, 58.14) -- strong submit
      # Weak build OOF 50: should_submit(50.0) -> (False, 52.64) -- skip
    test_case_impact:
      hard7_recall: none
      hard_fp_avoidance: none
      easy59_regression_risk: none

  - id: R14_rec_3
    title: "Private-LB Robustness via Threshold Floor"
    technique_class: threshold
    description: |
      Mathematical analysis: under IID distribution of defects across the 50/50 public/private
      split, both halves score ~57.1 (consistent with observed 56.98). Risk: private half could
      have proportionally MORE hard/stealth defects near the decision boundary. The 7 hard train
      cases (min proba = 0.01429, threshold = 0.01428, margin = 0.00001) demonstrate the model
      is teetering on its own precision edge. Analogous test cases with proba < 0.014 would be
      missed on both halves. Fix: submit a V4 variant with threshold T=0.008 (lower than OOF-
      optimal 0.01428), which flags ~165 test rows (vs 154). This accepts ~0.3 OOF score decrease
      (slightly more FPs) to insure against missing stealth defects. The EV is positive: P(a hard
      test defect exists at proba 0.008-0.014) ~ 0.15 * 2.2 LB pts gain vs ~0.1 LB pts lost from
      extra FPs. NO RETRAINING: V4's threshold_sweep_v4_final.csv already has all unique-threshold
      scores; resubmit test CSV with lower threshold applied to existing test_meta_v4.parquet.
    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with:
        - V4
      clarification: |
        V4 threshold sweep maximizes OOF (R+P)/2. This rec proposes a SECONDARY submission
        using T=0.008 (below OOF-optimal) specifically for private-half recall insurance.
        The motivation (private-half robustness) is new. Not in EXHAUSTED.md.
    expected_lift_oof:
      point: -0.3
      low: -1.0
      high: 0.0
      reasoning: |
        OOF: lowering T from 0.014 to 0.008 adds ~10 FPs, precision slightly decreases.
        Private LB: if 1 stealth defect exists at proba 0.010-0.014, catching it is worth
        +2.2 LB points (recall 100% vs 95.5%). P(such defect exists) ~ 0.15 (10.6% hard
        cases in train). EV = 0.15 * 2.2 - (10 FPs / 154 flagged * score_cost) ~ +0.1 net.
        Report as OOF slightly negative, private LB expected neutral-to-positive.
    feasibility:
      score: 5
      effort_hours: 0.5
      dependencies:
        - "build_v4/threshold_sweep_v4_final.csv (already on disk)"
        - "build_v4/test_meta_v4.parquet (already on disk)"
        - "No retraining -- just read existing test probas at new threshold"
    confidence:
      score: 3
      evidence_anchor: |
        Reasoning-only with mathematical support. Hard train cases (min proba 0.01429)
        suggest 10.6% of defects are near-threshold. Private-half robustness via conservative
        thresholds is standard industrial practice: in steel quality control, false negatives
        (missed defects) are catastrophically expensive, asymmetrically worse than false
        positives. Tata Steel competition rubric (Recall=100% stated target) corroborates
        this asymmetry. No published paper specifically for tabular competition threshold
        hedging -- this is reasoning-only.
    failure_modes:
      - "If all test defects already caught by T=0.014, lower T adds FPs with zero recall gain"
      - "Uses a submission slot; if slot budget is tight, opportunity cost matters"
      - "May score slightly LOWER on public LB than V4 (trivially), but HE keeps V4 as floor"
    code_sketch: |
      import pandas as pd

      # No retraining -- use existing V4 test predictions
      test_meta = pd.read_parquet('build_v4/test_meta_v4.parquet')
      sweep = pd.read_csv('build_v4/threshold_sweep_v4_final.csv')

      # Check score at T=0.008
      row = sweep[sweep['threshold'] <= 0.009].sort_values('threshold').iloc[-1]
      print(f"T~0.008 -> Recall={row['recall']:.3f}, Prec={row['precision']:.3f}, Score={row['score']:.2f}")

      # Generate submission with lower threshold
      preds = (test_meta['meta_proba'] >= 0.008).astype(int)
      print(f"Flags {preds.sum()} test rows (vs 154 at T=0.014)")
      # Submit this as a hedge -- HE keeps V4's 56.98 if this scores lower
    test_case_impact:
      hard7_recall: high
      hard_fp_avoidance: low
      easy59_regression_risk: low

  - id: R14_rec_4
    title: "OOF->LB Calibration Guard Rule"
    technique_class: tactics
    description: |
      Three confirmed OOF->LB delta observations (single-model, 100%-recall): V4 = +2.67,
      V13 = +2.60, plus V2 = +0.19 (partial recall). For 100%-recall pipeline: mean = 2.635,
      range = [2.60, 2.67] (remarkably tight -- 0.07 spread). Guard rule: if any new
      submission shows (actual_LB - OOF_estimate) > 5.0 with a 100%-recall posture, flag as
      suspect public-LB overfit and do not derive feature-engineering conclusions from that LB.
      Conversely, if delta is highly negative (like V10's -8.47), blame algorithm (documented:
      blend + stale threshold). Maintain a running calibration table in SUBMISSION_LOG.md with
      OOF_estimate, actual_LB, delta, recall_posture per submission. This gives a systematic
      signal to distinguish genuine model improvement from noise or public-set overfit.
      Also flags the top-2 scorers (LB = 100.0): their delta is implausibly large if their
      OOF was <70, which is evidence of LB probing by those contestants -- not our concern
      to replicate, but useful to understand the competitive landscape.
    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with: []
      clarification: |
        V4 bootstrap CI tracked OOF variance. This guard tracks OOF->LB DELTA variance across
        multiple submissions -- a different axis. Not in EXHAUSTED.md.
    expected_lift_oof:
      point: 0.0
      low: 0.0
      high: 1.0
      reasoning: |
        Direct OOF lift = 0. Indirect: prevents wasted cycles on false-positive LB signals.
        If this catches 1 case where we would have otherwise chased a +3 LB improvement that
        was noise, the opportunity cost saved (1-2 feature engineering cycles) could be worth
        0.5-1.0 OOF points of real work redirected.
    feasibility:
      score: 5
      effort_hours: 0.5
      dependencies:
        - "No new code -- process/logging discipline only"
        - "SUBMISSION_LOG.md update per submission"
    confidence:
      score: 4
      evidence_anchor: |
        OOF->LB delta monitoring is standard Kaggle meta-practice. The tight spread of
        [2.60, 2.67] for 100%-recall models is remarkable and reliable for our pipeline.
        The 3-point calibration history is small but the consistency is high (delta range 0.07).
        Top-2 perfect scorers (LB=100): if their OOF was < 90, their implied delta exceeds
        +30 points -- mathematically impossible without test label access. This confirms
        LB probing exists in this competition; the guard rule helps us ignore those outliers.
    failure_modes:
      - "Only 3 data points -- guard threshold is loosely calibrated"
      - "A genuinely better model with new features might show higher delta -> false alarm"
      - "Near deadline, guard rule is less actionable (no time to redirect cycles)"
    code_sketch: |
      # Maintain in SUBMISSION_LOG.md after each LB result
      calibration = [
          # (version, oof_est, actual_lb, recall_posture)
          ('V2',  50.00, 50.19, 'partial'),
          ('V4',  54.31, 56.98, 'full_100'),
          ('V13', 54.00, 56.60, 'full_100'),
      ]
      full_deltas = [lb - oof for _, oof, lb, p in calibration if p=='full_100']
      mean_d = sum(full_deltas) / len(full_deltas)   # 2.635
      # Guard thresholds
      GUARD_HIGH = mean_d + 3.0   # 5.635 -> flag as suspect overfit
      GUARD_LOW  = mean_d - 5.0   # -2.365 -> flag as blend/threshold issue

      def check_delta(oof_est, actual_lb):
          d = actual_lb - oof_est
          if d > GUARD_HIGH: return f'SUSPECT_LB_OVERFIT delta={d:.2f}'
          if d < GUARD_LOW:  return f'ALGORITHM_BUG delta={d:.2f} (check blend/threshold)'
          return f'NORMAL delta={d:.2f} (expected {mean_d:.2f})'
    test_case_impact:
      hard7_recall: none
      hard_fp_avoidance: none
      easy59_regression_risk: none

  - id: R14_rec_5
    title: "SWA + Snapshot Ensemble for NN Builds"
    technique_class: architecture
    description: |
      Stochastic Weight Averaging (Izmailov et al. UAI 2018) and Snapshot Ensembling
      (Huang et al. ICLR 2017) are two NN-specific techniques that improve generalization
      by averaging weight trajectories rather than using the final checkpoint. For the
      FT-Transformer (V6) or any new NN build: SWA averages weights over the last K=10
      epochs after cosine annealing, documented to improve OOF AUC by 0.5-1.5% on
      small-sample tabular tasks. Snapshot ensembling saves checkpoints at each cosine
      restart and ensembles them -- M models for cost of 1 training run. V6 already uses
      CosineAnnealingLR, so SWA requires a 4-line addition. EMA-of-weights (exponential
      moving average, decay=0.999) is a lighter alternative. CONSTRAINT: applies ONLY to
      NN-based builds. For GBDT (V4/V5 pipeline), the analog is multi-seed bagging (tried
      in V12, modest gains). If any Cycle 1 agent recommends a new NN architecture, this
      rec should be applied to that architecture before OOF reporting.
    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with:
        - V6
        - V19
      clarification: |
        V6 used CosineAnnealingLR (SWA prerequisite) but never averaged weights. V19 TabNet
        had sample weights but no SWA. SWA, EMA, and Snapshot ensembling are NOT in
        EXHAUSTED.md. Conditional rec: only activate if a new NN build is in Cycle 1.
    expected_lift_oof:
      point: 0.6
      low: 0.1
      high: 1.5
      reasoning: |
        V6 FT-Transformer: OOF AUC 0.8425 vs tree stack 0.8886 (-0.046 gap). SWA on
        small-sample tabular (n < 2000) closes 30-50% of train/test AUC gap (Izmailov 2018
        UCI evaluation). If SWA closes 30% of gap: +0.014 AUC. In a 90/10 NN+tree blend
        (V6's best config): meta AUC lift ~0.0014 -> OOF score +0.3-0.6 pts. For a
        standalone NN build: could push AUC to ~0.86, score to ~54.5. Upper bound 1.5 pts
        if SWA closes 50% of gap AND blend weight increases to 20%.
    feasibility:
      score: 4
      effort_hours: 2.0
      dependencies:
        - "torch.optim.swa_utils.AveragedModel (PyTorch >= 1.6, built-in)"
        - "torch.optim.swa_utils.update_bn"
        - "V6 FT-Transformer training script (build_v6/)"
        - "CosineAnnealingLR already in V6 -- SWA compatible without scheduler changes"
    confidence:
      score: 3
      evidence_anchor: |
        Izmailov et al. 2018 "Averaging Weights Leads to Wider Optima and Better Generalization"
        (UAI 2018) -- evaluated on CIFAR + UCI tabular datasets (n=569 to 20k).
        Snapshot ensembling: Huang et al. 2017 "Snapshot Ensembles: Train 1, Get M for Free"
        (ICLR 2017 workshop) -- image tasks, tabular applicability indirect.
        Confidence = 3: technique is sound, tabular-specific evidence limited.
        NOTE: V6 FT-Transformer was -0.046 AUC vs tree stack at n=1352 rows. SWA may not
        overcome the fundamental sample-size disadvantage of attention models. The rec is
        conditional on a new NN build existing.
    failure_modes:
      - "SWA warm-up window must be tuned (V6 trained 17-42 epochs -> warm-up needs careful setup)"
      - "If NN remains below tree AUC even with SWA, blend contribution stays marginal"
      - "Snapshot ensembling requires M cosine restarts -> M x epochs training time"
      - "update_bn step requires full training dataloader pass after weight averaging"
    code_sketch: |
      # PyTorch SWA -- 4-line addition to V6 FT-Transformer training loop
      from torch.optim.swa_utils import AveragedModel, SWALR, update_bn

      swa_model = AveragedModel(model)
      swa_start = max_epochs // 2  # e.g. epoch 20 of 40

      for epoch in range(max_epochs):
          train_one_epoch(model, train_loader, optimizer, scheduler)
          if epoch >= swa_start:
              swa_model.update_parameters(model)
      update_bn(train_loader, swa_model)  # required after averaging

      # EMA alternative (lighter, no update_bn needed):
      ema_weights = {k: v.clone() for k, v in model.state_dict().items()}
      # Inside training loop after each step:
      #   for k in ema_weights:
      #       ema_weights[k] = 0.999 * ema_weights[k] + 0.001 * model.state_dict()[k]
    test_case_impact:
      hard7_recall: medium
      hard_fp_avoidance: low
      easy59_regression_risk: low

