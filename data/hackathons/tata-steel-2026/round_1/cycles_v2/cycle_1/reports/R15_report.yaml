      Rec 4 is hard-dependent on R10 delivering per-row uncertainty
      (ensemble variance, MC-dropout, or jackknife conformal scores).
      If R10 is null or its variance signal is weak, Rec 4 cannot be
      banked. Recommend gating Rec 4 on R10 success in synthesis.
  - R-any-feature-engineering: >
      Per-grade thresholds (Rec 1) compose with any new feature work
      because the underlying model is unchanged -- apply Rec 1 AFTER
      whatever feature/model wins, not before. It is a tail-fix not
      a head-fix.
  - R-any-stacking-or-calibration: >
      Bootstrap-conservative threshold (Rec 3) is INDEPENDENT of which
      stack / calibration is used. It is a post-hoc lever that can be
      stacked with anyone else's modeling rec without conflict.

# ============================================================
# HONEST CEILING STATEMENT
# ============================================================
# Recs 1-4 are POST-HOC decision-rule fixes on V4's existing OOF probas.
# Combined realistic OOF lift: +0.5 to +1.5 points.
# Combined realistic LB lift: highly uncertain (+0 to +1.5), because
# the +2.67 V4 train->test calibration delta means OOF-optimization
# does not perfectly transfer; over-fitting OOF on threshold tweaks
# is a real risk on a metric this brittle.
# These are LEGITIMATE marginal-improvement levers but will NOT close
# the 23-point gap to the top-10 cutoff (80.6) alone. They are
# tail-polish, not head-moves. Bank them only AFTER any meaningful
# feature-or-model gain from other R-agents is verified.
