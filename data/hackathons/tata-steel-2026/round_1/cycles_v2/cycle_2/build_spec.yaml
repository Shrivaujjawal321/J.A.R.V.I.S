      - build_v27/approach.md
      - build_v27/oof_v27.parquet  # V23 OOF with abstain rule applied
      - build_v27/chosen_threshold_v27.json
      - build_v27/expected_submission.csv
      - build_v27/solution.ipynb
    acceptance_gates:
      - oof_score >= 54.41  # V23 floor
      - bootstrap_lower_ci >= 53.0
      - hard7_caught >= 1
      - easy59_caught >= 58
    expected_oof: 55.45
    expected_cal_lb: 58.12
