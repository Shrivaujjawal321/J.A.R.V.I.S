    rationale: "Compound feature-engineering build targeting CoilID 473 + Hard-FP-10. Independent of V29."

# ===== DISPATCH STRATEGY =====

dispatch:
  parallel: [V27, V28, V29, V30]  # 4 independent builds
  rationale: |
    V27/V28 are post-hoc and fast (30 min each, no training).
    V29 is heavy (4-6h) but doesn't share files with others.
    V30 builds on V23 OOF, independent of V29.
    All 4 can run concurrently.

