# Cycle 2 — Build Specification (Synthesis Output)
# Generated 2026-05-23 from 16 C2 R-agent YAML reports.
# Baseline floor: V23 OOF 54.41, cal_LB 57.08 (V4 banked 56.98).

cycle: 2
timestamp_utc: "2026-05-23T19:30:00Z"
v4_banked_lb: 56.98
v23_oof: 54.41
v23_cal_lb_est: 57.08

# ===== EMPIRICALLY CONFIRMED LIFTS (already measured on V23/V4 OOF data) =====

confirmed_post_hoc_wins:

  - id: C2_N04_rec_1
    title: "Multi-band abstain on V23 OOF"
    technique_class: threshold
    measured_lift_cv: "+1.04 ± 0.21 OOF (5-fold CV)"
    bands: "[0.04,0.055] ∪ [0.09,0.10] ∪ [0.27,0.33] ∪ [0.41,0.44]"
    expected_new_oof: 55.45
    expected_cal_lb: 58.12
    risk: very_low  # recall=1.0 in every fold, 0/66 positives lost
    rationale: |
      THE strongest empirically-validated Cycle 2 finding. CV-validated (not just
      in-sample). Pre-registered bands. Each band represents an "empty zone" in V23
      OOF where flagging gives more FPs than TPs.

  - id: C2_R14_rec_1
    title: "V4+V26 global rank-blend with isolated threshold"
    technique_class: tactics
    measured_lift: "+0.38 OOF (vs V4), +0.28 OOF (vs V23)"
    blend_method: "global rank average, then re-sweep threshold on blended distribution"
    expected_oof: 54.69
    expected_cal_lb: 57.36
    risk: low  # bootstrap std 0.908, CI lower 53.66
    rationale: |
      V10 ban LIFTED. V10 failed because threshold carried; rank-blend with isolated
      re-threshold structurally prevents that. V4 itself is a blend (LGB+XGB+CatBoost+LR).
      V26's BorderlineSMOTE bias provides diversity despite solo regression.

# ===== EMPIRICALLY FALSIFIED (negative results, do NOT build) =====

falsified_recs:

  - id: C2_R09 uLSIF/IWCV
    evidence: "AV AUC 0.477 (train≈test), 0/49 PSI>0.25 post-Bonferroni. Hard-FP-10 are MORE train-like → IWCV moves boundary WRONG way."

  - id: C2_R10 Mondrian conformal abstain
    evidence: "11 configs tested. All regress -6 to -33 OOF. Hard-FP-10 confidently wrong (size=1 sets), not uncertain."

  - id: C2_R15_rec_1 per-grade threshold
    evidence: "In-sample +0.34, nested CV -1.39 (overfit ~4 positives/grade)."

  - id: C2_R15_rec_3 bootstrap-conservative T
    evidence: "25th-pctile = argmax — literal null lever."

  - id: C2_N04_rec_2 per-grade abstain
    evidence: "5-fold CV -7.76 ± 4.53 OOF, recall collapses 1.0 → 0.83."

# ===== ARCHITECTURE PATH (medium-high conviction, longer build) =====

architecture_recs:

  - id: C2_N01
    title: "NS1 — V4 replacement Stage-1 from scratch"
    components:
      - "LGB-RFL (r=0.5, q=0.3) — confirmed +0.0108 AUC vs V4 LGB"
      - "TabICLv2 standalone (BSD-3, offline pip install tabicl)"
      - "CatBoost with Optuna AUC objective (depth 6-8, lr 0.03-0.05)"
      - "5-seed FT-Transformer deep ensemble with EMA/SWA (C2_N05)"
    meta: "LR + isotonic calibration (NOT Platt)"
    expected_oof_auc:
      pessimistic: 0.892  # if TabICL fails
      base: 0.905
      optimistic: 0.922
    expected_lift_vs_v23: "+0.5 to +2.5 OOF as Stage-1"
    risk: medium  # TabICLv2 install + 4-component coordination
    effort_hours: 4-6

  - id: C2_R08_rec_1
    title: "Cascade with NS1 Stage-1 (compound on N01)"
    depends_on: C2_N01
    expected_lift: "+2.2 OOF over V23 if NS1 AUC ≥ 0.92"
    bundled: "CT features at Stage-1 (C2_R02) + within-pool z-scores Stage-2 (C2_N03) + X14 grade residual (C2_N02)"
    expected_final_oof: "57.0 (range 55.5-59.5)"
    expected_cal_lb: "59.7"

# ===== FEATURE ENGINEERING PATH (conditional, medium conviction) =====

fe_recs:

  - id: C2_N06_rec_2
    title: "Per-grade 5-NN anomaly distance on {X14,X18,X22,X23,X41,X8}"
    measured_proxy_lift: "+0.033 AUC (0.766 → 0.799 in HistGB proxy)"
