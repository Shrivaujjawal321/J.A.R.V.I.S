cascade_impact:
  v23_with_v4_stage1: "OOF 54.41, Stage-1 AUC 0.884"
  projected_v23_with_ns1_base:
    stage1_auc: 0.905
    estimated_cascade_oof: "55.5-57.0 (before Stage-2 improvement)"
    calibrated_lb_estimate: "58.2-59.7"
    basis: "Linear scaling from V23 empirical data; Stage-2 gains additive"
  n02_synergy: |
    Hard-FP-10 counterfactual FE (C2_N02) targets same structural problem.
    New features from N02 should be added to V4 feature matrix before NS1
    trains. N01 (NS1) and N02 are parallel tracks — final build uses both.

# ===========================================================================
# ANTI-PATTERNS FORBIDDEN IN NS1
# ===========================================================================

anti_patterns_forbidden:
  - "Mean-blend NS1 with V4 (V10 disaster: LB 47.00 vs est 58.14)"
  - "Pseudo-label test negatives (V4: OOF 54.31 -> 52.40)"
  - "Threshold sweep on component OOFs before stacking — only sweep meta output"
  - "SMOTE on TabICL (arxiv:2605.21742: degrades PFN/ICL performance)"
  - "Early stopping on FT-Transformer (V6: stopped epoch 17-42 = training noise variance)"
  - "Platt/sigmoid calibration on NS1 meta — use isotonic"
  - "Per-grade specialist models (V15: AUC 0.798, score 52.85)"
  - "pos_weight > 25 (V7 M3: scale_pos_weight=100 crushed precision)"

