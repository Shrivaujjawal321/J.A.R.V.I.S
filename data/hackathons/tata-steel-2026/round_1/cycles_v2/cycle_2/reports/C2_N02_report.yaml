  - id: C2_N02_rec_2
    title: Counterfactual on-manifold gate via Mahalanobis + autoencoder
    technique_class: tactics
    description: |
      Defensive companion to rec_1. The single biggest failure mode of
      DiCE is off-manifold counterfactuals — DiCE may find a path that
      flips the model proba but corresponds to a feature vector that
      does not exist in any real coil. Acting on such "fragile features"
      then prunes legitimate signal. Mitigation: train a lightweight
      tabular autoencoder (3 hidden, bottleneck 8) on training data
      and use reconstruction error as a manifold-membership gate. For
      each DiCE counterfactual c of original q:
        gate_pass = (mahalanobis(c, train_mean, train_cov_inv)
                     <= mahalanobis_p99(train))
                    AND
                    (autoenc.reconstruct(c) MSE
                     <= autoenc.reconstruct(train) MSE p99)
      Only CFs that PASS both gates contribute to consensus counting.
      Without this gate, rec_1 results are not trustworthy.
    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with: []
    expected_lift_oof:
      point: 0.0
      low: -0.2
      high: 0.3
      conditional_on: |
        rec_1 is being executed. This is a quality gate on rec_1 outputs,
        not a standalone lift.
    feasibility:
      score: 4
      effort_hours: 1.5
      dependencies:
        - torch>=2.0
        - scikit-learn>=1.4
    confidence:
      score: 4
      evidence_anchor: |
        Pawelczyk M., Bielawski S., van den Heuvel J., Richter T., Kasneci G.
        (2021) "CARLA: A Python Library to Benchmark Algorithmic Recourse
        and Counterfactual Explanation Algorithms" NeurIPS 2021 D&B Track
        (arXiv 2108.00783). CARLA explicitly recommends autoencoder-based
        manifold gates over raw L1 search.
        Verma S., Boonsanong V., Hoang M., Hines K., Dickerson J., Shah C.
        (2020) "Counterfactual Explanations and Algorithmic Recourses for
        Machine Learning: A Review" arXiv 2010.10596 — survey establishing
        the on-manifold requirement.
        Reasoning for THIS dataset: 1352 train rows x 49 features. The
        manifold is SPARSE. Off-manifold CFs are the dominant failure mode
        of DiCE in this regime.
    failure_modes:
      - |
        Autoencoder underfits on n=1352 — reconstruction error is too
        permissive. MITIGATION: also require Mahalanobis (closed-form
        parametric check). Both gates must pass.
      - |
        All DiCE CFs for all 10 HFPs fail the gate — empty consensus
        set. FALLBACK: drop reconstruction gate, keep only Mahalanobis.
        If still empty, report status: GATE_BLOCKED and skip inverse-FE
        (do NOT engineer features from off-manifold CFs).
    code_sketch: |
      import torch, torch.nn as nn, numpy as np
      from scipy.spatial.distance import mahalanobis
      X_tr = train_df[feat_cols].values
      mu, cov_inv = X_tr.mean(0), np.linalg.pinv(np.cov(X_tr.T) + 1e-6*np.eye(X_tr.shape[1]))
      maha_train = np.array([mahalanobis(x, mu, cov_inv) for x in X_tr])
      maha_p99 = np.quantile(maha_train, 0.99)

      class AE(nn.Module):
          def __init__(self, d=49, h=24, b=8):
              super().__init__()
              self.enc = nn.Sequential(nn.Linear(d,h), nn.ReLU(), nn.Linear(h,b))
              self.dec = nn.Sequential(nn.Linear(b,h), nn.ReLU(), nn.Linear(h,d))
          def forward(self, x): return self.dec(self.enc(x))
      # train AE ~200 epochs Adam lr=1e-3 on standardised X_tr
      # ae_p99 = 99th percentile of MSE on X_tr after training

      def gate(cf_row):
          m = mahalanobis(cf_row, mu, cov_inv)
          if m > maha_p99: return False
          with torch.no_grad():
              mse = ((ae(torch.tensor(cf_row, dtype=torch.float32))
                      - torch.tensor(cf_row, dtype=torch.float32))**2).mean().item()
          return mse <= ae_p99
    test_case_impact:
      hard7_recall: none
      hard_fp_avoidance: medium
      easy59_regression_risk: low

