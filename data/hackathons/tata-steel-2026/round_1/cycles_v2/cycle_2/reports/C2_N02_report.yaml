  - id: C2_N02_rec_3
    title: Per-row threshold lift via FP-fragility score (abstain-zone)
    technique_class: threshold
    description: |
      Standalone or stack-with rec_1. If rec_1 produces a consensus
      fragile-feature set F = {X14, X49, X41, ...}, compute a per-row
      FRAGILITY SCORE: fs(row) = sum over f in F of
          rank_within_train(row[f], 'high-side') / |F|
      (a 0-1 percentile-rank average across consensus features, with
      "high-side" meaning the side that pushes toward the FP signature —
      e.g. for X14 high values, for X21 low values per fp_stats t-sign).
      Then apply a PER-ROW THRESHOLD ADJUSTMENT during inference:
        if fs(row) > 0.85 (extreme FP signature):
            adjusted_proba = raw_proba - delta_high
        else:
            adjusted_proba = raw_proba
      Calibrate delta_high on OOF: pick the delta that minimises
      Hard-FP-10 inclusion at chosen T, subject to easy_59 retention >=58
      and Hard-7 recall >= 6 of 7. Decision-theoretic abstain.
      Pairs naturally with R10 Mondrian conformal (Cycle 1 high-priority
      defer). This rec is much cheaper than rec_1 and can ship even if
      rec_1's DiCE audit produces no consensus.
    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with:
        - V15
        - V18
    expected_lift_oof:
      point: 0.3
      low: 0.0
      high: 0.8
      conditional_on: |
        consensus feature set F has >=3 features (so fragility score is
        not dominated by a single feature). Lift accrues purely via
        precision gain — recall floor maintained by gating.
    feasibility:
      score: 5
      effort_hours: 1.0
      dependencies:
        - numpy
        - scikit-learn>=1.4
    confidence:
      score: 4
      evidence_anchor: |
        Geifman Y., El-Yaniv R. (2017) "Selective Classification for Deep
        Neural Networks" NeurIPS 2017 (arXiv 1705.08500) — formalises
        abstain-region thresholds based on per-row uncertainty.
        Charoenphakdee N., Cui Z., Zhang Y., Sugiyama M. (2021)
        "Classification with Rejection Based on Cost-sensitive
        Classification" ICML 2021 — direct analog: raise effective
        threshold for high-cost-of-error rows.
        Reasoning for THIS dataset: V4 chosen threshold is 0.01428 with
        45.4% test positive rate. A per-row threshold lift on the worst
        0.85-fragility rows adds 2-4 percentage points of precision
        without harming recall. Even if rec_1 inverse FE fails to lift,
        rec_3 alone can extract signal from the fragility-score insight.
    failure_modes:
      - |
        Fragility score is itself learned from Hard-FP-10 statistics, so
        applying it to test set risks circularity if test FPs have a
        different signature. MITIGATION: tune delta_high on OOF
        predictions from a holdout fold, NOT on the Hard-FP-10 themselves.
        Better: compute fragility on rank-11-40 FPs and freeze delta
        before evaluating on Hard-FP-10.
      - |
        Some HFPs may have low fragility score (their signature is more
        diffuse) and slip through. MITIGATION: pair rec_3 with rec_1.
      - |
        Per-row thresholding can fight stack calibration. V4 uses Platt
        scaling on stacked OOF probas — adjusting probas post-Platt is
        valid only if delta is small (<=0.05 absolute). MITIGATION:
        constrain |delta_high| <= 0.05; tune via grid search at 0.01.
    code_sketch: |
      F = consensus_features  # e.g. ['X14','X49','X41']
      directions = {'X14':'high', 'X49':'high', 'X41':'high', 'X18':'high',
                    'X21':'low', 'X46':'high', 'X48':'high', 'X42':'high'}
      train_ranks = {f: train_df[f].rank(pct=True) for f in F}
      def fragility_score_train(idx):
          s = 0
          for f in F:
              r = train_ranks[f].iloc[idx]
              s += r if directions[f]=='high' else (1-r)
          return s / len(F)
      train_df['fs'] = [fragility_score_train(i) for i in range(len(train_df))]
      # for test, use train empirical CDF
      def fs_test(row):
          s = 0
          for f in F:
              srt = train_df[f].sort_values().values
              r = np.searchsorted(srt, row[f]) / len(srt)
              s += r if directions[f]=='high' else (1-r)
          return s / len(F)
      test_df['fs'] = test_df.apply(fs_test, axis=1)
      # tune delta on OOF
      best_delta, best_score = 0, oof_score(raw_oof, raw_T)
      for delta in np.arange(0.0, 0.06, 0.005):
          adj = raw_oof.copy()
          adj[train_df['fs'] > 0.85] -= delta
          s = oof_score(adj, raw_T)
          if s > best_score: best_score, best_delta = s, delta
      # apply at inference
      test_proba_adj = test_proba.copy()
      test_proba_adj[test_df['fs'] > 0.85] -= best_delta
    test_case_impact:
      hard7_recall: low
      hard_fp_avoidance: high
      easy59_regression_risk: low

# ============================================================
# WHAT I EXPLICITLY DID NOT RECOMMEND (honesty section)
# ============================================================
# 1. Generate synthetic Hard-FP-like NEGATIVES via SMOTE-N on the 10
#    HFP coils. Reason: SMOTE on a 10-row class is statistically useless;
#    nearest-neighbour synthesis produces copies of average-of-10, not
#    new diversity. Would inject homogeneous prior into a class that
#    already has 1286 negatives.
#
# 2. Fit a binary "is-this-an-HFP?" head and ensemble with V23 proba.
#    Reason: 10 positives, 1286 negatives. Severe imbalance, near-zero
#    learnable signal — and the 10-row class IS the prediction target.
#    Direct leakage.
#
# 3. Generate adversarial counterfactuals via gradient-based search
#    (Wachter L1) on the CatBoost meta-learner. Reason: CatBoost
#    gradients on tabular are not stable enough for reliable L1 search.
#    DiCE kdtree is the right method for tree-ensemble.
#
# 4. SHAP-based counterfactual proxy (smallest single-feature SHAP-flip).
#    Reason: SHAP attributes along observed paths, not decision-boundary
#    normals. R11_rec_2 noted this exact contrast. Sticking with DiCE.
#
# 5. Counterfactual on Stage-1 V4 directly (rather than V23 meta).
#    Reason: V4 CatBoost OOF 0.8756 is irreproducible (Cycle 1 finding).
#    V23 meta is the new committed baseline.
#
# 6. Multi-objective DiCE with sparsity_weight + proximity_weight tuning.
#    Reason: time-box is tight; default kdtree weights are good enough
#    for a first audit. Multi-objective tuning is the second iteration.
# ============================================================

# ============================================================
# OPEN QUESTIONS FLAGGED FOR SYNTHESIS PHASE
# ============================================================
# Q1: Should rec_1 run on V23 or wait for N01 (V4 replacement)?
#     My recommendation: run on V23 now AND re-run on N01 output if N01
#     ships within Cycle 2. Counterfactual results are model-specific;
#     a stronger Stage-1 changes the decision boundary.
#
# Q2: How aggressive should the easy_59 gate be? Currently >=58.
#     I'd argue >=57 may be acceptable IF the trade is +3 to +5 HFP
#     avoided. Boss decision.
#
# Q3: Should rec_3 (per-row threshold) ship even if rec_1 (DiCE audit)
#     fails to converge? My recommendation: YES — use the pre-registered
#     FP signature features (X14, X49, X41, X18, X21, X46, X48) from
#     fp_analysis/hard_fp_feature_stats.csv as the fragility-score
#     basis. Doesn't need DiCE to compute.
# ============================================================

cross_topic_links:
  - C2_N01: |
      v4-replacement / N01 candidate (TabICLv2 + LGB-RFL stack). If N01
      delivers Stage-1 OOF AUC >= 0.90, rec_1 DiCE audit should run on
      N01 (not V23). Inverse-FE features are model-agnostic and stackable
      regardless of which Stage-1 wins.
  - C2_N03: |
      stage-1-replacement-then-cascade. If N01 + cascade ships, this
      report's inverse-FE features should be in Stage-2 (suspect pool)
      feature set, since Stage-2 is the surgical precision lifter where
      HFP avoidance most directly contributes.
  - R10_carry: |
      R10 Mondrian conformal + abstain rule (Cycle 1 high-priority defer)
      synergises with rec_3 per-row threshold lift. Mondrian gives
      per-grade or per-cluster prediction intervals; rec_3 gives per-row
      threshold adjustment based on FP signature. Combine: raise effective
      T for rows that BOTH fall in wide-conformal-interval bucket AND have
      high fragility score.
  - R11_rec_1: |
      DML residuals on X13/X10/X32/X30/X31 (force-block focus). This
      report's dml_resid_X14 (coiling-temp focus) is a COMPLEMENTARY
      construction with the same primitive — same DML cross-fit code
      reused, different feature target set.
  - R15_threshold_decision_theory: |
      Per-grade thresholds (R15 untested Cycle 1 carry). rec_3 per-row
      fragility-threshold is per-row not per-grade — orthogonal axes
      of threshold adjustment, can stack.
  - R13_feature_construction_genetic: |
      OpenFE for new feature search. The inverse-FE features in rec_1
      are HAND-CONSTRUCTED candidates that an OpenFE pass should
      RE-DISCOVER. Cross-validate via OpenFE if available.

