# STATISTICAL DISCIPLINE NOTES (per Statistician spec)
# ============================================================
#
# Pre-registered design rules for the BUILD phase:
#
# 1. METRICS (pre-registered):
#    - Primary: OOF (R+P)/2 score gain vs V23 baseline (54.41)
#    - Secondary: HFP-10 avoidance count (target >=3 per Set B relaxed gate)
#    - Guardrail 1: easy_59 recall >= 58/59
#    - Guardrail 2: hard_7 recall >= 6/7 at chosen T
#    - Guardrail 3: bootstrap CI lower bound >= 53.0
#
# 2. SAMPLE-SIZE / FALSE-DISCOVERY DISCIPLINE:
#    n=10 HFPs is small. Consensus-fragile feature requires:
#      (a) appears in top-2 share of CF L1 distance in >=5 of 10 HFPs
#      (b) confirmed in >=15 of 30 next-hardest FPs (rank 11-40)
#    Binomial test under H0 p=0.3: P(>=15 of 30) = 0.04, defensible.
#    BH-FDR at q=0.10 across 49 features for any exploratory finding.
#
# 3. PEEKING DISCIPLINE:
#    DiCE audit run ONCE on V23 (or N01) frozen meta-learner. No
#    iterative re-running with adjusted thresholds. Pre-register the
#    expected consensus features (X14, X49, X41, X18, X46, X48) BEFORE
#    running. Only report whether each was confirmed or refuted.
#
# 4. SHIP / NO-SHIP DECISION RULE (pre-registered):
#    SHIP rec_1 IF:
#      OOF score gain >= +0.15 AND
#      easy_59 retention >= 58 AND
#      hard_7 retention >= 6 AND
#      HFP-10 avoidance >= 3 AND
#      bootstrap CI lower >= 53.0
#    NO-SHIP if any guardrail fails.
#    ITERATE (run rec_3 alone, drop rec_1) if HFP avoidance < 3 but
#    other guards pass — rec_3 is cheaper and may still ship.
#
# 5. TOP-3 INVALIDATING ASSUMPTIONS:
#    (a) Consensus pattern is statistically real (not n=10 noise).
#        DETECT via rank-11-40 confirmation.
#    (b) DiCE counterfactuals are on-manifold (not algorithmic artifact).
#        DETECT via rec_2 Mahalanobis + autoencoder gate.
#    (c) X14 is causally informative (not just a confounder proxy for
#        unobserved equipment regime). DETECT via R11_rec_3
#        GroupKFold(X11) SHAP stability probe — if X14 SHAP collapses
#        >50% under group folding, X14 is grade-confounded and the
#        residual is doing causal work (confirms approach).
#
# 6. MULTIPLE-COMPARISON CORRECTION:
#    Pre-registered consensus test on 6 features (no correction needed).
#    Exploratory tests on remaining 43 features: BH-FDR q=0.10.
#
# 7. SAMPLE RATIO MISMATCH (SRM) CHECK:
#    Not applicable (offline batch eval, no traffic randomisation).
#    Equivalent: train/test prevalence shift IS confirmed (test 6.49% vs
#    train 4.88%, R09 BBSE finding). Accounted via +2.67 OOF-to-LB
#    calibration delta.
