      # BUILD-phase pseudocode (~50 lines)
      import dice_ml, lightgbm as lgb, numpy as np, pandas as pd
      from sklearn.model_selection import KFold
      from sklearn.ensemble import IsolationForest

      HARD_FP10 = [689, 642, 247, 189, 279, 757, 188, 651, 467, 690]
      # 30 next-hardest FPs for sample-size confirmation
      RANK_11_40_FPS = train_df[(train_df.Y==0)] \
          .assign(p=v23_oof_proba[train_df.Y==0]) \
          .nlargest(40, 'p').index[10:40].tolist()

      # 1. DiCE audit
      d = dice_ml.Data(dataframe=train_df,
                       continuous_features=numeric_cols,
                       categorical_features=['X11','X39','X40'],
                       outcome_name='Y')
      m = dice_ml.Model(model=v23_meta, backend='sklearn')
      exp = dice_ml.Dice(d, m, method='kdtree')

      def collect_cf_distances(coil_ids):
          frag = {f: [] for f in feat_cols}
          for cid in coil_ids:
              q = train_df.loc[[cid], feat_cols]
              try:
                  cf = exp.generate_counterfactuals(q, total_CFs=5,
                                                   desired_class=0)
                  for _, r in cf.cf_examples_list[0].final_cfs_df.iterrows():
                      d_abs = (r[feat_cols] - q.iloc[0][feat_cols]).abs()
                      d_norm = d_abs / train_df[feat_cols].std()
                      d_share = d_norm / d_norm.sum()
                      for f in d_share[d_share >= 0.25].index:
                          frag[f].append(d_share[f])
              except Exception:
                  pass  # kdtree fails on deeply-embedded points
          return {f: (len(v)/len(coil_ids), np.mean(v) if v else 0)
                  for f, v in frag.items()}

      consensus_hfp10 = collect_cf_distances(HARD_FP10)
      consensus_rank1140 = collect_cf_distances(RANK_11_40_FPS)
      # Confirm: feature is consensus iff freq >= 0.5 in BOTH groups
      consensus_features = [f for f in feat_cols
                            if consensus_hfp10[f][0] >= 0.5
                            and consensus_rank1140[f][0] >= 0.5]
      assert 'X14' in consensus_features  # pre-registered prediction

      # 2. Engineer inverse features for each consensus feature
      def add_inverse_fe(df_train, df_test, feat):
          # f1: DML residual on grade + wear + upstream temps
          Z = ['X11','X39','X40','X35','X4','X5','X6']
          kf = KFold(5, shuffle=True, random_state=42)
          resid = np.zeros(len(df_train))
          for tr, va in kf.split(df_train):
              r = lgb.LGBMRegressor(n_estimators=200, max_depth=4,
                                    learning_rate=0.05, verbose=-1)
              r.fit(df_train.loc[tr, Z], df_train.loc[tr, feat],
                    categorical_feature=['X11','X39','X40'])
              resid[va] = (df_train.loc[va, feat].values
                           - r.predict(df_train.loc[va, Z]))
          df_train['dml_resid_' + feat] = resid
          r_full = lgb.LGBMRegressor(n_estimators=200, max_depth=4,
                                     learning_rate=0.05, verbose=-1)
          r_full.fit(df_train[Z], df_train[feat],
                     categorical_feature=['X11','X39','X40'])
          df_test['dml_resid_' + feat] = (df_test[feat]
                                           - r_full.predict(df_test[Z]))
          # f2: grade-conditioned p75 excess (hinge)
          p75_by_grade = df_train.groupby('X11')[feat].quantile(0.75)
          df_train[feat + '_grade_p75_excess'] = np.maximum(0,
              df_train[feat] - df_train['X11'].map(p75_by_grade))
          df_test[feat + '_grade_p75_excess'] = np.maximum(0,
              df_test[feat] - df_test['X11'].map(p75_by_grade))
          # f3: isolation-forest residual on coiling-block context
          iso = IsolationForest(n_estimators=200, contamination=0.05,
                                random_state=42)
          iso.fit(df_train[['X4','X5','X6']])
          df_train[feat + '_iso_resid'] = iso.score_samples(
              df_train[['X4','X5','X6']]) * df_train[feat]
          df_test[feat + '_iso_resid'] = iso.score_samples(
              df_test[['X4','X5','X6']]) * df_test[feat]

      for f in consensus_features:
          add_inverse_fe(train_df, test_df, f)
      # f4 special: X14-X18 consistency (pre-registered, not consensus-derived)
      train_df['X14_minus_X18'] = train_df['X14'] - train_df['X18']
      test_df['X14_minus_X18'] = test_df['X14'] - test_df['X18']

      # 3. Refit V23 with appended features; SHAP-30 selector decides
      # 4. Gate: easy_59 retention >= 58 BEFORE accepting
