  can_0_72_to_0_82_be_achieved: |
    Unlikely from feature engineering alone without NEW Stage-1.
    The fundamental obstacle: Hard-FP-10 are MORE extreme than TPs on
    every subtle feature (rec_2 hypothesis may be violated). If Hard-FPs
    are also anomalous on subtle dims (which their elevated X14/X49 values
    suggest), no Stage-2 feature can cleanly separate them — the model
    sees "very high temperature-proxy row" = positive, but hard FPs ARE
    very high. Resolution requires either: (a) chemistry data (falsified
    via X43), or (b) a feature that captures "extreme on Stage-1 features
    but expected given grade/thickness" i.e. a residual that R07/R10 address
    architecturally. RECOMMENDATION: bundle rec_1 + rec_2 + rec_3 (~2.5h
    total), target AUC 0.75-0.77. Accept that 0.82 requires N01/N03
    new Stage-1.

  priority_order:
    1: "rec_1 + rec_3 bundle (45 min, near-zero regression risk)"
    2: "rec_2 subtle anomaly score (1.5h, highest leverage for Set B)"
    3: "rec_4 HDBSCAN (2h, high variance, try if 1+2 insufficient)"
    4: "rec_5 density (1.5h, lowest confidence, V25 precedent is bad)"

