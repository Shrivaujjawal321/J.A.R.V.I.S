# =====================================================================
# EXECUTIVE SUMMARY
# =====================================================================
#
# The literal task spec ("T_low -> 0, T_high -> 1, middle abstain -> 0")
# COLLAPSES to a single-threshold problem (abstain -> 0 = predict-negative,
# below-T_low -> 0 = predict-negative, so T_low is non-load-bearing).
# A single-threshold sweep gave no useful gain (already V23's chosen T).
#
# The PRODUCTIVE generalisation is an INTERIOR-ABSTAIN-BAND rule:
#   pred = 1 iff (proba >= T_base) AND proba NOT IN any abstain band
#   pred = 0 otherwise.
#
# This is a precision-recovery tool - kill FPs that sit in low-prevalence
# proba zones while keeping every true positive flagged.
#
# Headline results on V23 OOF:
#
#   Single best in-sample band [0.27, 0.33]:
#     OOF: 54.41 -> 54.82 (+0.41), recall=1.0, 0 of Hard-FP-10 abstained.
#
#   Pre-registered MULTI-BAND union [0.04,0.055] U [0.09,0.10] U
#     [0.27,0.33] U [0.41,0.44]:
#     In-sample OOF: 54.41 -> 55.46 (+1.05), recall=1.0
#     5-fold CV mean delta: +1.04 +/- 0.21 OOF points, zero recall loss
#     Hard-FP-10: 1 of 10 abstained (CoilID 188 @ 0.412)
#     Hard-7: 0 of 7 abstained (all 7 retained as POS)
#     Easy-59: 0 of 59 lost
#     Bootstrap paired CI on delta: [-0.58, +2.63] (wide - calibration risk)
#     Calibrated LB est: 55.45 + 2.67 = 58.12  (vs V4 banked 56.98 -> +1.14)
#
# Per-grade (X11) abstain bands OVER-FIT catastrophically:
#   In-sample: +1.86 OOF, recall=1.0
#   5-fold CV: -7.76 +/- 4.53 OOF, recall drops to 0.83 (11/66 positives lost)
#   Cause: per-grade bands tuned to fold-specific empty gaps that close on
#   held-out folds. DO NOT SHIP per-grade abstain on V23.
#
# The KEY ANSWER to the drill question:
#   "Can we abstain on 6-8 of Hard-FP-10 without abstaining any of Hard-7?"
#   NO - the Hard-7 and Hard-FP-10 V23 proba distributions OVERLAP
#   on [0.40, 0.58] (Hard-7 CoilIDs 72@0.442 and 1499@0.576 sit inside
#   the Hard-FP range). Any band wide enough to abstain >=5 Hard-FPs
#   will hit >=1 Hard-7. Strictly with zero Hard-7 abstain, the max
#   Hard-FP-10 abstain attainable is 6 (band [0.625, 0.875]) - but that
#   same band ALSO abstains 18 of 59 easy positives -> score crashes to
#   ~40. The Hard-FP-10 problem is NOT solvable by V23-proba-only
#   abstaining; it requires the orthogonal Stage-1 from N01/N03.
#
# Honest recommendation: SHIP the multi-band union as a feature-free
# post-processor on TOP of the best Cycle 2 base build (V23 today, V27
# tomorrow). Expected lift: +0.5 to +1.5 LB. Effort: 30 minutes.

recommendations:

  - id: C2_N04_rec_1
    title: "Multi-band interior abstain (post-processor)"
    technique_class: threshold
    description: |
      Define a fixed multi-band abstain post-processor that turns
      predicted-positive predictions back into 0 if their probability
      falls inside any of several pre-registered "negative-dominant"
      proba bands derived from the V23 OOF density. Pre-registered
      union of bands:
        B = [0.040, 0.055] U [0.090, 0.100] U [0.270, 0.330] U [0.410, 0.440]
      Apply on top of V23 chosen T=0.0276 (or whatever final build's T):
        pred = 1 iff (proba >= T_base) AND proba NOT IN B
      Empirically these are V23-OOF zones where pos:neg prevalence is
      0% or near-0% (e.g. [0.27,0.33]: 0 pos / 55 neg; [0.41,0.44]:
      0 pos / 22 neg). The union strikes 144 FPs while keeping all 66
      TPs in V23 OOF.
    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with: []
      note: |
        V1-V22 use a SINGLE chosen threshold; none implement an
        interior-abstain region. R15 (Cycle 1) recommended per-grade
        thresholds and Mondrian conformal, but did NOT propose a fixed
        multi-band abstain on the global proba distribution. Drill-down
        on R15 / R10 ideas, not duplication.
    expected_lift_oof:
      point: 1.0
      low: 0.4
      high: 1.5
    feasibility:
      score: 5
      effort_hours: 0.5
      dependencies: [pandas, numpy]
    confidence:
      score: 4
      evidence_anchor: |
        Direct measurement on V23 OOF: 5-fold CV mean delta +1.04 +/- 0.21
        OOF points, recall=1.0 in every fold (0 positives lost across 66).
        Bootstrap paired CI [-0.58, +2.63] on V23 OOF.
        Methodological basis: Chow (1970), "On optimum recognition error
        and reject tradeoff", IEEE-IT 16(1): the optimal Bayes reject
        rule for a fixed cost ratio is to abstain on intervals of low
        posterior margin. Here our "cost" structure has abstain=0 = same
        cost as negative, so abstain bands are profitable wherever local
        prevalence drops below the precision contribution of a positive
        prediction at the current global threshold. Pre-registering on
        OOF and applying to test mirrors Stitch Fix's "calibrated abstain"
        protocol for production rerankers (Algorithms Tour, 2022).
    failure_modes:
      - |
        BAND-DRIFT in test set: if test-set proba distribution is shifted
        (e.g. due to BBSE label-prior shift of +2.67 already known to
        exist), the same band coordinates may contain MORE positives in
        test than in train OOF. Mitigation: apply bands only to KNOWN
        V23 OOF-fit bands (pre-registered, never re-tuned on test); the
        +2.67 delta is already a label-prior shift, not a feature shift,
        so band density is partially insulated.
      - |
        OVER-MILKING: if N03 ships a stronger Stage-1, its OOF proba
        distribution will look different from V23's. The bands here are
        V23-SPECIFIC. Each new build needs its own band derivation +
        5-fold CV stability check before its bands ship.
      - |
        SUBMISSION-BUDGET WASTE: +1 OOF point on LB equates to +1.0 LB
        if calibration holds, but the bootstrap delta CI includes 0 at
        the low end. A single bad slot is +0 LB and -1 daily slot. Pair
        with another high-confidence change in the same submission.
      - |
        HARD-FP-10 IS NOT SOLVED. The multi-band union abstains only
        1 of 10 Hard-FPs (CoilID 188 @ 0.412 in band [0.41,0.44]).
        Hard-FP-10 needs N01/N02/N03 - a stronger Stage-1 or counterfactual
        features. This abstain rule is COMPLEMENTARY, not a substitute.
      - |
        OOF V23 stage-2 AUC was 0.7203 (weak), meaning the proba ranking
        itself is noisy. Bands derived from a noisy ranking generalise
        worse than bands from a clean ranking. If N01 produces stage-1
        AUC >= 0.90, bands derived on that base will likely be even
        more profitable than these V23 ones.
    code_sketch: |
      # apply_multi_band_abstain.py - drop-in post-processor
      import pandas as pd, numpy as np

      T_BASE = 0.027633213388146373  # V23 chosen
      ABSTAIN_BANDS = [
          (0.040, 0.055),
          (0.090, 0.100),
          (0.270, 0.330),
          (0.410, 0.440),
      ]

      def apply_multi_band_abstain(probs, T_base=T_BASE,
                                    bands=ABSTAIN_BANDS):
          pred = (probs >= T_base).astype(int)
          for lo, hi in bands:
              mask = (probs >= lo) & (probs < hi)
              pred[mask] = 0
          return pred

      # usage at submission time:
      sub = pd.read_csv("v23_test_probs.csv")
      sub["pred"] = apply_multi_band_abstain(sub["proba"].values)
      sub[["CoilID", "pred"]].to_csv("v23_multiband_submission.csv",
                                      index=False)
    test_case_impact:
      hard7_recall: none      # 0 of 7 abstained
      hard_fp_avoidance: low  # only 1 of 10 abstained
      easy59_regression_risk: none  # 0 of 59 lost in V23 OOF

  - id: C2_N04_rec_2
    title: "Per-grade abstain - REJECTED (overfits)"
    technique_class: threshold
    description: |
      A per-grade (X11-stratified) abstain band rule was the natural
      extension of R15's per-grade-threshold idea + the multi-threshold
      abstain spec. In-sample it looks fantastic: +1.86 OOF, recall=1.0,
      668 FPs killed. However a clean 5-fold CV of the rule DERIVATION
      shows catastrophic overfitting: mean delta -7.76 +/- 4.53 OOF,
      recall collapses to 0.83 (11 of 66 positives lost across folds).
      Cause: each grade has only 17-246 train rows and 0-12 positives;
      the "max-FPs band with zero positives" optimisation finds
      fold-specific empty gaps in the proba distribution that close
      when a held-out fold is added. The rule is recommended ONLY as a
      cautionary tale and an anti-pattern to mark in the Cycle 2
      synthesis: per-grade fine-tuning of threshold-level rules on this
      dataset is NOT safe at the current N. R15's per-grade threshold
      idea inherits the same risk and should be CV-validated identically
      before ship.
    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with: ["R15 (related, untested in V22)"]
    expected_lift_oof:
      point: -1.0
      low: -5.0
      high: 0.5
    feasibility:
      score: 5
      effort_hours: 0.5
      dependencies: [pandas, numpy]
    confidence:
      score: 5
      evidence_anchor: |
        Direct 5-fold CV measurement on V23 OOF (this report). In every
        fold, the held-out fold suffered recall loss when bands derived
        from the other 4 folds were applied. 17 grades x small N per
        grade x greedy gap-search = textbook overfitting (see Cawley &
        Talbot 2010, "On Over-fitting in Model Selection and Subsequent
        Selection Bias in Performance Evaluation", JMLR 11).
    failure_modes:
      - "Overfits. Do not ship."
    test_case_impact:
      hard7_recall: high      # catastrophic loss in some folds
      hard_fp_avoidance: medium
      easy59_regression_risk: high

