closing_line: |
  Pre-registered multi-band abstain post-processor on V23 OOF.
  Sample size: 1352 OOF rows + 339 test rows (fixed).
  Run-time: 30 minutes (post-processor on existing V23 build artifacts).
  Top risks: calibration drift in test bands (medium), Hard-FP-10
  unsolved (high - needs N01/N02/N03), per-grade variant overfits
  (do not ship). Statistical review of any post-launch band
  modification required. CV mean lift +1.04 +/- 0.21 OOF ->
  calibrated LB estimate 58.12 vs V4 banked 56.98.
