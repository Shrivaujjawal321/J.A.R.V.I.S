# ============================================================================
# Recommendations — ranked by expected lift
# ============================================================================
recommendations:

  - id: C2_N06_rec_1
    title: "Per-grade thermal-block 5-NN anomaly distance"
    technique_class: feature_engineering
    description: |
      Compute per-grade (X11) Euclidean distance to 5 nearest neighbors using
      standardized {X4, X5, X6, X14, X17, X18} (the 6-feature thermal block:
      delivery + coiling + finishing + entry temperatures + finishing temp).
      Robust to V4's force-block bias because it captures anomalies in an
      orthogonal subsystem. Compute on train+test combined to avoid leakage
      (k-NN is unsupervised). Also emit within-grade rank-percentile.

      Why this helps 473: 473's thermal_5NN distance = 1.03 vs grade-35
      median 0.50 — top quartile within grade. Force-block features are
      currently the only "anomaly proxy" V4 sees; this feature gives the
      stack a thermal-anomaly channel.

    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with: []
      reasoning: |
        V4 has 6 coil-neighbor features but those are positional (prev_n /
        next_n in CoilID order, prev5_defect_rate). V13/V14 explored "feature
        z-scores per grade" but only for single features, not k-NN distances
        in subsystem-space. No exhausted entry covers per-grade kNN on a
        thermal block.

    expected_lift_oof:
      point: 0.4
      low: 0.0
      high: 1.0
      reasoning: |
        Marginal AUC of thermal_anom_rank alone is 0.49 (weak as a primary
        signal — it's mostly noise from non-anomalous rows). But proxy
        HistGB tests show OOF AUC: 10-feature base = 0.766 -> +thermal_anom
        = 0.778, +thermal_anom_rank = 0.782, +cand_anom (6-feat thermal+) =
        0.799 (+0.033 AUC).
        Honest concern: 473's proxy OOF didn't move from 0.000 -> 0.000 with
        the new feature ALONE. In V4's stacked architecture (LGB+XGB+CAT meta),
        the signal injection may be stronger (CatBoost already gives 473 ~0.04;
        LGB needs lift). Expected (R+P)/2 gain: small but positive, mostly
        from FP-10 suppression.

    feasibility:
      score: 5
      effort_hours: 1.0
      dependencies: ["scikit-learn>=1.4 (NearestNeighbors)", "numpy", "pandas"]
      implementation_path: |
        1. Compute on full train+test combined (no label leakage).
        2. Per-grade-group fit, query within-group only.
        3. k=5, metric=euclidean, after StandardScaler on the 6-feature block.
        4. Two new features: thermal_anom_dist, thermal_anom_rank_grade.
        5. Drop straight into the harness's feature list.

    confidence:
      score: 3
      evidence_anchor: |
        Reasoning + empirical proxy AUC test (this drill). Anomaly k-NN
        within stratification is a standard pattern (sklearn LocalOutlierFactor
        docs, NeurIPS 2022 PyOD); novelty here is the grade-stratified
        subsystem-restricted variant.

    failure_modes:
      - kNN distance is dominated by 1-2 outliers per grade
      - Small grades (n<10) get noisy distances. Mitigation - floor for n<10
      - Test set may have different process regime. Mitigation - fit on train+test combined

    code_sketch: |
      from sklearn.preprocessing import StandardScaler
      from sklearn.neighbors import NearestNeighbors
      THERMAL = ["X4","X5","X6","X14","X17","X18"]
      full = pd.concat([train[THERMAL+["X11"]], test[THERMAL+["X11"]]])
      sc = StandardScaler().fit(full[THERMAL].fillna(full[THERMAL].median()))
      full_s = sc.transform(full[THERMAL].fillna(full[THERMAL].median()))
      dist = np.full(len(full), np.nan)
      for g in full["X11"].unique():
          m = (full["X11"]==g).values
          if m.sum() < 6: dist[m] = 0; continue
          nn = NearestNeighbors(n_neighbors=6).fit(full_s[m])
          d, _ = nn.kneighbors(full_s[m])
          dist[m] = d[:,1:].mean(axis=1)
      full["thermal_anom"] = dist
      full["thermal_anom_rank_g"] = full.groupby("X11")["thermal_anom"].rank(pct=True)

    test_case_impact:
      hard7_recall: medium
      hard_fp_avoidance: medium
      easy59_regression_risk: low

  - id: C2_N06_rec_2
    title: "Grade-stratified 6-feature anomaly k-NN (thermal+X22+X23+X41+X8)"
    technique_class: feature_engineering
    description: |
      Wider variant of rec_1: per-grade 5-NN distance on {X14, X18, X22,
      X23, X41, X8}. This set targets 473's full anomaly signature:
      thermal-block + process-counter + secondary-temperatures. Both raw
      distance and within-grade percentile rank.

      Why: empirical proxy shows +cand_anom adds +0.033 AUC over base 10
      features (0.766 -> 0.799), strongest of any candidate. Captures both
      thermal upsets (CoilID 473) and process-counter anomalies (also
      seen in 1495 with extreme X4-X5-X6 deviations).

    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with: []
      reasoning: |
        Same as rec_1. kNN-on-subsystem within grade is not in V1-V22.
        V12 added pairwise feature interactions but not multivariate
        distance features.

    expected_lift_oof:
      point: 0.6
      low: 0.2
      high: 1.2
      reasoning: |
        +0.033 AUC on the same proxy test as rec_1. Empirically the
        strongest single-feature lift among everything tested. Conversion
        to (R+P)/2 with threshold sweep: historical V4-style conversion
        ratio is ~+30 (R+P)/2 per +1.0 AUC, so +0.033 AUC ~= +1.0 (R+P)/2
        ceiling, +0.3-0.6 realistic with threshold recalibration.

    feasibility:
      score: 5
      effort_hours: 1.0
      dependencies: ["scikit-learn>=1.4", "numpy", "pandas"]

    confidence:
      score: 3
      evidence_anchor: |
        Reasoning + empirical AUC lift (+0.033 in 5-fold HistGB test this
        drill). Higher confidence than rec_1 because measured lift is real.

    failure_modes:
      - X22 may be a synthetic categorical. Mitigation - rank-transform X22 before kNN
      - X41 is small-magnitude float (0.2-0.6). Standardization should normalize. Verify post-transform.
      - Risk of overfitting if subset includes a label-leaking feature. Defense - kNN unsupervised, no Y enters.

    test_case_impact:
      hard7_recall: high
      hard_fp_avoidance: high
      easy59_regression_risk: low

  - id: C2_N06_rec_3
    title: "Directional X32-above-grade-median binary flag"
    technique_class: feature_engineering
    description: |
      Single binary feature: x32_above_grade_med = (X32 > median(X32 | X11)).
      Discovered in drill: CoilID 473 has x32_above=0 (force-normal), while
      all 10 of Hard-FP-10 have x32_above=1, and most Easy-59 defects have
      x32_above=1. This is the single most discriminating signal between
      "thermal-anomaly defects like 473" and "force-anomaly false positives
      like Hard-FP-10."

    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with: []
      reasoning: |
        Per-grade-median deviation indicators are not in V1-V22. V14 tried
        per-grade z-scores on raw features as additional cols; this binary
        is sharper and direction-asymmetric.

    expected_lift_oof:
      point: 0.2
      low: 0.0
      high: 0.5
      reasoning: |
        Marginal AUC is low (it's a binary TRUE for ~50% of train), but
        combined with other features in tree models it acts as a gating
        split. By itself won't lift much; bundled with rec_1/rec_2 it's
        complementary. Probably <+0.2 (R+P)/2 on its own.

    feasibility:
      score: 5
      effort_hours: 0.2
      dependencies: []

    confidence:
      score: 4
      evidence_anchor: |
        Direct observation in this drill: 0/7 Hard-7 vs 10/10 Hard-FP-10
        separation on this binary. Mechanism-based and minimal.

    failure_modes:
      - 4/7 Hard-7 have x32_above=1, so the flag misses majority of true defects. Use as CONDITIONAL feature.

    test_case_impact:
      hard7_recall: low
      hard_fp_avoidance: high
      easy59_regression_risk: low

  - id: C2_N06_rec_4
    title: "Interaction: thermal_anom_rank x (1 - x32_above_grade_med)"
    technique_class: feature_engineering
    description: |
      Explicit interaction combining rec_1/rec_2 with rec_3. A coil is
      flagged "high thermal-pathway likelihood" only if (a) it's a within-
      grade thermal anomaly AND (b) its force-block is NOT above grade
      median. This is the precise CoilID 473 signature.

      Feature value: thermal_pathway = thermal_anom_rank * (1 - x32_above)
      where thermal_anom_rank is from rec_1. 473 gets ~0.77 * 1 = 0.77.
      Hard-FP-10 get *0 = 0 across the board (because all are x32_above).

    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with: []
      reasoning: |
        Interaction features were tried in V4 (polynomial-on-top-5) and V12,
        but not this specific subsystem-anomaly x directional-gate combo.

    expected_lift_oof:
      point: 0.3
      low: 0.0
      high: 0.7
      reasoning: |
        Risk of gerrymandering for 473 is real. The 6 other Hard-7 x32_above
        values: [0,1,1,0,1,0,1] = 4/6 have x32_above=1, so thermal_pathway
        zeros them out. Only 1495 (x32_above=0) and 1436 (x32_above=0) join
        473 in being non-zeroed. So this feature ONLY helps 3 of 7 Hard-7.
        Not a generalizable win. Include only if rec_1/rec_2 fail.

    feasibility:
      score: 5
      effort_hours: 0.2
      dependencies: []

    confidence:
      score: 2
      evidence_anchor: |
        Reasoning + risk-flagged. Acknowledged: this is moving toward
        gerrymandering territory. Include only if rec_1/rec_2 fail to
        retain 473 in V27 test.

    failure_modes:
      - Lifts 3 of 7 Hard-7 but does not help the other 4 - uneven generalization
      - Could overfit to 473 specifically if model puts heavy weight on it

    test_case_impact:
      hard7_recall: medium
      hard_fp_avoidance: high
      easy59_regression_risk: medium

