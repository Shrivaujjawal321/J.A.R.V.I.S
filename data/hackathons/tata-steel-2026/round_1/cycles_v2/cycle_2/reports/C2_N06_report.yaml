# ============================================================================
# Counterfactual / on-manifold validation
# ============================================================================
on_manifold_check:
  question: "Does this feature have defensible physical interpretation, or is it gerrymandered?"
  answer: |
    Per-grade k-NN distance on thermal-block features = "how unusual is this
    coil's thermal profile compared to other coils of the same steel grade."
    Physically defensible: each grade has a target rolling schedule
    (coiling/finishing/Ar3 transition target temps). A coil that deviates
    from the per-grade thermal envelope is a process upset. This is a
    standard quality-control framing (X-bar / R-chart on multivariate
    thermal vector).

    No Y-leakage: kNN is unsupervised, fits train+test combined.
    No single-row gerrymander: 5/7 H7 score above grade-median, 5/10 FP-10
    score below grade-median.

# ============================================================================
# Failure-mode if rec_1/rec_2 underdeliver
# ============================================================================
fallback_plan: |
  If V27 build with rec_1+rec_2 still loses CoilID 473:
    1. Diagnose: does LGB OOF proba for 473 now exceed 0.005? (currently
       0.0025). If yes but stacker still under-weights, fix stacker weights.
    2. If LGB still ~0: 473's thermal anomaly is real but LGB lacks splits
       - try CatBoost-only stage-1 with monotonic constraints on X14/X18.
    3. Last resort: add rec_4 (the gated interaction) as a focused fix.
    4. If all 4 fail: 473 may be inherently unrecoverable without leak; bank
       the +0.10 OOF from V23 and accept losing 473.

