    the 7 hard positives are stealth in X1-X49 space (confirmed by exhausted AD methods).
    TabICLv2 inductive prior does not add new feature information; it offers a different
    function approximation over the same feature space. If hard-7 are noise-adjacent to Y=0,
    no foundation model rescues them without new features.

