research_summary: |
  Cycle 2 reframe: TabICLv2 as REPLACEMENT for the entire V4 3-model stack (LGB+XGB+CatBoost+LR meta),
  NOT a 4th augmentation member. This is necessary because V4 CatBoost OOF 0.8756 is irreproducible
  (fresh retrains hit 0.8622, confirmed Cycle 1 structural finding). V4 is a frozen black box.
  Stacking into it is unsafe. C1_R04_rec_1 was rejected for "architecture slot taken"; the situation
  has fundamentally changed -- the V4 slot IS the problem.

  Key Cycle 2 deep-dive findings:

  1. INFERENCE LATENCY (critical new data):
     mindfulmodeler.substack.com CPU benchmark: breast-cancer dataset (455 rows, 31 cols) on CPU
     M1 MacBook Air = approximately 15 seconds for TabICLv2 with n_estimators=8.
     Our fold: ~1082 train + ~270 val, 49 features.
     Proportional estimate: 15 * (1082/455) * (49/31) = approximately 56 seconds per fold.
     5 folds = approximately 4.7 minutes CPU wall time. FEASIBLE for a hackathon build.
     Halving n_estimators from 8 to 4 cuts to approximately 2.4 minutes total.
     RAM without KV cache (kv_cache=False, default): approximately 0.67 GB per fold (safe on 16GB laptop).
     With KV cache: 48.8 KB per cell on CPU. 1082*49=53018 cells = approximately 2.6 GB. Avoid KV cache.

  2. OOF AUC EXPECTED RANGE for 1082-row fold, 49 features, 4.88% imbalance:
     TabICLv2 zero-shot on TALENT/TabArena: approximately 80% win rate over tuned GBDTs (ICML 2026).
     On SMALL datasets (<2K rows), the ICL advantage is LARGER than on large datasets because tuned
     GBDTs overfit at n=1000 whereas ICL is intrinsically regularised (no gradient updates).
     V4 CatBoost standalone ceiling: approximately 0.8890 AUC. V4 meta (3-model stack): 0.884 AUC.
     Fresh-retrain ceiling: 0.8622 (Cycle 1 confirmed).
     TabICLv2 standalone OOF AUC honest range:
       LOW 0.840: if synthetic pretraining mismatches anonymized steel sensor features
       POINT 0.875: on-par with V4 individual models; ICL advantage at small n expected
       HIGH 0.910: if ICL inductive bias captures the sparse positive manifold better than trees

  3. CALIBRATION:
     TabICLv2 raw probabilities exhibit majority-class bias at pi1=0.0488.
     Option A: tau=pi1 threshold correction on OOF before meta-LR fitting.
     Option B (recommended): raw probas into meta-LR + downstream score-aware threshold sweep.
     Option B preferred because sweep directly optimises (R+P)/2 criterion.
     Do NOT apply isotonic recalibration on 1352 rows / 66 positives -- too few samples.

  4. CASCADE PAIRING:
     If TabICLv2 standalone OOF AUC >= 0.890 (confirmed by empirical run), use as Stage-1
     for V23-style cascade. C1_R08 Stage-2 design (subtle features X14/X49/X41/X46/X48 for
     Hard-FP-10 targeting) is still valid and pairs cleanly with a non-V4 Stage-1.

  5. EXACT PACKAGE AND CALL:
     pip install tabicl
     checkpoint auto-downloaded: tabicl-classifier-v2-20260212.ckpt
     TabICLClassifier(n_estimators=8, device=None, kv_cache=False, random_state=42)
     device=None: auto-selects CUDA if available, else CPU.

  6. FALLBACK --
     If TabICLv2 OOF AUC < 0.82 after fold 1: abort and use LGB-RFL standalone.
     LGB-RFL confirmed +0.0108 AUC over V4-LGB in Cycle 1. Standalone non-V4 LGB-RFL
     avoids the V4 frozen-black-box trap. V24 failure was caused by V4 stack contamination,
     not by RFL loss function itself.

recommendations:
  - id: C2_R04_rec_1
    title: TabICLv2 standalone Stage-1 vs V4
    technique_class: architecture
    description: |
      Abandon the V4 3-model stack entirely. Build a fresh Stage-1 using TabICLv2 (pip install
      tabicl, BSD 3-Clause, offline after first checkpoint download) as the SOLE base model,
      collecting 5-fold StratifiedKFold OOF probas, then applying score-aware threshold sweep
      identical to V4. This eliminates the V4 CatBoost irreproducibility at root. TabICLv2
      trained on 1082-row folds is well within its 300-48K pretraining range. Zero hyperparameter
      tuning required. sklearn-compatible interface. CPU wall time approximately 4.7 minutes
