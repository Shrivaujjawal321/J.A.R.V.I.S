  condition: tabicl_plus_lgb_rfl_meta_oof_auc >= 0.890
  stage1_source: rec_2 meta OOF probas (TabICLv2 + LGB-RFL)
  stage1_threshold_strategy: low_threshold_wide_net_then_stage2_prunes
  stage2_design: C1_R08 -- second LGB trained on suspect pool using subtle features X14/X49/X41/X46/X48
  stage2_goal: suppress Hard-FP-10 (CoilIDs 689,642,247,189,279,757,188,651,467,690)
  stage2_gate: ">=3 of 10 Hard-FP-10 below Stage-2 threshold (Cycle 2 relaxed gate)"
  expected_combined_oof_over_v23: +1.0 to +4.0 points
  note: |
    V23 cascade ceiling was +0.1 OOF because V4 Stage-1 was already near its feature-space
    limit. A fresh Stage-1 at AUC 0.890+ provides a higher-quality suspect pool, allowing
    Stage-2 to make more surgical Hard-FP-10 decisions. The cascade architecture itself is
    sound; the bottleneck was always V4.

