oof_auc_honest_analysis:
  v4_meta_oof_auc: 0.884
  v4_meta_irreproducible: true
  fresh_catboost_retrain_oof_auc: 0.8622
  lgb_rfl_component_auc_advantage: +0.0108
  tabicl_standalone_point_estimate: 0.875
  tabicl_standalone_range: [0.840, 0.910]
  tabicl_plus_lgb_rfl_meta_point_estimate: 0.890
