  - C2_N03: Stage-1 replacement automatically enables cascade; C1_R08 Stage-2 design is reusable.
  - C2_R08: What is minimum Stage-1 AUC for cascade to yield +1 OOF? That threshold determines whether TabICLv2 at 0.875 suffices or 0.890+ is needed to unlock cascade value.
  - C2_R07: Deep SAD / PReNet semi-sup -- if TabICLv2 ICL prior captures hard-7 better than trees, anomaly-detection approaches may stack cleanly on top to further suppress Hard-FP-10.
  - C2_R10: Mondrian conformal + abstain rule could be applied to TabICLv2 OOF for uncertainty-based filtering -- abstain on borderline uncertain FPs, keep recall at 100%.

