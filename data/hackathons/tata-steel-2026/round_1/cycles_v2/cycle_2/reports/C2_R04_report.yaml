calibration_note: |
  TabICLv2 raw probabilities exhibit majority-class bias at pi1=0.0488.
  Option A: tau=pi1=0.0488 threshold correction on OOF before meta-LR fitting.
  Option B (recommended): raw probas into meta-LR + downstream score-aware threshold sweep.
  Option B preferred: sweep directly optimises (R+P)/2 criterion which is our exact metric.
  Do NOT apply isotonic recalibration on 1352 rows / 66 positives -- too few samples.
  Reference: arxiv:2605.21742 confirms tau=pi1 is best for PFN family. TabICLv2 shares
  the ICL prior structure and likely has similar calibration behavior under imbalance.

