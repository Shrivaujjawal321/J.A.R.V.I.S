primary_recommendation_reasoning: |
  Entry point: run TabICLv2 5-fold OOF collection first. Check AUC diagnostic after fold 1
  (approximately 56 seconds on CPU). Entire decision tree collapses to ONE measurement:
  If AUC >= 0.82: proceed to rec_2 (2-model meta with LGB-RFL) and cascade pairing.
  If AUC < 0.75: abort immediately, fall back to rec_3 (LGB-RFL standalone).
  The build risk is time cost (approximately 5 minutes) not compute cost (CPU-only, no GPU needed).

build_sequence: |
  1. pip install tabicl (downloads checkpoint approximately 500MB on first run)
  2. Run TabICLClassifier 5-fold OOF: n_estimators=8, device=None, kv_cache=False, random_state=42
  3. After fold 1 (approximately 56s): if AUC < 0.75 ABORT, go to step 8
  4. Complete 5 folds (approximately 4.7 min total). Apply threshold sweep. Print OOF score.
  5. In parallel: run LGB-RFL standalone OOF (V24 code, remove V4 dependency, approximately 2 min)
  6. Build 2-model meta (tabicl_oof + lgb_rfl_oof) via LR meta + Platt + threshold sweep
  7. If meta OOF > 54.41 AND calibrated LB est > 57.08: candidate for submission
  8. FALLBACK -- LGB-RFL standalone OOF + threshold sweep. If OOF > 54.41: also a candidate.
  9. If best build meta OOF AUC >= 0.890: attach C1_R08 Stage-2 cascade for Hard-FP-10 targeting
  10. Submit best build (1 of 3 daily slots).

