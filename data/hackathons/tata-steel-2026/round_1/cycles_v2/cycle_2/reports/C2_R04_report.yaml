      note: |
        C1_R04_rec_1 proposed TabICLv2 as 4th member added TO V4 stack (V4 retained). THIS
        proposal REMOVES V4 entirely. Different architectural decision. V6 FT-Transformer =
        random-init from-scratch training with backprop on 1352 rows. TabICLv2 = pre-trained
        ICL, zero gradient updates at inference. Not the same model family. V9/V21 = TabPFN v2
        (auth-blocked, different model). No EXHAUSTED overlap.
    expected_lift_oof:
      point: 0.6
      low: -0.5
      high: 2.5
      reasoning: |
        V23 baseline OOF = 54.41 (calibrated LB est 57.08).
        TabICLv2 standalone AUC 0.875 (point) vs V4 meta 0.884 -- slight discriminative gap
        but reproducible. Threshold sweep on this metric should produce approximately 54.0-54.5
        OOF standalone. Gain comes from combining with LGB-RFL (rec_2): expected +0.6-1.2 OOF.
        LOW -0.5: TabICLv2 AUC 0.84, barely helps, meta worse than V23.
        HIGH +2.5: TabICLv2 AUC 0.91+, paired with LGB-RFL = meta AUC 0.90+, OOF approximately
        57, calibrated LB approximately 59.7.
    feasibility:
      score: 4
      effort_hours: 3.0
      dependencies:
        - tabicl>=0.2.0
        - torch>=2.0
        - python>=3.10
      notes: |
        Drop-in. TabICLClassifier sklearn interface (fit / predict_proba). CPU time approximately
        56s per fold, 5 folds = approximately 4.7 min. n_estimators=4 cuts to approximately 2.4 min.
        RAM approximately 0.67 GB per fold (kv_cache=False). First run downloads checkpoint
        approximately 500MB; subsequent runs fully offline. Effort: 1h fold loop, 1h debug, 1h verify.
    confidence:
      score: 3
      evidence_anchor: |
        arxiv:2602.11139 (TabICLv2, ICML 2026): surpasses RealTabPFN-2.5 on TabArena/TALENT,
        approximately 80% win rate over tuned GBDTs zero-shot.
        arxiv:2502.05564 (TabICL v1, ICML 2025): on par with TabPFN v2 across 200 datasets,
        1.5x faster on small datasets.
        mindfulmodeler.substack.com CPU benchmark: 455-row dataset approximately 15s on CPU.
        Extrapolated: 1082-row/49-feat fold approximately 56s.
        Mission Lane Tech Blog (enterprise credit risk, 2M rows): TabICL approximately 84% of
        tuned LGBM AUC zero-shot. ICL competitive even at large scale; stronger advantage at
        small n where GBDTs overfit more.
        Confidence=3 not 4: no published result for TabICLv2 on approximately 1082-row, 49-feature,
        4.88% imbalance industrial anonymized sensor data. Synthetic pretraining mismatch is a risk.
    failure_modes:
      - TabICLv2 pre-trained on SYNTHETIC tabular data. Anonymized X1-X49 features may have statistical signatures (correlated blocks, heavy skew, integer codes) not matching synthetic priors. Result -- near-uniform OOF probas, AUC approximately 0.5-0.6. DIAGNOSTIC -- check OOF AUC after fold 1. If AUC < 0.75 abort immediately.
      - Hard-7 loss risk -- if TabICLv2 assigns low proba to 7 borderline positives (stealth in X1-X49 space per AD findings), recall drops. Mitigation -- threshold sweep applied; ensure all hard-7 above final threshold.
      - CPU RAM spike if kv_cache=True -- 48.8 KB per cell * 53018 cells = approximately 2.6 GB per fold. Keep kv_cache=False (default) to stay at approximately 0.67 GB.
      - Checkpoint download failure in offline environments. Pre-download -- run TabICLClassifier(allow_auto_download=True).fit(X_dummy, y_dummy) on tiny data first.
      - n_estimators=8 default = 8 stochastic forward passes. Set random_state=42 for reproducibility.
    code_sketch: |
      # pip install tabicl
      from tabicl import TabICLClassifier
      import numpy as np
      from sklearn.model_selection import StratifiedKFold
      from sklearn.metrics import roc_auc_score, recall_score, precision_score

      tabicl_oof = np.zeros(len(X_train))
      skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)

      for fold, (tr_idx, val_idx) in enumerate(skf.split(X_train, y_train)):
          X_tr = X_train.iloc[tr_idx]
          X_val = X_train.iloc[val_idx]
          y_tr = y_train.iloc[tr_idx]
          clf = TabICLClassifier(
              n_estimators=8,   # use 4 to halve CPU time to approximately 2.4 min total
              device=None,      # auto: CUDA if available, else CPU
              kv_cache=False,   # caps RAM at approximately 0.67 GB per fold
              random_state=42,
              verbose=False,
          )
          clf.fit(X_tr, y_tr)
          tabicl_oof[val_idx] = clf.predict_proba(X_val)[:, 1]
          fold_auc = roc_auc_score(y_train.iloc[val_idx], tabicl_oof[val_idx])
          print(f"Fold {fold}: AUC = {fold_auc:.4f}")
          if fold == 0 and fold_auc < 0.75:
              raise RuntimeError(f"TabICLv2 diagnostic FAIL (AUC={fold_auc:.4f}). Switch to LGB-RFL fallback.")

      global_auc = roc_auc_score(y_train, tabicl_oof)
      print(f"TabICLv2 standalone OOF AUC: {global_auc:.4f}")

      # Score-aware threshold sweep
      best_score, best_thresh = 0.0, 0.5
      for t in np.unique(tabicl_oof):
          y_pred = (tabicl_oof >= t).astype(int)
          r = recall_score(y_train, y_pred, zero_division=0)
          p = precision_score(y_train, y_pred, zero_division=0)
          s = (r + p) / 2 * 100
          if s > best_score:
              best_score, best_thresh = s, t
      print(f"TabICLv2 standalone OOF score: {best_score:.2f} at T={best_thresh:.5f}")
    test_case_impact:
      hard7_recall: medium
      hard_fp_avoidance: medium
      easy59_regression_risk: low

  - id: C2_R04_rec_2
    title: TabICLv2 + LGB-RFL 2-model meta
    technique_class: architecture
    description: |
      Build a clean 2-model meta-stack: TabICLv2 OOF (rec_1) + LGB-RFL OOF (Cycle 1 confirmed
      +0.0108 AUC over V4-LGB) -- Logistic Regression meta-learner + Platt scaling + threshold
      sweep. Directly replaces the V4 3-model stack with a reproducible, V4-independent
      architecture. Key argument: a TabICLv2 (ICL prior, Bayesian posterior inference) + LGB-RFL
      (gradient boosted trees with robust focal loss) pair offers MORE diversity than 3 correlated
      GBDTs (LGB+XGB+CatBoost all learn similar functions). Expected meta OOF AUC 0.890-0.905.
      If OOF AUC >= 0.890, pair with V23 Stage-2 cascade (C1_R08) for Hard-FP-10 targeting.
    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with: []
      note: |
        V4/V5/V3 used LGB+XGB+CatBoost 3-model stack. This uses TabICLv2+LGB-RFL (2 models,
        completely different model families). LGB-RFL = LGB with Robust Focal Loss (r=0.5, q=0.3),
        different from standard scale_pos_weight LGB. V24 tried LGB-RFL INSIDE V4 stack
        (contaminated). Standalone clean 2-model non-V4 meta has not been tried. Not exhausted.
    expected_lift_oof:
      point: 1.2
      low: 0.0
      high: 3.5
      reasoning: |
        V23 baseline OOF = 54.41 (calibrated LB est 57.08).
        If TabICLv2 AUC=0.875 and LGB-RFL AUC=0.870, the 2-model meta with high diversity
        should reach meta AUC 0.895-0.905. That 1.1-2.1% AUC lift over V4 meta (0.884) should
        translate to approximately 1-2 OOF score points at 4.88% imbalance.
        POINT +1.2: OOF approximately 55.6, calibrated LB approximately 58.3 (new submission candidate).
        HIGH +3.5: TabICLv2 AUC 0.91+, meta 0.92+, OOF approximately 57+, LB approximately 59.7.
        LOW 0.0: if TabICLv2 fails diagnostic, fallback rec_3 matches V23 approximately.
    feasibility:
      score: 4
      effort_hours: 4.0
      dependencies:
        - tabicl>=0.2.0
        - lightgbm>=4.0
        - scikit-learn>=1.4
        - torch>=2.0
      notes: |
        Build on rec_1. Additional: LGB-RFL OOF in same fold loop (V24 code exists, remove V4
        dependency). Total CPU time approximately 4.7 min (TabICLv2) + approximately 2 min (LGB-RFL)
        = approximately 7 minutes. Acceptable. 2-column X_meta for LR meta-learner (L2 C=0.1).
    confidence:
      score: 3
      evidence_anchor: |
        Diversity argument: ICL prior (TabICLv2) + GBDT with focal loss (LGB-RFL) are more
        orthogonal than LGB+XGB+CatBoost. Higher diversity in meta-stack implies better
        meta-learner generalization (Ting & Witten 1999, stacking with heterogeneous learners).
        V4 empirical: 3-GBDT stack meta AUC 0.884 only marginally above best individual 0.889
        (CatBoost) because all three share inductive bias. TabICLv2+LGB-RFL should show larger
        complementarity. LGB-RFL +0.0108 AUC confirmed: Cycle 1 V24 finding.
        Confidence=3: no published result for ICL+GBDT 2-model meta on similar small imbalanced
        industrial data. Diversity gain is theory-backed but not empirically verified on THIS dataset.
    failure_modes:
      - If TabICLv2 OOF probas are near-uniform (synthetic prior mismatch), the 2nd meta column carries no information. Meta-LR degrades to LGB-RFL standalone. MITIGATION -- check TabICLv2 OOF AUC before fitting meta-LR. If < 0.82, drop TabICLv2 column.
      - V10 disaster reminder: DO NOT mean-blend raw probabilities from two independently calibrated models. Always use LR meta-learner on OOF columns. Never direct blend.
      - Meta-overfitting: 2-column LR meta on 1352 rows / 66 positives. Keep L2 C=0.1.
    code_sketch: |
      # Run rec_1 loop first to get tabicl_oof, then in same fold loop:
      lgb_rfl_oof = np.zeros(len(X_train))
      # LGB-RFL params confirmed in Cycle 1 V24 (r=0.5, q=0.3 Robust Focal Loss)
      for fold, (tr_idx, val_idx) in enumerate(skf.split(X_train, y_train)):
          # TabICLv2 OOF already collected above
          lgb = LGBMClassifier(n_estimators=500, learning_rate=0.05, num_leaves=31,
                               min_child_samples=10, subsample=0.8, colsample_bytree=0.8,
                               reg_alpha=0.1, reg_lambda=1.0, random_state=42)
          # apply RFL custom objective (r=0.5, q=0.3) -- see V24 code
          lgb.fit(X_train.iloc[tr_idx], y_train.iloc[tr_idx])
          lgb_rfl_oof[val_idx] = lgb.predict_proba(X_train.iloc[val_idx])[:, 1]

      # 2-column meta stack (NEVER direct blend)
      X_meta = np.column_stack([tabicl_oof, lgb_rfl_oof])
      # Use out-of-fold meta predictions (nested CV) to avoid train-OOF leakage
      meta_oof = np.zeros(len(X_train))
      for fold, (tr_idx, val_idx) in enumerate(skf.split(X_train, y_train)):
          lr = LogisticRegression(C=0.1, max_iter=1000, random_state=42)
          lr.fit(X_meta[tr_idx], y_train.iloc[tr_idx])
          meta_oof[val_idx] = lr.predict_proba(X_meta[val_idx])[:, 1]
      # Threshold sweep on meta_oof
    test_case_impact:
      hard7_recall: high
      hard_fp_avoidance: medium
      easy59_regression_risk: low

