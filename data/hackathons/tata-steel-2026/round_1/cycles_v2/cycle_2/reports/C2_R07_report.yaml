    action: "rec_1 diagnostic (30 min)"
    gate: "Hard-7 median > Hard-FP-10 median for EITHER DevNet/PReNet"
    on_fail: "Drop semi-sup AD track entirely. Redirect to N02 counterfactual FE."
  step_2:
    action: "rec_2 PReNet full CV (90-150 min)"
    gate: "Standalone OOF AUC >= 0.75"
    on_fail: "Try rec_3 DevNet instead"
  step_3:
    action: "rec_3 DevNet full CV + correlation check (60-120 min)"
    gate: "DevNet AUC >= 0.75 AND Pearson r < 0.85 vs PReNet"
    on_fail: "Keep only PReNet (or DevNet if PReNet failed)"
  step_4:
    action: "Retrain V4 stacking harness with 52nd/53rd features"
    target: "OOF score >= 54.31 (V4 baseline), Hard-FP-10 >= 3/10 avoided"

