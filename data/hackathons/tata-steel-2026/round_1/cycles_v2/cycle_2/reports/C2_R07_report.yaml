drill_analysis:

  q1_deep_sad_hypersphere_intuition:
    question: "What would Deep SAD learn that makes Hard-FP-10 score LOWER
      (less anomalous) than Hard-7?"
    answer: |
      Deep SAD objective: pull labeled Y=1 anomalies AWAY from hypersphere
      center, pull unlabeled Y=0 toward center. Center c is fixed at epoch-1
      mean of encoder outputs on training data.

      The problem for Hard-FP-10 avoidance:
      Hard-7 coils have NEAR-NORMAL sensor profiles (that is WHY they are
      hard -- they barely look like defects). Hard-FP-10 coils have elevated
      X14/X49/X41/X46/X48 vs both normals and true positives. They are MORE
      extreme in the raw feature space.

      If Deep SAD places the hypersphere center near the bulk of Y=0 normals
      (where unlabeled training examples cluster), Hard-FP-10's elevated
      temperature/process values would put them FARTHER from center --
      meaning Deep SAD scores them as MORE anomalous, not less.
      The 66 labeled anomalies (Y=1) are pulled away from center, and
      Hard-7 (near-normal profiles) may end up CLOSER to center than
      Hard-FP-10 (elevated profiles). This is the WRONG direction.

      The one scenario where Deep SAD could help:
      If the MLP encoder learns a latent space where the 66 true positives
      form a cluster at a DIFFERENT location than Hard-FP-10 (e.g., true
      positives cluster on extreme X13/X32 while Hard-FP-10 cluster on
      extreme X14/X49), the hypersphere distance in latent space could
      separate them. This requires the encoder to learn non-trivial
      feature interactions with only 1352 training rows.

      Probability of success for Deep SAD: LOW-to-MEDIUM.
      The structural bias of the hypersphere likely scores Hard-FP-10
      as MORE anomalous than Hard-7, not less.

  q2_devnet_vs_deep_sad_score_function:
    question: "How does DevNet score function differ from Deep SAD hypersphere
      distance, and which is better for Hard-FP-10 avoidance?"
    answer: |
      Deep SAD score = ||phi(x) - c||^2
        Euclidean distance from fixed hypersphere center in latent space.
        Unlabeled normals pulled toward c; labeled anomalies pushed away.
        Hard-FP-10 (elevated feature values) may be farther from c
        than Hard-7 (near-normal values) -- scoring Hard-FP-10 as MORE
        anomalous. Wrong direction.

      DevNet score = dev(x), scalar output from MLP
        Loss: for Y=1, push dev(x) >> z (z ~ N(0,1) reference Gaussian).
              for Y=0 (unlabeled/normal), pull dev(x) toward 0.
        Key structural advantage: Hard-FP-10 are labeled Y=0 in TRAINING
        folds. DevNet's loss explicitly pushes their scores toward 0.
        Hard-7 are labeled Y=1; DevNet's loss pushes their scores HIGH.
        In VALIDATION fold, Hard-FP-10 were trained as normal examples
        -- the learned decision function has been optimized to score
        rows like Hard-FP-10 (Y=0) LOW and rows like Hard-7 (Y=1) HIGH.
        This is exactly the separation needed for Hard-FP-10 avoidance.

      CRITICAL INSIGHT: DevNet has a STRUCTURAL ADVANTAGE over Deep SAD
      for this specific problem because its contrastive loss uses labels.
      Hard-FP-10 are Y=0 training examples -- DevNet is explicitly trained
      to score them near 0. Whether this generalizes to the validation fold
      depends on learned geometry, but the loss function is aligned with
      the goal.

      DevNet is the PREFERRED method over Deep SAD for Hard-FP-10 avoidance.
      PReNet (pairwise) is preferred over both because it learns relational
      geometry rather than absolute scores, making it more robust to the
      stealth-defect profile.

  q3_prenet_pairwise_pool_size:
    question: "PReNet with ~53 positives per fold -- is the pairwise pool enough?"
    answer: |
      CORRECTION to C1 R07 brief: The brief stated 169 anomaly-anomaly pairs.
      This appears to be C(13,2) = 78, perhaps using validation fold count.
      Correct calculation for TRAINING fold (5-fold, 66 total positives):
        Training fold positives: 66 * 4/5 = ~53
        Anom-Anom pairs: C(53,2) = 53*52/2 = 1,378 pairs per fold
        Anom-Unlabeled: 53 * ~1021 = ~54,113 pairs per fold
        Unlabeled-Unlabeled: C(1021,2) ~ 521,010 pairs per fold

      1,378 anom-anom pairs is SUFFICIENT. PReNet's original paper experiments
      used datasets with 30-100 labeled anomalies successfully. At 53/fold
      we are in the well-supported regime.

      Real concern: NOT sample size, but DIVERSITY.
      If the 53 anomalies per fold all have similar sensor profiles (stealth
      defects look alike), many anom-anom pairs have near-identical feature
      vectors. The pairwise relation network may learn trivially high
      similarity for anom-anom pairs without discriminating against
      anom-unlabeled pairs. This is a failure mode for stealth/clustered
      anomaly profiles -- exactly our case.

      Conclusion: PReNet is viable on sample-size grounds (1378 pairs,
      not 169). Diversity concern is real but empirical -- run the
      rec_4 diagnostic first to verify separability.

  q4_or_fusion_reverse_rule_game:
    question: "Game out the reverse-rule veto: DevNet says NOT anomaly AND
      V4 says IS anomaly -- flip to negative. Quantify."
    answer: |
      Standard OR-rule (C1 rec_5): predict positive if V4 OR detector flags.
        Effect: more recalls (good), more FPs (bad). Net ambiguous.

      Reverse (AND-rule): predict positive only if V4 AND detector both flag.
        Effect: fewer FPs (some removed), fewer TPs (some lost). Net ambiguous.

      Hybrid Veto (targeted): if DevNet_score < veto_threshold AND
        V4_proba in [0.50, 0.90], force prediction to 0.
        Design rationale: Hard-FP-10 have V4 proba 0.532-0.778.
        Hard-7 have V4 proba 0.014-0.027.
        Setting veto_max_proba = 0.90 protects Hard-7 (all well below 0.90).
        DevNet low-score threshold at P20 of DevNet scores on Y=0 train rows.

      Mathematical ceiling from removing all 10 Hard-FP-10 with zero TP loss:
        Current: 66 TPs, ~700 FPs, Precision = 66/766 = 8.62%, Score = 54.31
        Removing 10 FPs: 66 TPs, 690 FPs, Precision = 66/756 = 8.73%
        New score: (100.0 + 8.73) / 2 = 54.37
        GAIN: +0.06 OOF points.

      BINDING CONSTRAINT: +0.06 is below the bootstrap CI noise floor
      (CI width ~1.0). Removing Hard-FP-10 SPECIFICALLY is not a score lever.
      Hard-FP-10 are 10 of ~700 FPs. Even perfect removal is statistically
      invisible.

      What Hard-FP-10 avoidance ACTUALLY means:
      The Set B gate tests whether the method has LEARNED something new
      about the decision boundary. If DevNet/PReNet correctly identifies
      3+ of the 10 hardest FPs as normal, it likely also provides
      complementary signal for the other ~690 FPs -- the meta-learner
      can use the 52nd feature to globally reduce FPs, yielding a real
      score gain from precision improvement across ALL FPs, not just 10.

      Verdict: Do NOT implement veto rule as primary strategy.
      Pursue DevNet/PReNet as 52nd feature for global FP reduction.
      The veto rule max gain is +0.06 -- not worth the complexity and
      the risk of accidentally dropping a TP.

  q5_deepod_install_cpu_cost:
    question: "deepod install and run cost on CPU laptop."
    answer: |
      Installation:
        pip install deepod
        Installs PyTorch CPU wheel (~700MB download total).
        Time: 3-15 minutes depending on connection.
        No CUDA needed. Force device='cpu' in constructor.

      Runtime on this dataset (1352 rows, 51 features, 5-fold CV):
        DevNet 5-fold: ~60-120 seconds CPU
        PReNet 5-fold: ~120-300 seconds CPU (pairwise sampling overhead)
        Deep SAD 5-fold: ~60-120 seconds CPU
        All three total: ~5-10 minutes CPU.
        Perfectly feasible on a laptop. No GPU required.

      Key constructor flag: device='cpu'
        DevNet(epochs=50, batch_size=64, lr=1e-3, rep_dim=32,
               hidden_dims='100,50', device='cpu', random_state=42)

  q6_best_cycle2_build_strategy:
    question: "52nd feature in V4 base vs Stage-2 abstain signal in cascade?"
    answer: |
      52nd FEATURE in V4 base is higher leverage. Reasons:
      1. Hard-FP-10 all have V4 proba 0.532-0.778, so they all reach Stage-2
         in the cascade anyway. A Stage-2 abstain signal gives binary info
         (abstain/don't abstain). A continuous 52nd feature gives the
         meta-learner a graded signal to weight.
      2. A continuous feature lets LGB/XGB/CatBoost learn a non-linear
         interaction between V4's original features AND the anomaly score.
         This may capture X14/X49/X41 combinations that tree models see
         differently when a dedicated anomaly signal is present.
      3. PReNet is the primary over DevNet for the 52nd feature role, for
         the reasons in q2: more robust to distributional assumptions,
         better generalization via pairwise learning.

      BUT: run rec_4 diagnostic FIRST (30 min). If Hard-FP-10 and Hard-7
      are not separable in DevNet/PReNet score space (both score similarly),
      this entire track should be dropped and budget moved to N02
      counterfactual feature engineering.

recommendations:

  - id: C2_R07_rec_1
    title: "Run separability diagnostic before any semi-sup build"
    technique_class: tactics
    description: |
      Fit DevNet and PReNet on full training data (diagnostic mode, not CV-safe)
      and extract scores for Hard-FP-10 (CoilIDs 689, 642, 247, 189, 279,
      757, 188, 651, 467, 690) and Hard-7 (CoilIDs 1495, 913, 1499, 473,
      624, 1436, 72). Compare medians: if Hard-7 median score > Hard-FP-10
      median score for EITHER method, proceed to CV builds. If BOTH methods
      show Hard-FP-10 scoring HIGHER than Hard-7 (more anomalous), semi-sup
      AD is structurally unable to help and the track should be dropped.
      This diagnostic prevents wasting 4+ hours on a failing direction.
      Implements evals-before-build discipline. Takes 30 minutes.
    novel_vs_v1_v22: true
    dedup_check:
