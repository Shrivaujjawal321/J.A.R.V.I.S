        - "torch>=2.0.0 CPU"
    confidence:
      score: 5
      evidence_anchor: |
        Reasoning-only. Diagnostic cannot fail -- any result is informative.
        Gate pattern is standard ML engineering (probe before commit).
    failure_modes:
      - "Diagnostic uses full training data (leakage by design). Do NOT use these diagnostic scores as model features."
    code_sketch: |
      from deepod.models.tabular import DevNet, PReNet
      import numpy as np, pandas as pd

      hard_fp_ids = [689,642,247,189,279,757,188,651,467,690]
      hard7_ids = [1495,913,1499,473,624,1436,72]
      fp_mask = df_train['CoilID'].isin(hard_fp_ids).values
      h7_mask = df_train['CoilID'].isin(hard7_ids).values

      for ModelClass, name in [(DevNet,'DevNet'),(PReNet,'PReNet')]:
          clf = ModelClass(epochs=50, device='cpu', random_state=42)
          clf.fit(X_train, y=y_train)
          s = clf.decision_function(X_train)
          fp_med = np.median(s[fp_mask])
          h7_med = np.median(s[h7_mask])
          sep = 'YES - proceed to CV' if h7_med > fp_med else 'NO - drop track'
          print(f"{name}: Hard-FP-10 median={fp_med:.4f}, "
                f"Hard-7 median={h7_med:.4f} | Separable: {sep}")
    test_case_impact:
      hard7_recall: none
      hard_fp_avoidance: high
      easy59_regression_risk: none

  - id: C2_R07_rec_2
    title: "PReNet OOF score as 52nd feature (primary)"
    technique_class: feature_engineering
    description: |
      PReNet (Pang KDD 2023) learns anomaly scores via pairwise relation
      prediction across three pair types: (anomaly,anomaly), (anomaly,unlabeled),
      (unlabeled,unlabeled). For this dataset: 53 positives per training fold
      yield C(53,2)=1378 anom-anom pairs, well above the 30-100 used in the
      original paper's experiments (correcting C1 brief error of 169 pairs).
      PReNet outperforms DevNet on 12 real-world tabular datasets in the
      KDD 2023 paper and is the recommended primary candidate. Its pairwise
      design learns relational geometry between anomaly clusters and normal
      regions rather than single-instance scoring, making it more robust to
      the stealth-defect profile. OOF scores (fitted inside each CV fold)
      are added as the 52nd column in the augmented feature matrix passed
      to the LGB/XGB/CatBoost meta-learner. Gate: standalone OOF AUC >= 0.75
      before adding to stack (if below 0.75, the score adds noise not signal).
      PREREQUISITE: rec_1 diagnostic must show separability (Hard-7 median
      score > Hard-FP-10 median score) before running full CV build.
    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with: []
      note: "All 6 Cycle-1C AD methods were UNSUPERVISED (no label access).
        PReNet is semi-supervised (uses Y=1 labels explicitly). Different class."
    expected_lift_oof:
      point: 1.0
      low: -0.2
      high: 2.5
      reasoning: |
        Pang et al. KDD 2023: PReNet significantly outperforms DevNet and 9
        other methods on 12 tabular datasets. ADBench NeurIPS 2022 shows
        semi-supervised methods (PReNet included) average 0.862 AUC vs
        0.811 for best unsupervised baseline at 1%+ label ratio (our ratio
        4.88%). Point estimate 1.0 is conservative given stealth-defect
        finding. Low bound -0.2 accounts for score decorrelation failure.
        High bound 2.5 if PReNet captures a genuinely orthogonal signal
        that reduces the ~700 FP count meaningfully.
    feasibility:
      score: 4
      effort_hours: 2.5
      dependencies:
        - "deepod>=0.3.0"
        - "torch>=2.0.0 (CPU, ~700MB install)"
    confidence:
      score: 3
      evidence_anchor: |
        Pang et al. "Weakly Supervised Anomaly Detection." KDD 2023.
        ACM DL doi:10.1145/3580305.3599302. arXiv:1910.13601.
        GitHub: github.com/mala-lab/PReNet.
        ADBench NeurIPS 2022 (arXiv:2206.09426): semi-supervised methods
        evaluation on 57 datasets; PReNet listed as top performer.
        Confidence=3: stealth-defect finding is strong contrary evidence;
        rec_1 diagnostic is mandatory gate before committing to full build.
    failure_modes:
      - "53 positives/fold all have similar stealth profiles. Anom-anom pairs are near-identical vectors. Pairwise loss converges without discriminative geometry."
      - "CPU runtime: 120-300s per run. Acceptable but slower than DevNet."
      - "Score correlated with DevNet if both driven by same top features (X13/X10/X32). Check correlation before adding both."
      - "deepod PReNet API: clf.fit(X_tr, y=y_tr) where y is raw 0/1 int array. Verify API matches deepod version installed."
    code_sketch: |
      from deepod.models.tabular import PReNet
      import numpy as np
      from sklearn.model_selection import StratifiedKFold
      from sklearn.metrics import roc_auc_score

      prenet_oof = np.zeros(len(X_train))
      skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)

      for fold, (tr_idx, val_idx) in enumerate(skf.split(X_train, y_train)):
          X_tr, X_val = X_train[tr_idx], X_train[val_idx]
          y_tr = y_train[tr_idx].astype(int)
          clf = PReNet(epochs=50, batch_size=64, lr=1e-3,
                       hidden_dims='100,50', rep_dim=32,
                       device='cpu', random_state=42 + fold)
          clf.fit(X_tr, y=y_tr)
          prenet_oof[val_idx] = clf.decision_function(X_val)

      auc = roc_auc_score(y_train, prenet_oof)
      print(f"PReNet standalone OOF AUC: {auc:.4f}")
      # Gate: if auc >= 0.75 --> add as 52nd feature
      if auc >= 0.75:
          X_train_aug = np.column_stack([X_train, prenet_oof])
          # Continue with V4 stacking harness on X_train_aug
    test_case_impact:
      hard7_recall: medium
      hard_fp_avoidance: medium
      easy59_regression_risk: low

  - id: C2_R07_rec_3
    title: "DevNet OOF score as 52nd feat (fallback/complement to PReNet)"
    technique_class: feature_engineering
    description: |
      DevNet (Pang KDD 2019) trains an MLP to produce deviation scores:
      labeled Y=1 anomalies pushed high (far above N(0,1) reference),
      labeled Y=0 normals pulled toward 0. Structural advantage for
      Hard-FP-10: these rows are labeled Y=0 in training folds, so
      DevNet's loss function explicitly trains to score them LOW. When
      they appear in validation folds, the trained network has learned
      that profiles like Hard-FP-10 should score near 0. Whether this
      generalizes depends on feature-space geometry. Run as complement
      to PReNet: if Pearson correlation between DevNet_oof and PReNet_oof
      scores is below 0.85, add both as 52nd and 53rd features for the
      meta-learner. If correlation >= 0.85, keep only the higher-AUC one.
      DevNet runs faster than PReNet (60-120s vs 120-300s CPU).
      Same AUC gate applies: skip if standalone OOF AUC < 0.75.
    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with: []
    expected_lift_oof:
      point: 0.8
      low: -0.2
      high: 2.0
      reasoning: |
        DevNet: Pang et al. KDD 2019 (arXiv:1911.08623): 3-29% AUC-ROC
        improvement over unsupervised baselines on tabular benchmarks.
        ADBench NeurIPS 2022 confirms semi-supervised advantage at 1%+ label
        ratio. Slightly lower ceiling than PReNet based on KDD 2023 comparison.
        Conservative estimate; actual gain conditional on rec_1 diagnostic.
    feasibility:
      score: 4
      effort_hours: 2.0
      dependencies:
        - "deepod>=0.3.0 (same install as rec_2)"
    confidence:
      score: 3
      evidence_anchor: |
        Pang et al. "Deep Anomaly Detection with Deviation Networks." KDD 2019.
        arXiv:1911.08623. doi:10.1145/3292500.3330871.
        ADBench NeurIPS 2022 (arXiv:2206.09426): 57 datasets, 7 semi-sup
        methods. DevNet outperforms all unsupervised baselines at 1%+ ratio.
    failure_modes:
      - "DevNet OOF score correlated with tree-stack proba (both use X13/X10/X32 signal). Correlation check with PReNet is mandatory before adding as separate feature."
      - "Hard-FP-10 may still score HIGH in validation folds if their feature profile is similar to Y=1 profiles in the latent MLP space, despite being Y=0 in training."
      - "MLP convergence with 13 val positives per fold: OOF scores have high fold-to-fold variance. Use fixed random_state=42+fold for reproducibility."
    code_sketch: |
      from deepod.models.tabular import DevNet
      import numpy as np
      from scipy.stats import pearsonr

      devnet_oof = np.zeros(len(X_train))
      for fold, (tr_idx, val_idx) in enumerate(skf.split(X_train, y_train)):
          X_tr, X_val = X_train[tr_idx], X_train[val_idx]
          semi_y = y_train[tr_idx].astype(int)
          clf = DevNet(epochs=50, batch_size=64, lr=1e-3,
                       rep_dim=32, hidden_dims='100,50',
                       device='cpu', random_state=42 + fold)
          clf.fit(X_tr, y=semi_y)
          devnet_oof[val_idx] = clf.decision_function(X_val)

      devnet_auc = roc_auc_score(y_train, devnet_oof)
      print(f"DevNet standalone OOF AUC: {devnet_auc:.4f}")

      if devnet_auc >= 0.75 and prenet_auc >= 0.75:
          r, _ = pearsonr(devnet_oof, prenet_oof)
          print(f"DevNet-PReNet Pearson r: {r:.3f}")
          if r < 0.85:
              X_aug = np.column_stack([X_train, prenet_oof, devnet_oof])
          else:
              best_oof = prenet_oof if prenet_auc >= devnet_auc else devnet_oof
              X_aug = np.column_stack([X_train, best_oof])
    test_case_impact:
      hard7_recall: medium
      hard_fp_avoidance: medium
      easy59_regression_risk: low

