# ===== EXECUTIVE SUMMARY =====
#
# C1's R10_rec_1 (Mondrian split-conformal + uncertainty-gated abstain) was
# deferred to Cycle 2. This drill *empirically tests* it on V23 OOF and V4 OOF.
#
# VERDICT: Mondrian conformal as a post-hoc abstain layer DOES NOT MOVE THE
# NEEDLE on Hard-FP-10. Every abstain rule tried regresses (R+P)/2 vs the
# V23 baseline 54.41. The structural problem is invariant under conformal
# wrapping: the 10 FPs are CONFIDENTLY WRONG, not uncertain. Their per-class
# non-conformity scores are LOW in the {1} direction (the model commits) and
# HIGH in the {0} direction (model rejects class 0). Mondrian's class-1
# quantile (built from 66 true positives with similar score distributions)
# comfortably accepts them.
#
# The only path where conformal helps is INTEGRATED with a stronger Stage-1
# (N01 v4-replacement): if a new model produces lower class-1 probas for
# Hard-FP-10 than for true positives, THEN Mondrian's quantile flags them
# as ambiguous / non-conforming. Post-hoc on V4/V23 it cannot.
#
# Recommend: DROP Mondrian as a Cycle-2 production component. Keep it as
# a DIAGNOSTIC INSTRUMENT for measuring Stage-1 quality in N01.

# ===== EMPIRICAL EVIDENCE =====

evidence_v23_oof:
  setup: |
    OOF parquet: build_v23/oof_v23.parquet (1352 rows; 516 stage-1 gated-out;
    836 stage-2 suspects). Aligned with train.csv via CoilID. 5-fold split
    reconstructed via StratifiedKFold seed=42 (matches V4 split).
  mondrian_method: |
    Mondrian (class-conditional) cross-conformal. Non-conformity score:
      s(x, y=0) = p_hat[1]        # high p1 = nonconforming for y=0
      s(x, y=1) = 1 - p_hat[1]    # low p1 = nonconforming for y=1
    For each fold f, calibration = other 4 folds restricted to stage-2 suspects.
    q0 = ceil((n0+1)(1-alpha))/n0 quantile of {s_j : y_j=0, j in cal}
    q1 = ceil((n1+1)(1-alpha))/n1 quantile of {s_j : y_j=1, j in cal}
    Class c in prediction set iff s_test_c <= q_c.

  v23_set_size_distribution_alpha_0.10:
    size_0_non_conforming: 516
    size_1_confident: 338
    size_1_in_0_only:  243     # confident negatives
