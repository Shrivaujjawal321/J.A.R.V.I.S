# ===== ANSWERS TO THE 5 DRILL QUESTIONS =====

q1_mondrian_intervals_for_hard_fp_10: |
  Each of the 10 Hard-FP-10 CoilIDs is "CONFIDENTLY FP" not "uncertain":
  - Under V4 Mondrian (alpha=0.10): all 10 land in V4_size=1 ({1}-only).
    The model is confidently wrong.
  - Under V23 Mondrian (alpha=0.10): 6 of 10 are confident {1}, 4 of 10 are
    ambiguous {0,1}. V23's cascade Stage-2 sees slightly wider intervals
    on 4 rows but not enough to demote them.
  - Even at alpha=0.20, 8 of 10 remain confident-{1} under V23.
  - At alpha=0.30 all 10 become size=1 again because q drops below most rows.

  Direct CI interpretation (alpha=0.10, q0_med=0.604, q1_med=0.915):
    class 0 in set iff p_v23 <= 0.604
    class 1 in set iff p_v23 >= 0.085
  All 10 HFPs have p_v23 in [0.399, 0.818] - above 0.085 (so class 1 always
  in set), 6 above 0.604 (so class 0 NOT in set, single {1}), 4 below (so {0,1}).

q2_abstain_rule_rp2_impact: |
  See abstain_rule_oof_score_table above. Bottom line:
  - Naive Mondrian (abstain on size>=2): -29 to -5 OOF depending on alpha.
  - Best Pareto-positive (Rule F): drops -6.25 OOF AND kills all 7 Hard-7.
  - Best near-no-op (Rule G a=0.30): matches baseline exactly (becomes a no-op
    because q is so wide that size=1 for every row).
  - NO tau/alpha combination outperforms the V23 baseline.

  Reason: when the meta-classifier is OVER-CONFIDENT on certain false positives
  (their proba lies INSIDE the class-1 prediction set at every reasonable alpha),
  Mondrian's class-conditional quantile cannot separate them. Structural limit
  of conformal prediction.

q3_mapie_drop_in_effort: |
  MAPIE 0.8+ drop-in:
  - Install: pip install mapie>=0.8 (Python 3.10+, no GPU)
  - Code: ~30 lines (MapieClassifier with method='aps' or 'lac', cv='prefit')
  - Wiring into V23 harness: V23's meta_model is already prefit; cross-conformal
    across existing 5 folds is what this drill emulated WITHOUT MAPIE.
  - Total: 4-6 hours including unit tests + parquet integration.
  - VERDICT: MAPIE itself is trivial; the drop-in fails for the SAME reason
    the manual implementation does - the underlying score distribution makes
    Hard-FP-10 conform to the class-1 calibration set. MAPIE will produce
    identical (R+P)/2 outcomes.
  - DO NOT spend MAPIE engineering time unless N01 produces a new Stage-1.

q4_cross_test_v4_vs_v23: |
  Yes, V4 Mondrian and V23 Mondrian produce DIFFERENT abstain sets. The
  cross-table at alpha=0.10:

    V4_size:         1       2
    V23_size=0     516       0       # stage-1 gated-out
    V23_size=1     216     122
    V23_size=2     231     267

  - 122 rows V4 calls confident-{1} but V23 calls ambiguous {0,1}.
  - 231 rows V4 calls confident-{0} but V23 says ambiguous {0,1}.
  - 267 rows BOTH ambiguous.
  - 216 rows BOTH confident-{1}.

  Stage-1-quality angle: on Hard-FP-10 the disagreement is in the WRONG
  direction. V4 says all 10 confident-{1}, V23 demotes 4 of 10 to ambiguous.
  Demoting these 4 to 0 = +precision but the model still flags 6 of 10
  confidently AND we sacrifice recall (40 real positives also fall in
  V23-ambiguous, V4-confident-{1} bucket - many would lose pred=1).

  The Stage-1-quality angle DOES work cleanly as a DIAGNOSTIC: if a new
  N01 Stage-1 (TabICLv2, deep ensemble, etc.) produces V_new Mondrian sets
  where the 10 Hard-FPs shift toward ambiguous OR confident-{0} while real
  positives remain confident-{1}, that's a strong quality signal - a no-LB
  proxy.

q5_hard_7_worst_case: |
  Worst case for Set A is CATASTROPHIC:
  - Rule F (abstain when BOTH conformal sets include class 0): drops ALL 7
    Hard-7 to 0. Recall on Set A = 0/7. Violates Set A floor.
  - All Hard-7 have V4 proba 0.014-0.027 (just at V4's chosen threshold).
    These probas are BELOW V4's q0 (~0.22 median) - V4 confidently includes
    class 0 (V4_in0=True for all 7).
  - Any abstain rule keyed on V4_in0=True drops all of Hard-7.

  Bottom-line worst case under Rule F:
    Hard-7 recall: 0/7 (vs 7/7 baseline)
    (R+P)/2: 48.16 (vs 54.41 baseline)
    Predicted LB: ~50.8 (vs banked 56.98)
    NET: -6.18 LB if shipped. UNSAFE.

# ===== UPDATED RECOMMENDATIONS =====

recommendations:
  - id: C2_R10_rec_1
    title: Mondrian as Stage-1-quality DIAGNOSTIC (not abstain rule)
    technique_class: calibration
    description: |
      Repurpose Mondrian conformal as a non-destructive DIAGNOSTIC layer
      that runs alongside (not after) any new Stage-1 candidate. Compute
      two diagnostic scores:
        D1 = fraction of Hard-FP-10 with V_new size != 1 (or in0=True)
        D2 = fraction of Hard-7  with V_new in1=True (preserved as confident-pos)
      Use (D1, D2) as a no-LB-cost quality gate on N01 candidates. A Stage-1
      that drives D1 > 0.5 AND keeps D2 >= 0.7 is a real architectural win;
      one that doesn't move D1 above ~0.4 is not solving Hard-FP-10 and
      shouldn't be promoted to submission.
    novel_vs_v1_v22: true
    dedup_check:
      conflicts_with: []
    expected_lift_oof:
      point: 0.0
      low:   0.0
      high:  0.0
      note: "Diagnostic only. Indirect value: prevents wasting build cycles on N01 candidates that don't address Hard-FP-10."
    feasibility:
      score: 5
      effort_hours: 2.0
      dependencies:
        - mapie>=0.8 (optional)
        - numpy
        - existing OOF parquet for each candidate Stage-1
    confidence:
      score: 5
      evidence_anchor: |
        Empirical: V4 vs V23 Mondrian sets meaningfully differ (620 rows of
        disagreement) and correlate with cascade architecture choice.
        Vovk et al "Mondrian Confidence Machine" (2003).
    failure_modes:
      - If N01 candidates have identical Mondrian profiles on HFP-10 (e.g.
        all descend from V4-style trees), D1 is uninformative.
      - Class-1 quantile is noisy at n=66 positives; needs bootstrap CI for
        honest comparison between candidates.
    code_sketch: |
      def mondrian_sets(p_oof, y, fold_id, alpha=0.10):
          in0 = np.zeros(len(p_oof), dtype=bool)
          in1 = np.zeros(len(p_oof), dtype=bool)
          for f in np.unique(fold_id):
              cal = (fold_id != f)
              s0 = p_oof[cal & (y==0)]
              s1 = 1 - p_oof[cal & (y==1)]
              q0 = np.quantile(s0, np.ceil((len(s0)+1)*(1-alpha))/len(s0))
              q1 = np.quantile(s1, np.ceil((len(s1)+1)*(1-alpha))/len(s1))
              te = (fold_id == f)
              in0[te] = p_oof[te] <= q0
              in1[te] = p_oof[te] >= (1 - q1)
          return in0, in1
      in0, in1 = mondrian_sets(p_v_new, y, fold_id, alpha=0.10)
      d1 = ((in0 & in_hfp) | ~(in1 & in_hfp)).sum() / len(hard_fp)
      d2 = (in1[in_h7]).sum() / len(hard_7)
      promote = (d1 > 0.5) and (d2 >= 0.7)
    test_case_impact:
      hard7_recall: none
      hard_fp_avoidance: none
      easy59_regression_risk: none
    cycle_2_role: |
      Run BEFORE any N01 candidate is promoted to Stage-2 cascade or
      pseudo-labeling. Saves submissions and computes a no-LB-cost proxy.

