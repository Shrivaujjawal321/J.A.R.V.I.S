    feasibility:
      score: 3
      effort_hours: 4.5
      dependencies:
        - "gplearn==0.4.2  # NOT installed -- pip install gplearn==0.4.2"
        - scikit-learn>=1.4
        - shap>=0.42
        - numpy>=1.24
      notes: |
        3.0h install + code + overnight run; 1.5h expression audit + SHAP
        prune.  gplearn NOT currently installed (confirmed).  Feasibility 3
        not 4: long runtime blocks daytime iteration; expression audit
        requires human judgment on physical plausibility.
    confidence:
      score: 3
      evidence_anchor: |
        Stephens T. "gplearn: Genetic Programming in Python."
        GitHub: https://github.com/trevorstephens/gplearn (BSD 3-Clause).
        PyPI: gplearn 0.4.2.

        Tran et al. "Improving Generalization of Genetic Programming for
        High-Dimensional Symbolic Regression with Shapley Value Based Feature
        Selection." Data Science and Engineering, Springer, 2024.
        DOI: 10.1007/s41019-024-00270-x. Shows SHAP pre-filtering improves
        GP generalization on high-dimensional tabular data.

        Bertschinger et al. "Interpretable Genetic Programming with
        SHAP-guided Multi-objective Optimization." Evolutionary Intelligence,
        Springer, 2025. DOI: 10.1007/s12065-025-01125-8.  Directly validates
        SHAP attribution + GP interpretability for overfitting pruning.

        Confidence 3 (not 4): direct evidence on imbalanced binary classification
        with <100 positives is absent.  SHAP+GP synergy established in regression
        literature; classification with 66 positives is an extrapolation.
    failure_modes:
      - id: fm1_fitness_misalignment
        description: |
          Pearson correlation fitness on binary y with 4.88% positives is weak
          signal (typical r=0.05-0.20).  GP selects spuriously correlated
          expressions just above the noise floor.
        mitigation: |
          Cross-fold consistency filter (>=3/5 folds) eliminates single-fold
          lucky correlations.  Physical plausibility prune removes constant-heavy
          trees.  SHAP AUC gate (>0.65) eliminates marginal features.

      - id: fm2_rediscovery
        description: |
          V4 already contains X13_over_X36, X13_minus_X36.  GP with access to
          these engineered features WILL rediscover variants of them.
        mitigation: |
          Post-generation: correlate each discovered expression feature with
          existing V4 features.  If Spearman r > 0.85 with any existing V4
          feature, discard.  Canonicalize expression strings to catch algebraic
          equivalents.

      - id: fm3_runtime
        description: |
          5-fold x 60-175 min/fold = 60-175 min total.  Blocks other experiments
          if run on same machine during working hours.
        mitigation: |
          Dispatch as overnight batch job.  Serialize 5 folds (each uses n_jobs=-1
          internally, cannot parallelize folds without additional scaffolding).

      - id: fm4_seed_variance
        description: |
          GP is stochastic.  Two runs with different random_state produce
          different expression sets.  OOF lift is seed-dependent.
        mitigation: |
          If time permits: run 3 seeds per fold (random_state=42,43,44), take
          union of expressions, apply fold-consistency filter across 15 runs.
          If tight: single seed, accept higher variance.

      - id: fm5_hard_fp_may_be_inseparable
        description: |
          All 4 Cycle 1 builds failed Set B.  Structural feature-space issue.
          If X48/X49/X14/X40 do not jointly separate hard FPs, no GP expression
          over these 15 features will find the boundary either.
        mitigation: |
          Accept this risk explicitly.  gplearn here is a DISCOVERY tool:
          if it fails Set B too, this is conclusive evidence that Hard-FP-10
          are fundamentally inseparable within X1-X49 space, and N02
          (counterfactual FE) should be the sole remaining hope.

    code_sketch: |
      # pip install gplearn==0.4.2

      import numpy as np
      from gplearn.genetic import SymbolicTransformer
      from sklearn.model_selection import StratifiedKFold
      from collections import Counter

      TOP15 = [
          "X13_over_X36", "X36", "X14", "X13_minus_X36", "X16",
          "X18", "X40", "X23", "X48", "X21", "X6",
          "iso_score", "X38", "X7", "X49"
      ]
      X = train_df[TOP15].values.astype(float)
      y = train_df["Y"].values

      skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)
      fold_expressions = []

      for fold_i, (tr_idx, val_idx) in enumerate(skf.split(X, y)):
          gp = SymbolicTransformer(
              population_size=2000,
              generations=30,
              hall_of_fame=100,
              n_components=10,
              function_set=("add", "sub", "mul", "div", "sqrt", "log", "abs"),
              parsimony_coefficient=0.005,  # KEY: raised from default 0.001
              max_samples=0.9,              # subsampling reduces overfit
              metric="pearson",
              random_state=42,
              n_jobs=-1,
              verbose=0
          )
          gp.fit(X[tr_idx], y[tr_idx])
          formulas = [str(prog) for prog in gp._programs[-1] if prog is not None]
          fold_expressions.append(formulas)

      # Cross-fold consistency filter (>=3/5 folds to pass)
      all_formulas = [f for fold in fold_expressions for f in fold]
      formula_counts = Counter(all_formulas)
      stable = [f for f, cnt in formula_counts.items() if cnt >= 3]
      print(f"Stable expressions: {len(stable)}")
      for f in stable:
          print(f"  [{formula_counts[f]}/5 folds]  {f}")

      # Physical plausibility filter: manually review stable list
      # REJECT: depth>4, expressions with numeric constants >10
      # KEEP: short 2-3 variable ratios/products

      # SHAP AUC gate: for each surviving expression,
      # compute marginal AUC contribution on OOF (standard lgb wrapper)

    test_case_impact:
      hard7_recall: low
      hard_fp_avoidance: medium_high
      easy59_regression_risk: low
      notes: |
        First gplearn rec to assign medium_high to Set B (Hard-FP-10 avoidance).
        Upgrade justified by:
          1. Explicit inclusion of X48, X49 (hard-FP cluster markers) in input.
          2. Physical plausibility filter allows human rejection of spurious
             X48/X49 expressions vs plausible ones.
          3. Cross-fold consistency filter reduces spurious single-fold Set B
             improvements.
        Hard-7 recall stays low: hard-7 coils are stealth in X1-X49 space
        regardless of engineered features (confirmed by AD null result and
        4x Cycle 1 cascade failures).
        Easy-59 regression risk is low: gplearn adds NEW features without
        replacing existing V4 signals.

# =====================================================================
# SECTION 6 — INTEGRATION WITH CYCLE 2 BUILDS
# =====================================================================

cycle_2_integration:
  primary_use_case: |
    gplearn output feeds into a NEW Stage-1 build (N03 stage-1-replacement),
    NOT into the frozen V4 stack.  Workflow:
      1. Run gplearn 5-fold to discover stable expressions.
      2. Add <=5 surviving expressions to the 15-feature input set.
      3. Rebuild Stage-1 from scratch (LGB-RFL or TabICLv2 per N01/N03)
         on the augmented feature set.
      4. Run full V4-style CV to measure OOF delta.
    Do NOT append gplearn features to V4 and retrain V4's CatBoost.
    CatBoost OOF 0.8756 cannot be reproduced (confirmed C1 finding).

  sequencing_recommendation: |
    Run N02 (counterfactual FE) FIRST to identify which feature dimensions
    matter for Hard-FP-10.  N02 takes ~1-2h.  Then re-examine gplearn
    input list to confirm those dimensions are included, and run gplearn
    overnight.  Morning: audit expressions against N02 counterfactual
    targets.

  synergies:
    - N02_hard_fp_counterfactual: |
        N02 identifies minimal feature changes for Hard-FP-10.  If N02
        identifies "lower X48 by 0.003" as key counterfactual, gplearn's
        X48/(X49+eps) expression directly operationalises that finding.
    - N03_stage1_replacement: |
        gplearn expressions are drop-in features for any Stage-1 model.
        LGB-RFL (+0.0108 AUC, C1 confirmed) can be augmented with 2-3
        gplearn expressions without architectural change.
    - R10_mondrian_conformal: |
        Mondrian conformal targets Hard-FP-10 via abstain rule.  If gplearn
        discovers a strong X48/X49 expression, the conformal predictor can
        use it as an additional nonconformity feature.
    - R13_rec_1_openfe: |
        OpenFE for breadth, gplearn for interpretable depth.  Run both
        if time permits; gplearn gets priority for Set B work.

  what_NOT_to_do:
    - "Do NOT run gplearn on all 51 V4 features -- search space too large,
       convergence too slow, rediscovery rate too high."
    - "Do NOT use parsimony=0.001 (default) -- will produce depth-6+ trees
       that memorise 53-positive fold-train."
    - "Do NOT skip cross-fold consistency filter -- single-fold GP expressions
       on 66 positives are overwhelmingly noise."
    - "Do NOT add gplearn features to frozen V4 -- CatBoost OOF 0.8756 cannot
       be reproduced; any modification will regress."
    - "Do NOT interpret Pearson fitness as predictive power -- Pearson r=0.15
       on binary y is nearly uncorrelated; always validate with held-out AUC."

# =====================================================================
# SECTION 7 — VERDICT
# =====================================================================

verdict:
  recommend: true
  priority_within_cycle_2: medium
  timing: |
    Dispatch AFTER N02 returns target feature dimensions (1-2h).
    Run gplearn overnight.  Audit expressions next morning.
  one_liner: |
    gplearn at pop=2000/gen=30 on 15 SHAP features with parsimony=0.005,
    cross-fold consistency filter (>=3/5 folds), and physical plausibility
    prune is the ONLY technique that can discover AND audit interpretable
    formulas targeting Hard-FP-10.  Its edge over OpenFE is not raw lift
    but the ability to prune overfit expressions before they reach the model
    -- critical at 1352 rows / 66 positives where spurious correlation is
    the dominant failure mode.

