# =====================================================================
# PREAMBLE — WHY THIS DRILL EXISTS
# =====================================================================
# C1 ranked gplearn SymbolicTransformer BELOW OpenFE (rec_2 vs rec_1).
# C1 downgrade reasons:
#   (a) GP at population_size=500, 20 gen, 10 inputs is slow and noisy
#   (b) Fitness = correlation with y, not (R+P)/2
#   (c) High rediscovery risk (V4 already has X13/X36, X13*X10)
#
# Cycle 2 task: re-examine with upgraded config (pop=2000, 30 gen,
# 15-input restricted search), interpretability-based prune pass,
# and honest CV-stratified overfitting budget.  The key question:
# Does gplearn's INTERPRETABILITY advantage justify its cost vs OpenFE?
#
# Answer: YES, specifically for the Hard-FP-10 problem — but ONLY if
# evolved expressions are SHAP-pruned and physically plausible.
# OpenFE can discover the same correlation signal but you cannot prune
# its spurious features post-hoc without guessing.  gplearn gives you
# the formula; you can reject log(X13/0.001) as overfit nonsense.
# =====================================================================

# =====================================================================
# SECTION 1 — UPGRADED CONFIGURATION ANALYSIS
# =====================================================================

configuration_analysis:
  proposed_params:
    population_size: 2000
    n_components: 10
    hall_of_fame: 100
    function_set: ["add", "sub", "mul", "div", "sqrt", "log", "abs"]
    generations: 30
    parsimony_coefficient: 0.001
    max_samples: 1.0
    n_jobs: -1
    random_state: 42
    metric: pearson

  input_feature_restriction:
    strategy: "top-15 SHAP from V4"
    features:
      - X13_over_X36    # rank 1 engineered ratio
      - X36             # roll campaign position
      - X14             # coiling temperature
      - X13_minus_X36   # rank 3 engineered diff
      - X16             # unknown numerical
      - X18             # finishing temperature (Ar3 range, physics key)
      - X40             # integer categorical (13 unique)
      - X23             # unknown numerical
      - X48             # elevated in hard FP cluster (0.0089 vs 0.0041)
      - X21             # unknown numerical
      - X6              # coiling temperature family (520-760 C)
      - iso_score       # V4 isolation forest meta-score
      - X38             # unknown numerical
      - X7              # unknown numerical
      - X49             # elevated in hard FP (0.055 vs 0.034)
    rationale: |
      Restricting to 15 inputs reduces the effective search space from
      O(51^2 * 7) = 18207 candidate tree primitives to O(15^2 * 7) = 1575.
      This improves convergence speed ~12x and reduces spurious term discovery.
      Critically, the 15 features include BOTH the primary signal cluster
      (X13_over_X36, X36, X14, X18) AND the hard-FP discriminating cluster
      (X48, X49, X14, X40 -- the features where hard FPs deviate most from
      true positives).  This is the correct search scope.

  parsimony_coefficient_assessment:
    proposed_value: 0.001
    verdict: TOO_LOW_FOR_THIS_DATASET
    recommended_value: 0.005
    reasoning: |
      Default parsimony=0.001 was designed for 10k+ row regression datasets.
      At 1352 rows / 66 positives:
        - Pearson fitness is computed on the full fold train (~1082 rows,
          ~53 positives).  Signal-to-noise is ~1:20 for the positive class.
        - GP trees at pop=2000 over 30 generations WILL bloat toward complex
          expressions (depth 5-8) that fit the 53-positive training distribution
          but do not generalize.  Bloat is especially severe when fitness plateau
          is hit early (typically gen 10-15 on noisy targets).
        - parsimony=0.001 penalises a depth-5 tree by only 0.005 fitness units,
          negligible when fitness variance is 0.02-0.05 across programs.
        - Setting 0.005 adds 0.025 penalty per extra depth level, meaningfully
          biasing selection toward simpler 2-3 node expressions like X13/X18
          or log(X36+1) rather than X13*sqrt(X48/(X18-X36+X14)).
      Evidence: gplearn docs example uses parsimony=0.0005 with pop=2000 on a
      100-row dataset.  Proportional scaling to 1352 rows suggests 0.002-0.010
      range.  We pick 0.005 as middle ground.

  runtime_estimate:
    dataset_size: 1352
    fold_train_size: 1082
    population_size: 2000
    generations: 30
    n_jobs: 8
    per_fold_estimate_minutes:
      low: 12
      mid: 20
      high: 35
    five_fold_total_minutes:
      low: 60
      mid: 100
      high: 175
    notes: |
      GitHub issue reference: pop=1000, gen=30 on cancer dataset (569 rows)
      ran in 19s.  Cancer has 30 features; ours has 15.  Scaling factor:
      (1082/569) * (2000/1000) * 1.0 (fitness complexity ~equal) ~= 3.8x
      gives ~72s/fold, ~360s total = 6 min optimistic.  However Pearson
      fitness on imbalanced target (53/1082 positives) is much noisier,
      causing slower convergence per generation.  Practical multiplier
      2-5x gives 12-35 min/fold, 60-175 min total.
      VERDICT: feasible within 8-day deadline if run overnight.
      Do NOT run interactively.

# =====================================================================
# SECTION 2 — OVERFITTING BUDGET
# =====================================================================

overfitting_budget:
  dataset_stats:
    train_rows: 1352
    positives: 66
    prevalence: 0.0488
    fold_train_positives_per_fold: 53
    folds: 5

  gp_overfitting_mechanics: |
    SymbolicTransformer fitness = Pearson(transformed_feature, y_labels).
    Problem: with 53 positives in fold-train, the fitness landscape has
    MANY local optima.  Simple random interactions between features can
    achieve Pearson r=0.10-0.20 purely by chance, enough to be selected.
    Over 30 generations at pop=2000:
      - Early gens 1-8: discover genuine broad-signal features (X13/X18,
        X36-based ratios already in V4).
      - Mid gens 9-20: start exploiting noise.  Expressions with specific
        numerical constants dominate.
      - Late gens 21-30: deep trees that fit training positives exactly
        but fail on held-out fold.
    hall_of_fame=100 + n_components=10 pruning reduces redundancy but does
    NOT prune overfit features.

  cross_fold_consistency_filter:
    description: |
      MANDATORY: each fold gets its own independent SymbolicTransformer.
      The 5 ST instances discover DIFFERENT expressions (seed-dependent,
      converges to different local optima).  This is a FEATURE:
      cross-fold expression consistency is an overfitting signal.
      If expression X appears in 4/5 folds, it is likely real.
      If it appears in 1/5, it is noise.
    threshold: ">=3 of 5 folds"
    implementation: |
      After fitting 5 fold-STs, collect the string representation of
      each discovered formula.  Canonicalize (sort commutative operands).
      Count fold-frequency.  Retain only features with fold_frequency >= 3.
      Strict but justified for 1352-row / 66-positive regime.

  shap_prune_protocol:
    description: |
      For each retained expression feature, compute SHAP values on full
      OOF predictions.  Compare SHAP magnitude to V4 bottom-quartile
      features (the weakest 13 of V4's 51 features).
      If SHAP(new_feature) < V4_bottom_quartile_SHAP, drop it.
    auc_gate: |
      Gate by per-feature AUC >= 0.65 on OOF predictions (marginal AUC
      computed by adding only that feature to a baseline LGB).
    interpretability_prune: |
      PHYSICAL PLAUSIBILITY FILTER (gplearn key advantage over OpenFE):
        REJECT: expressions with large numeric constants (e.g. X18 - 891.3)
                -- these are memorised training-set constants, not physics.
        REJECT: depth > 4 tree expressions.
        KEEP: log(X13/X18), sqrt(X36), X13*(X18-X14), X48/X49
              -- these map to plausible physical ratios.
      This filter is IMPOSSIBLE with OpenFE (black-box feature names like
      'feature_0012_combined').  It is the primary justification for
      using gplearn despite its lower expected raw lift.

# =====================================================================
# SECTION 3 — TARGET EXPRESSION CLASSES
# =====================================================================

target_expression_classes:
  - class: temperature_ratio
    exemplar: "X13 / (X18 - X14)"
    physics_mapping: |
      X18=finishing temp (~880C), X14=coiling temp (~640C).
      Ratio encodes the thermal gradient between finishing stand and coiler.
      Larger gradient = faster cooling = higher martensite risk = alpha defect.
    already_in_v4: partial
    novelty: medium

  - class: campaign_position_log_interaction
    exemplar: "log(X36 + 1) * X13"
    physics_mapping: |
      X36=roll campaign position.  log(X36+1) compresses the heavy tail
      (rolls 0-100 are fresh/worn differently from 2000-4380).  Multiplied
      by X13 (roll force proxy) = effective force-wear compound.
    already_in_v4: partial
    novelty: medium

  - class: hard_fp_discriminator
    exemplar: "X48 / (X49 + epsilon)"
    physics_mapping: |
      Hard-FP-10 have elevated X48 (0.0089 vs 0.0041 true positives)
      AND elevated X49 (0.055 vs 0.034).  True positives have LOWER X48
      and LOWER X49.  Ratio X48/X49 captures simultaneous elevation of
      both -- the hard-FP signature, NOT the true-positive signature.
    already_in_v4: false
    novelty: high
    set_b_relevance: HIGHEST_PRIORITY

  - class: finishing_temp_deviation
    exemplar: "abs(X18 - 880)"
    physics_mapping: |
      X18=finishing temperature (858-918C, centered on Ar3 ~880C).
      Distance from Ar3 transition = how far from the alpha/gamma phase
      boundary during rolling.  Defects cluster near the boundary.
    already_in_v4: false
    novelty: medium

  - class: coiling_temp_threshold
    exemplar: "X6 - 600"
    physics_mapping: |
      X6=coiling temperature (520-760C).  Coiling below ~600C risks
      excessive dislocation density -> alpha defects.  GP may discover
      this threshold as a subtracted offset.
    already_in_v4: false
    novelty: medium_low

# =====================================================================
# SECTION 4 — gplearn vs OpenFE COMPARISON
# =====================================================================

gplearn_vs_openfe:
  openfe_advantages:
    - "Faster: 10-30 min total vs 60-175 min for gplearn 5-fold"
    - "LightGBM-residual fitness is closer to tree-model utility than Pearson"
    - "Broader operator coverage at lower noise floor"
    - "Better benchmarked on Kaggle-style tabular (ICML 2023)"

  gplearn_advantages:
    - name: human_readable_prune
      verdict: DECISIVE_ADVANTAGE_FOR_HARD_FP_INVESTIGATION
      description: |
        gplearn produces "X48 / X49" -- you can READ it, check if it maps
        to physical intuition, and REJECT "X13 * (X18 - X7 * X48 + 3.14)"
        as nonsense.  OpenFE features are named 'combined_feature_0018'
        with no formula.  You cannot distinguish a real physics ratio from
        a spurious 5-way interaction.

    - name: overfitting_visibility
      verdict: MATERIAL_ADVANTAGE
      description: |
        When GP overfits, it produces expressions with specific constants
        (e.g. X13 - 127.34) -- visually obvious as data-memorisation.
        OpenFE overfits silently; you only see degraded OOF score.

    - name: hard_fp_10_target
      verdict: TARGETED_ADVANTAGE
      description: |
        Hard-FP-10 are not separable by V4's 51 features at current
        precision.  The hope is a specific short formula involving X48,
        X49, X14, X40 capturing "elevated-X48-AND-elevated-X49 but not
        extreme-X13" -- the hard FP signature.  gplearn's constrained
        function search on 15 SHAP features with physical plausibility
        filter is the safest way to look for this formula without
        manufacturing noise.

  recommendation: |
    gplearn is COMPLEMENTARY to OpenFE, not a competitor.  Run both
    if time permits.  If only one slot: OpenFE for raw OOF lift;
    gplearn for Set B (Hard-FP-10) improvement.  Given Set B is the
    binding constraint in Cycle 2, gplearn gets priority over OpenFE.

# =====================================================================
# SECTION 5 — FULL RECOMMENDATION
# =====================================================================

recommendations:
  - id: C2_R13b_rec_1
    title: "gplearn ST: 15-SHAP, parsimony=0.005, fold-consistent prune"
