    All 4 OOF parquets confirmed on disk (build_v*/oof_*.parquet).
    V4/V25/V26 are standard 1352-row meta-proba parquets.
    V23 has cascade structure: fold=-1 rows (516) get oof_proba=0.0 hard zero (Stage-1
    rejects); folds 1-5 (836 rows) are Stage-2 outputs.
    Rank transform: scipy.stats.rankdata(p, method='average') / (n+1). Global (1352 rows).
    Blend: average rank vectors. Threshold: isolated re-sweep on blended OOF only.
    Fold alignment: all models trained on same seed=42 5-fold StratifiedKFold on 1352 rows.
    Same CoilID order confirmed.

