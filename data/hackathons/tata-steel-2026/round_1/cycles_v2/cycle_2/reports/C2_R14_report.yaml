drill_3_per_fold_vs_global_rank:
  per_fold_V4V26_oof: 52.7801
  global_V4V26_oof: 54.6875
  difference_pts: -1.9074
  verdict: GLOBAL_RANK_STRICTLY_BETTER
  reasons:
    - "Small fold size (~270 rows): within-fold ranking compresses all 13 positives into top 5%,
      making blend scores cluster near 0.50 and the threshold sweep noisy."
    - "V23 fold=-1 rows (38% of train) have no fold assignment -- per-fold ranking is undefined
      for these rows, requiring a fallback that breaks within-fold consistency."
    - "Global rank (1352 rows): positives consistently rank in top 5-15%, giving stable
      separation. Bootstrap std is only marginally higher (0.908 vs 0.766)."
  decision: Use global rank blend exclusively.

drill_4_calibration_delta_for_blend:
  delta_preserved: true
  reasoning: |
    +2.67 OOF->LB delta is a DATA property (test prevalence 6.49% > train 4.88%), not a
    model-scale property. Rank-blend is order-preserving, so test/train rank distributions
    stay aligned. Delta should hold for the blend.

    Mathematical estimate for V4+V26 blend:
      OOF flags at T=0.44863: 704 / 1352 = 52.1% flagged on train.
      On test at equivalent percentile: ~177 / 339 flags. With ~22 test positives:
      P_test = 22/177 = 12.4% vs OOF P = 9.38%.
      Score_test = (100 + 12.4)/2 = 56.2. Delta = 56.2 - 54.69 = +1.51.
    Wait -- this gives a smaller delta. Let's use the more conservative estimate:
      V4's 154 flags / 339 = 45.4% flag rate. V4+V26 has 704/1352 = 52.1% OOF flag rate.
      Higher flag rate = more precision dilution on test too.
      Conservative cal_LB = 54.69 + 2.0 = 56.69. Still above banked 56.98? No, marginally below.
    
    HONEST DOWNSIDE: If blend flag rate (52.1%) translates to test at same rate, and test has
    ~22 positives in 339 rows, then precision_test ~ 22/177 = 12.4%, score_test ~ 56.2,
    delta ~ +1.51, cal_LB ~ 56.2 vs banked 56.98. This is a DOWNSIDE scenario.

    UPSIDE: Historical delta [+2.60, +2.67] was measured when flag rate was ~154/1352 OOF =
    11.4%. V4+V26's OOF flag rate 52.1% is much higher. BUT: the test flag rate is what
    matters, not OOF. At T=0.44863 on test ranks (full test+OOF ranking), the test flags will
    be close to the OOF percentile. This is the calibration uncertainty.

    RECOMMENDATION: Use T=0.440 (lower than OOF-optimal 0.44863) to reduce flag count from
    704 to ~660 and improve precision. The OOF score at T=0.440 is marginally lower but the
    test-set precision will improve. Run the code and check T=0.440 score before submitting.

  critical_inference_note: |
    For test-set rank computation: MUST rank on OOF+test concatenated, extract test portion.
    This ensures test ranks are in the same [0,1] scale as OOF blend ranks, so T applies.
    Do NOT rank test set alone (different n -> different scale -> threshold mismatch).

drill_5_is_rank_blend_a_blend:
  ban_override_recommendation: LIFT_THE_BAN
  v10_root_cause: "Carried V5's raw-proba threshold to blended distribution with different scale."
  rank_blend_fix: "Re-sweep threshold on blended rank distribution. Mismatch impossible."
  legal_argument: |
    The V10 ban was: 'do not combine model outputs without re-optimizing the decision
    boundary to the combined distribution.' That is EXACTLY what isolated threshold does.
    Rank-blend with isolated T satisfies the ban's spirit (avoid threshold mismatch) while
    combining models.

    V4 itself is a blend: LGB + XGB + CatBoost -> Logistic Regression meta-learner.
    Nobody banned that. Rank-blend is structurally identical (multi-model -> combined signal
    -> new threshold), just using rank normalization instead of LR meta-learner.

    Result: ONE prediction per row, ONE threshold, ONE submission CSV.
    It is NOT 'blending submissions.' It is a scoring-function design choice.
    The ban should be lifted for this specific technique.

