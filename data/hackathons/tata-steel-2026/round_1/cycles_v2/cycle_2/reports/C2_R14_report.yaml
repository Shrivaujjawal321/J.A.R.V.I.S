      upside_scenario: "Full +2.67 delta holds -> cal_LB 57.36."
    feasibility:
      score: 5
      effort_hours: 1.5
      dependencies:
        - "build_v4/test_meta_v4.parquet -- confirmed on disk"
        - "build_v26/test_meta_v26.parquet -- needs verification"
        - "scipy.stats.rankdata -- in .venv"
        - "No retraining"
    confidence:
      score: 4
      evidence_anchor: |
        Numbers computed from actual OOF parquets. V10 root cause directly addressed.
        Rank-blend technique: Deotte (Kaggle GM); Niculescu-Mizil & Caruana 2005.
    failure_modes:
      - "CoilID 1495 threshold margin near zero. Mitigate: use T=0.440 safety floor."
      - "Hard-FP-10 not addressed (structural, expected)."
      - "V26 test parquet needs existence check before writing code."
      - "Test delta contraction possible (flag rate 52% OOF may reduce test precision delta)."
    code_sketch: |
      from scipy.stats import rankdata
      import pandas as pd, numpy as np

      oof4  = pd.read_parquet('build_v4/oof_v4.parquet')
      oof26 = pd.read_parquet('build_v26/oof_v26.parquet')
      tr    = pd.read_parquet('build_v4/train_v4.parquet')
      y, n  = tr['Y'].values, len(tr)

      p4  = oof4['oof_meta'].values
      p26 = oof26['oof_meta'].values
      r4  = rankdata(p4,  method='average') / (n+1)
      r26 = rankdata(p26, method='average') / (n+1)
      blend_oof = (r4 + r26) / 2

      # Isolated sweep
      best_s, best_T = 0, 0
      for T in sorted(set(blend_oof)):
          pr = (blend_oof >= T).astype(int)
          TP = ((pr==1)&(y==1)).sum(); FP = ((pr==1)&(y==0)).sum(); FN = ((pr==0)&(y==1)).sum()
          R = TP/(TP+FN); P = TP/(TP+FP) if (TP+FP)>0 else 0
          s = (R+P)/2*100
          if s > best_s: best_s, best_T = s, T
      safe_T = max(best_T - 0.01, 0.43)  # CoilID 1495 protection

      # Test inference -- CRITICAL: rank on OOF+test concatenated
      t4  = pd.read_parquet('build_v4/test_meta_v4.parquet')
      t26 = pd.read_parquet('build_v26/test_meta_v26.parquet')
      p4c  = np.concatenate([p4,  t4['meta_proba'].values])
      p26c = np.concatenate([p26, t26['meta_proba'].values])
      r4c  = rankdata(p4c,  method='average') / (len(p4c)+1)
      r26c = rankdata(p26c, method='average') / (len(p26c)+1)
      blend_test = (r4c[n:] + r26c[n:]) / 2
      preds = (blend_test >= safe_T).astype(int)
      print(f"Flags: {preds.sum()}/{len(preds)}, OOF score: {best_s:.4f}, T={safe_T:.5f}")
    test_case_impact:
      hard7_recall: high
      hard_fp_avoidance: none
      easy59_regression_risk: low

