# ============================================================
# REPRODUCIBILITY
# ============================================================
reproducibility:
  data_alignment_v23: "build_v23/oof_v23.parquet merged on CoilID with train.csv"
  data_alignment_v4: "build_v4/oof_v4.parquet positional with build_v4/train_v4.parquet"
  fold_protocol_nested_cv: "StratifiedKFold(n_splits=5, shuffle=True, random_state=42)"
  bootstrap_protocol: "numpy default_rng(42), B=1000, sampling with replacement"
  shrinkage_protocol: |
    Log-odds shrinkage: w = n_pos(g) / (n_pos(g) + k0)
    lo_g = logit(T_g_raw); lo_glob = logit(T_global)
    T_g_shrunk = sigmoid(w * lo_g + (1-w) * lo_glob)
  eligibility_rule: "grade has >=10 OOF rows AND >=1 positive; else fallback to global T"
  raw_results_artifact: /tmp/c2_r15_results.json

# ============================================================
# CRITIQUE / SELF-REVIEW
# ============================================================
self_review:
  strength: |
    Rigorous nested CV exposed the in-sample overfit. V4 control disambiguated
    "method works on V23 only" vs "method is broken in this regime" --
    confirmed the latter. Bootstrap T distribution measurement showed
    R15_rec_3 mechanism does not apply.
  weakness: |
    Did not test R15_rec_2 (per-fold median T) because fold_id missing from
    V23 OOF. Did not run full Bayesian per-grade T (Beta-Binomial prior).
    Did not test grade-CLUSTER (rather than grade-individual) thresholds.
  unresolved_risk: |
    The pivot (rec_4 prevalence-anchored T) is conjecture -- it could be a
    LB-only win and OOF cannot validate it. If a builder banks it, must
    cost 1 HE slot to test. Lower priority than C2_N01/C2_N02/C2_R04.

closing: |
  Per-grade threshold + EB shrinkage is FALSIFIED for V23 (honest nested CV
  delta = -1.39). Bootstrap-conservative T is a NULL lever (argmax already
  at distribution mode). V25 grade-aware features failed for the same
  reason per-grade T fails: X11 information is already saturated by the
  base stack. Carry-forward: drop both R15_rec_1 and R15_rec_3; consider
  prevalence-anchored T (C2_R15_rec_4) only as a hedge after higher-leverage
  Cycle 2 candidates are exhausted.
