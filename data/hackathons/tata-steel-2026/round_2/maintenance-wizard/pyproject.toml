[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "maintenance-wizard"
version = "0.1.0"
description = "Agentic AI Maintenance Decision-Support for Steel Plants — Tata Steel AI Hackathon 2026 Round 2"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ujjawal Shrivastav", email = "shriva.ujjawal@gmail.com" }]
requires-python = ">=3.10"
keywords = ["maintenance", "predictive", "agentic-ai", "steel", "industrial"]

dependencies = [
    # Core schema/config
    "pydantic>=2.7,<3", "pydantic-settings>=2.3", "sqlmodel>=0.0.18",
    "sqlalchemy>=2.0", "alembic>=1.13", "python-ulid>=2.2",
    # Agentic
    "langgraph>=0.2.40", "langgraph-checkpoint-sqlite>=2.0", "langchain-core>=0.2.38",
    # RAG
    "lancedb>=0.13", "sentence-transformers>=3.0", "transformers>=4.41,<4.46",
    "flashrank>=0.2", "pymupdf4llm>=0.0.17",
    # LLM
    "litellm>=1.40", "ollama>=0.3", "instructor>=1.5",
    # ML
    "lifelines>=0.29", "scikit-learn>=1.5", "lightgbm>=4.3",
    "networkx>=3.3", "numpy>=1.26,<2", "scipy>=1.13,<1.16", "pandas>=2.2",
    # Data gen
    "faker>=26.0", "mimesis>=18.0", "jinja2>=3.1",
    # Backend
    "fastapi>=0.110", "uvicorn[standard]>=0.30", "httpx>=0.27",
    "apscheduler>=3.10,<4", "tenacity>=8.5", "pybreaker>=1.2",
    "structlog>=24.0", "sse-starlette>=2.1", "python-multipart>=0.0.9",
    # UI
    "streamlit>=1.37", "plotly>=5.22",
    # Utils
    "pyyaml>=6.0", "python-dotenv>=1.0", "rich>=13.7", "typer>=0.12", "requests>=2.32",
    # NOTE: install CPU torch separately:
    #   pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
]

[project.optional-dependencies]
extras = [
    # best-effort — install if available; system degrades gracefully without them
    "langgraph-supervisor", "mem0ai", "chromadb", "tsfresh", "river>=0.21,<0.22",
    "shap<0.46", "dowhy<0.13", "arize-phoenix", "deepeval", "ragas",
    "openinference-instrumentation-langchain",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4.10",
    "httpx>=0.27",          # already in main, listed for clarity
]
finetune = [
    # stretch goal — Qwen2.5-3B QLoRA fine-tune
    "unsloth==2025.12.3",
    "trl>=0.9.0",
]

[project.scripts]
wizard = "wizard.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["wizard*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
