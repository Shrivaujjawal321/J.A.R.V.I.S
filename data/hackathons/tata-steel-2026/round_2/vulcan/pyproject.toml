[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan"
version = "0.1.0"
description = "VULCAN — agentic Maintenance Wizard for industrial steel equipment (persona: EDITH). Claude Max subscription brain, no API key, keyless local RAG/ML, deterministic fallback."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ujjawal Shrivastav" }]
license = { text = "Proprietary — Tata Steel R2 hackathon submission" }

# Core deps. The Claude brain runs on the SUBSCRIPTION via claude-agent-sdk + OAuth
# token — NEVER a paid API key. Everything else is local / CPU / free.
dependencies = [
  "claude-agent-sdk>=0.1.8",
  "sentence-transformers>=2.2",
  "flashrank>=0.2",
  "chromadb>=0.4",
  "polars>=0.20",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "scipy>=1.10",
  "streamlit>=1.30",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["vulcan*"]

[project.scripts]
vulcan-config = "vulcan.config:get_settings"
