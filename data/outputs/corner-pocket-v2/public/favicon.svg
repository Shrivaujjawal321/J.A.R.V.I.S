<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#0a0d0a"/>
  <!-- Simplified snooker table top-down -->
  <rect x="4" y="8" width="24" height="16" rx="2" fill="#1a6b46"/>
  <!-- Pockets -->
  <circle cx="4" cy="8" r="2" fill="#0a0d0a"/>
  <circle cx="28" cy="8" r="2" fill="#0a0d0a"/>
  <circle cx="4" cy="24" r="2" fill="#0a0d0a"/>
  <circle cx="28" cy="24" r="2" fill="#0a0d0a"/>
  <circle cx="16" cy="8" r="1.5" fill="#0a0d0a"/>
  <circle cx="16" cy="24" r="1.5" fill="#0a0d0a"/>
  <!-- Cue ball -->
  <circle cx="16" cy="16" r="2.5" fill="#fffdf8"/>
</svg>
