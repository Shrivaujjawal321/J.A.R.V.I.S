- id: agentic-01
  title: DebateMind — Multi-Agent Adversarial Fact-Checker with Grounded Retrieval
  tagline: Two Debater agents take opposing stances + RAG-grounded briefs + Moderator verdict
  problem_statement: >
    Misinformation is a 2026 tier-1 problem. Snopes/PolitiFact are slow, manual, opaque.
    MIRAGE (Oct 2025 arXiv 2510.17590), DebateCV (Apr 2026 arXiv 2507.19090), Tool-MAD
    (Jan 2026 arXiv 2601.04742) prove pattern is research-validated but no clean OSS
    streamable demo exists.
  real_pain: >
    Perplexity/ChatGPT give single-perspective retrieval. Nobody shipped dual-agent debate
    + moderator with per-agent retrieval traces and live streaming UI. X/Reddit daily cry
    for "show me the sources on both sides" tool.
  rag_technique: multi-agent+CRAG
  agentic_loops:
    - "Router classifies claim type (factual/causal/predictive)"
    - "Debater-PRO plans retrieval, calls web-search + vector DB, drafts argument with inline citations"
    - "Debater-CON does same independently"
    - "Moderator reads both briefs, identifies contradictions, CRAG-style corrective retrieval if gaps"
    - "Moderator writes structured verdict (Supported/Refuted/Insufficient) with confidence + provenance"
    - "Self-reflection: re-evaluates if confidence <0.7 → third retrieval round"
  tool_use:
    - "web_search: Tavily / Brave Search API"
    - "vector_db: Qdrant — PolitiFact, FullFact exports"
    - "reranker: Cohere Rerank 3"
    - "structured_output: Pydantic v2"
    - "streaming: Vercel AI SDK 6"
  buildable_in_hours: 9
  complexity_score: 8
  portfolio_leverage_score: 10
  unique_angle: >
    Adversarial retrieval pattern is 2026 SOTA research contribution. Live streaming debate
    UI is visual wow factor.
  references:
    - "DebateCV (arXiv 2507.19090) — adversarial debate-driven claim verification"
    - "MIRAGE (arXiv 2510.17590) — multimodal misinformation agentic framework"
    - "Tool-MAD (arXiv 2601.04742) — tool-equipped multi-agent debate"
    - "MA-RAG (arXiv 2505.20096) — multi-agent collaborative CoT"

- id: agentic-02
  title: PostMortem Pilot — Agentic SRE Incident Investigator with Memory-Augmented RAG
  tagline: Hypothesis-driven retrieve-validate loops + memory self-improvement
  problem_statement: >
    SRE teams spend 60-90 min/incident writing postmortems manually. PagerDuty, incident.io,
    AWS DevOps Agent launched AI SRE features in 2026 — all enterprise. No OSS LangGraph-
    native postmortem agent. Memory-augmented pattern (agent writes own outputs back to
    vector DB) is 2026 SOTA (MemRL, Graphiti bitemporal) — no clean OSS demo.
  real_pain: >
    GitHub issues on LangChain/LangGraph repeatedly ask for "navigate-not-just-search" code/
    log understanding agent.
  rag_technique: memory-augmented+agentic
  agentic_loops:
    - "Triage: classify alert severity, extract service + error type"
    - "Retrieval: hybrid BM25+vector over past postmortems + runbooks"
    - "Hypothesis planner: 3-5 root-cause hypotheses (structured)"
    - "Per hypothesis: tool-call to simulated metrics/log query — supporting/refuting evidence"
    - "CRAG validator: replan query if ambiguous"
    - "Synthesis: rank hypotheses by evidence strength"
    - "Postmortem writer: structured doc with inline citations"
    - "Memory ingestion: completed postmortem upserted to vector store (self-improvement)"
  tool_use:
    - "vector_db: Qdrant — runbooks + past postmortems"
    - "hybrid_search: BM25 + Voyage embeddings"
    - "simulated_metrics_api: tool stub for synthetic data"
    - "memory_writer: Qdrant upsert after each postmortem"
  buildable_in_hours: 10
  complexity_score: 8
  portfolio_leverage_score: 9
  unique_angle: >
    Self-improvement loop = direct 2026 SOTA signal (MemRL, Graphiti). Hypothesis-validate-
    retry mirrors Anthropic extended-thinking + tool-use.
  references:
    - "AWS blog: agentic SRE using DevOps Agent (2026)"
    - "incident.io AI SRE guide 2026"
    - "mem0.ai State of AI Agent Memory 2026"
    - "Zep Graphiti — bitemporal episodic memory"

