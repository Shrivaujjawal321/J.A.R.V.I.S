- id: agentic-04
  title: MetaRAG Oracle — Self-RAG Agent for Large Codebases
  tagline: Multi-layer index (summaries/functions/deps) + adaptive retrieval decisions
  problem_statement: >
    Every developer entering large unfamiliar codebase spends hours tracing flows. Copilot
    Chat is context-window-limited, single retrieval pass. ICSE AGENT 2026 paper "Meta-RAG
    on Large Codebases Using Code Summarization" shows 79.8% compression via summary-first
    indexing. Self-RAG (agent decides WHEN to retrieve, not retrieval-then-generate) is
    2025-2026 SOTA with no clean OSS codebase-specific demo.
  real_pain: >
    GitHub issues on LangChain/LlamaIndex repeatedly ask for "navigate-not-just-search" code.
  rag_technique: Self-RAG+multi-layer
  agentic_loops:
    - "Ingestion: clone repo → per-file LLM summaries → function-level chunks → dep graph"
    - "Query router: classify (bug-trace/architecture/API-usage/change-impact)"
    - "Self-RAG decision: should I retrieve? At what layer? (summary/function/raw)"
    - "Retrieve: hybrid BM25+vector at chosen layer"
    - "Relevance critic (ISREL): retrieved context useful? Replan if not"
    - "Reasoning: synthesise, determine sufficiency"
    - "ISSUP/ISUSE self-assessment: supported? useful? Loop if no"
    - "Structured answer: CodeExplanation schema with code pointers"
  tool_use:
    - "github_api: clone, list files, raw content"
    - "llm_summariser: Haiku per-file summaries (cost-efficient)"
    - "vector_db: Qdrant dual-namespace (summaries + functions)"
    - "hybrid_search: BM25 + Voyage voyage-code-3"
    - "dep_graph: tree-sitter + NetworkX"
  buildable_in_hours: 10
  complexity_score: 9
  portfolio_leverage_score: 9
  unique_angle: >
    Self-RAG adaptive decisions + Meta-RAG summary compression (cites ICSE AGENT 2026)
    signals bleeding-edge reading. Dual-namespace + dep graph traversal goes beyond
    "chat with your docs." voyage-code-3 = embeddings-domain awareness.
  references:
    - "Meta-RAG on Large Codebases — ICSE AGENT 2026"
    - "Code RAG: Making LLMs Understand Large Codebases (dasroot.net, Apr 2026)"
    - "Self-RAG (Asai et al. 2023)"
    - "Voyage AI voyage-code-3"

